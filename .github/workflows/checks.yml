# The gate this repo already claims to have.
#
# README and CONTRIBUTING both assert what must pass before a change ships.
# Until this file existed, nothing off the maintainer's machine had ever tested
# that assertion, and `scripts/signals.sh` said so: `ci: unavailable`, which
# caps `score.sh` at 60 — "no upstream CI status: nothing built or tested this
# change off this machine". That cap was telling the truth.
#
# WHAT THIS FILE IS NOT. There is no build step, because there is no artifact:
# this is a plugin marketplace, and what ships is the source. A build step here
# would be theatre.
name: checks

on:
  pull_request:
  push:
    branches: [main]
    # Tags too. A release tag was reachable from a green branch and had never
    # been checked as a tag, so nothing asserted that the commit a consumer
    # installs is the commit that passed.
    tags: ['v*']

# `pull_request`, never `pull_request_target`. The latter runs with the base
# repo's token and secrets against a fork's code, on a public repo, before
# anyone has looked at the diff. There is nothing here that needs it.

# This job reads code. That is the whole scope. Everything not listed is
# dropped, so a step that gets compromised has no token worth stealing.
permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  # Supersede an in-flight PR run: it is testing code nobody is proposing any
  # more. Do NOT cancel on main — that run is the permanent record for a
  # commit, and a cancelled one reads as `failure` to signals.sh.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Third-party actions are pinned to a full commit SHA. A major-version
      # tag is mutable: whoever can move it can swap the code that checks out
      # this repo, on a runner holding a token. The trailing comment records
      # which release each SHA was, because a bare SHA tells a reader nothing
      # about whether it is current.
      #
      # Moved 2026-09-13 off v4 / v4 / v5, which declare `using: node20` and
      # which the runner annotated as forced onto Node 24 on every run. Each new
      # SHA below is the commit the named tag resolves to in that action's own
      # repository (`gh api repos/<action>/git/refs/tags/<tag>`, a lightweight
      # tag, type `commit`), and `action.yml` at that SHA reads `using: node24`.
      # The only inputs this file passes - fetch-depth, node-version,
      # python-version - are still declared there.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The Stage 5 gate diffs against a base commit. A shallow clone has
          # no base to diff against, and run-checks.sh reads an unresolvable
          # base as a usage error rather than as "nothing changed" — correct,
          # and useless if the history was never fetched.
          fetch-depth: 0

      # Pinned runtimes, so a runner-image bump cannot change what was checked
      # without a diff saying so.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # run-checks.sh reads checks.yaml with PyYAML and REFUSES when the module
      # is missing rather than guessing what was declared - which is the correct
      # behaviour and is why every run before this one was red. Pinned, because
      # an unpinned install here decides what parses the file that decides what
      # executes.
      - name: PyYAML, which the runner refuses to work without
        run: python3 -m pip install --disable-pip-version-check 'PyYAML==6.0.2'

      # The declared `sast` check runs semgrep, and a declared tool that is
      # absent refuses the stage. Pinned to the version the check was measured
      # against locally, 1.171.0, whose PyPI release carries a manylinux_2_34
      # x86_64 wheel. In its OWN venv rather than beside PyYAML: semgrep 1.171.0
      # declares 27 direct dependencies on Linux, and none of them gets to change the
      # interpreter that parses checks.yaml. Its dependencies are not pinned -
      # only semgrep itself is - and that is a gap, not a lockfile.
      #
      # ONLY `semgrep` REACHES PATH. v4.58.0 appended the venv's whole `bin/` to
      # $GITHUB_PATH, and that directory holds the venv's own `python3` and
      # `pip`. Every later step's `python3` became the venv interpreter, which
      # has no PyYAML, and Stage 5 refused: "python3 has no yaml module". The
      # entry point is symlinked into a directory holding nothing else. Its
      # shebang names the venv interpreter by absolute path, so it still runs
      # there, and semgrep's entry point appends its own scripts directory to
      # PATH inside its own process to find `pysemgrep` - read from
      # `semgrep/console_scripts/entrypoint.py` at 1.171.0. Homebrew installs
      # semgrep in exactly this shape: its `bin/semgrep` is a symlink into a
      # private venv.
      - name: semgrep, which the declared sast check runs
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/semgrep-venv"
          "$RUNNER_TEMP/semgrep-venv/bin/python" -m pip install --disable-pip-version-check 'semgrep==1.171.0'
          mkdir -p "$RUNNER_TEMP/tools-bin"
          ln -s "$RUNNER_TEMP/semgrep-venv/bin/semgrep" "$RUNNER_TEMP/tools-bin/semgrep"
          echo "$RUNNER_TEMP/tools-bin" >> "$GITHUB_PATH"

      # The declared `secret-scan` check runs gitleaks. Pinned to v8.30.1, the
      # version installed where the check was falsified, and verified BEFORE
      # anything is extracted. The expected hash is written here rather than
      # read from the release's checksums file at run time: a file fetched from
      # the same place as the tarball can only confirm the tarball matches
      # whatever that place serves today. Read 2026-09-13 from
      # `gitleaks_8.30.1_checksums.txt` (999 bytes, itself sha256
      # 061476c21adaf5441516f96f185c1a4706a83cd6329b9b38762271b3d4a52fae), and
      # equal to the `digest` GitHub's release API reports for the 8,230,402-byte
      # asset. `sha256sum -c` exits non-zero on a mismatch and `set -e` stops the
      # step there. Only the `gitleaks` member is extracted, into the same
      # one-purpose directory as semgrep.
      - name: gitleaks, which the declared secret-scan check runs
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          tgz="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$tgz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "${GITLEAKS_SHA256}  ${tgz}" | sha256sum -c --strict -
          mkdir -p "$RUNNER_TEMP/tools-bin"
          tar -xzf "$tgz" -C "$RUNNER_TEMP/tools-bin" gitleaks
          chmod 0755 "$RUNNER_TEMP/tools-bin/gitleaks"
          "$RUNNER_TEMP/tools-bin/gitleaks" version

      # THE INTERPRETER THAT PARSES checks.yaml, ASSERTED WHERE IT COULD BREAK.
      # v4.58.0's semgrep step put a second `python3` first on PATH, and nothing
      # failed until Stage 5 refused many steps later, naming PyYAML and not
      # the step that caused it. This runs straight after every step that
      # writes $GITHUB_PATH, so the same mistake fails here, by name.
      - name: Guard — python3 is still the interpreter with PyYAML
        run: |
          set -euo pipefail
          py="$(command -v python3)"
          echo "python3: $py"
          case "$py" in
            "$RUNNER_TEMP"/*)
              echo "::error::python3 resolves under \$RUNNER_TEMP ($py): a tool install leaked its interpreter onto PATH"
              exit 1 ;;
          esac
          if ! python3 -c 'import yaml; print("PyYAML", yaml.__version__)'; then
            echo "::error::python3 ($py) cannot import yaml. A step above changed which python3 later steps get; run-checks.sh would refuse at Stage 5."
            exit 1
          fi

      # FAIL CLOSED, FIRST. Every tool below is asserted present here so a
      # missing one is a named failure at the top of the log, not a check that
      # quietly did not run. This is the same rule run-checks.sh enforces
      # internally: a declared tool that is absent FAILS its check, it is never
      # skipped. CI must not undercut that.
      - name: Preflight — tools this job refuses to run without
        run: |
          set -euo pipefail
          missing=()
          for tool in git python3 node npm shellcheck semgrep gitleaks; do
            command -v "$tool" >/dev/null 2>&1 || missing+=("$tool")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::not on PATH: ${missing[*]}"
            exit 1
          fi
          git --version
          python3 --version
          node --version
          # The shellcheck binary comes from the runner image, not from the npm
          # package run with `npx --yes shellcheck`. That package is not the upstream project: it is a
          # single-maintainer wrapper that downloads a binary at run time, and
          # `--yes` resolves `latest` with no lockfile and no integrity pin. In
          # CI the payout is small — no secrets, a read-only token — but the
          # same line runs on the machine of anyone who clones this repo and
          # runs the checks stage, with their home directory and their
          # credentials. Two unpinned hops for a linter is not a trade worth
          # making.
          shellcheck --version
          semgrep --version --disable-version-check
          gitleaks version

      # Pinned exactly. `claude plugin validate` is the gate on both manifests,
      # and a validator that changes what it accepts between two runs of an
      # unchanged repo is not a gate. Bump this deliberately, in a diff.
      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.251

      # README, "Publisher: shipping a change", step 3: both must pass.
      # Manifest validation only — reads two JSON files, needs no account.
      - name: Manifests — plugin and marketplace, strict
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          claude plugin validate ./plugins/productizer --strict
          claude plugin validate . --strict

      # Grammar, then permanence. Exit 4 is NOT MEASURED — a file that could
      # not be read, or holds no requirements — and it is non-zero on purpose:
      # a spec nobody parsed has not passed.
      #
      # Deliberately not --strict. The spec carries WARNs today (three
      # requirements with two `shall` clauses); --strict would fail this job on
      # a pre-existing condition and the first thing anyone did would be to
      # delete the step. WARNs are printed and do not block. See references/ci.md.
      #
      # `--repo .` rather than a list of paths. The cross-file checks
      # (ID_DEFINED_TWICE, COUNTER_DISAGREES, SIBLING_ID_AT_OR_ABOVE_COUNTER,
      # TEXT_DUPLICATE_ACROSS_FILES, and citations resolved across siblings)
      # only ever ran over the files the command line named, so with a hardcoded
      # list the day someone splits the spec is the day this step goes quiet
      # about the half it was never told to read. `--repo` derives the list from
      # `spec.path` in .claude/productizer/config.json and turns any undeclared
      # spec file in that directory into an ERROR. On this repo, which has one
      # spec file, it discovers exactly the two paths this step used to name and
      # its output is byte for byte what the list produced.
      - name: Spec — EARS grammar and id permanence
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python3 plugins/productizer/skills/spec/scripts/validate-spec.py --self-test
          python3 plugins/productizer/skills/spec/scripts/validate-spec.py --repo .

      # Precision must stay at 1.00. A contradiction checker that halts on a
      # non-conflict gets switched off, and then nothing is checked.
      - name: Self-tests — every check tool the suite invokes
        # R40: "When the check suite runs, the lifecycle shall run the self-test
        # of every check tool it invokes." R39 obliges the self-test to EXIST;
        # this step is what makes it RUN. Each tool is named on its own line
        # deliberately: `check-selftest-coverage.sh` reads the workflow SOURCE to
        # decide reachability, so a loop over a glob would run every self-test and
        # still leave R40 reporting that nothing invokes them.
        #
        # No line is guarded with `||` and this step sets no continue-on-error.
        # The scanner detects both as SWALLOWED - a self-test whose failure cannot
        # set the run's exit code has not been run in any sense that matters.
        #
        # `spec-doctor.sh` is on this list and is DELIBERATELY NOT a declared
        # check in checks.yaml. It exits 1 on findings and it counts a WARN as
        # one, so a `block` check over it would turn every pre-existing warning
        # into a red suite - which is the condition the "Spec" step above already
        # refuses to gate on, for the stated reason that the first thing anyone
        # does with such a gate is delete it. It also computes nothing of its
        # own that a declared check does not already run, and it emits no path
        # for `coverage.from: stdout_paths` to read, so a check declared over it
        # would claim coverage it never had. Naming it here is what puts it
        # inside the set check-selftest-coverage.sh measures R39 and R40 over,
        # which is the obligation that was actually missing.
        #
        # `upgrade-drift.sh` is here for the same reason and is not declared for
        # a stronger one. It is `/productizer:upgrade`'s reporter, and nothing
        # invoked its self-test: it was in neither file the scanner reads, so it
        # was outside R39 and R40 altogether. Run over this repository on
        # 2026-09-13 it exits 3, not 0 - version provenance is unmeasured here -
        # and its fifth dimension reports every line a template has that this
        # repo's edited copy does not: 390 on checks.yaml alone. Its own header
        # says such a difference "is not by itself a defect", because a seed is
        # meant to be edited. A `block` check over a report that is for a person
        # to apply, dismiss or defer would be red on every commit for content
        # nobody is obliged to adopt, and would be switched off.
        run: |
          set -euo pipefail
          python3 evals/solver-probe.py --selftest
          python3 plugins/productizer/skills/spec/scripts/check-frontmatter.py --selftest
          bash plugins/productizer/skills/spec/scripts/build-guide.sh --selftest
          bash plugins/productizer/skills/spec/scripts/build-release-notes.sh --selftest
          bash plugins/productizer/skills/spec/scripts/check-cannot-run-coverage.sh --selftest
          bash plugins/productizer/skills/spec/scripts/check-changelog-row.sh --selftest
          bash plugins/productizer/skills/spec/scripts/check-classification-provenance.sh --selftest
          bash plugins/productizer/skills/spec/scripts/check-declared-scope.sh --selftest
          bash plugins/productizer/skills/spec/scripts/check-import-marking.sh --selftest
          bash plugins/productizer/skills/spec/scripts/check-installed-copies.sh --selftest
          bash plugins/productizer/skills/spec/scripts/check-jira-unbound.sh --selftest
          bash plugins/productizer/skills/spec/scripts/check-missing-tool.sh --selftest
          bash plugins/productizer/skills/spec/scripts/check-no-fabricated-zero.sh --selftest
          bash plugins/productizer/skills/spec/scripts/check-nothing-merged.sh --selftest
          bash plugins/productizer/skills/spec/scripts/check-pending-ruling-scope.sh --selftest
          bash plugins/productizer/skills/spec/scripts/check-ruling-requested.sh --selftest
          bash plugins/productizer/skills/spec/scripts/check-selftest-coverage.sh --selftest
          bash plugins/productizer/skills/spec/scripts/check-spec-home-stop.sh --selftest
          bash plugins/productizer/skills/spec/scripts/check-spec-home.sh --selftest
          bash plugins/productizer/skills/spec/scripts/check-spec-integrity.sh --selftest
          bash plugins/productizer/skills/spec/scripts/check-stderr.sh --selftest
          bash plugins/productizer/skills/spec/scripts/check-superseded-text.sh --selftest
          bash plugins/productizer/skills/spec/scripts/check-suspect-links.sh --selftest
          bash plugins/productizer/skills/spec/scripts/check-unmeasured-report.sh --selftest
          bash plugins/productizer/skills/spec/scripts/check-untrusted-execution.sh --selftest
          bash plugins/productizer/skills/spec/scripts/check-view-publish-refused.sh --selftest
          bash plugins/productizer/skills/spec/scripts/check-view-readonly.sh --selftest
          bash plugins/productizer/skills/spec/scripts/check-waiver-rendering.sh --selftest
          bash plugins/productizer/skills/spec/scripts/retrieval-budget.sh --selftest
          bash plugins/productizer/skills/spec/scripts/run-checks.sh --selftest
          bash plugins/productizer/skills/spec/scripts/spec-doctor.sh --selftest
          bash plugins/productizer/skills/spec/scripts/upgrade-drift.sh --selftest
          bash scripts/check-hygiene.sh --selftest

      - name: Acceptance rows — check-acceptance-rows self-test
        # R40 obliges the suite to RUN the self-tests R39 obliges tools to carry.
        # Measured 2026-09-06: three scripts parse a self-test flag -
        # validate-spec.py, contradiction-check.py and this one - and this was the
        # only one no declared check and no workflow step reached. A self-test
        # nobody runs is a test that has never been observed failing, which is the
        # thing this repository refuses to call evidence.
        run: |
          set -euo pipefail
          bash plugins/productizer/skills/spec/scripts/check-acceptance-rows.sh --selftest

      - name: Solver — contradiction-check self-test
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python3 plugins/productizer/skills/spec/scripts/contradiction-check.py --selftest

      # THE 26-CASE PROBE, GATED. The step above runs the solver against the
      # corpus its own author wrote. `evals/solver-probe.py` runs it against
      # `evals/cases/`, the 26 cases written to the classes
      # `references/solver.md` names as undecidable - the harder and more
      # honest number, and the one nothing off a maintainer's machine had ever
      # measured. Nine solver changes landed against that corpus with no gate
      # under any of them, so a lost case or a new false positive was invisible
      # until somebody thought to run the probe by hand.
      #
      # A WORKFLOW STEP AND NOT A `checks.yaml` CHECK. Two reasons, the second
      # decisive.
      #
      #   1. `run-checks.sh` is change-set driven: a check is selected by
      #      `when.paths` against the files this change touched, and is reported
      #      `not_triggered` on every other commit. The probe reads no file from
      #      the change at all - it re-measures a fixed corpus. `when.always:
      #      true` would make it run, as `solver-corpus` already does, but it
      #      would be a whole-corpus measurement wearing a per-file check's
      #      clothes, and its `files_in_scope` would be a fiction.
      #
      #   2. `checks.yaml` coverage has only `min_covered`, and `min_covered` is
      #      a FLOOR - run-checks.sh validates it as "a non-negative integer"
      #      and enforces it as `if covered < cov["min_covered"]`. There is no
      #      ceiling anywhere in that vocabulary. Half of this gate IS a
      #      ceiling: false positives at most 0, silent misses at most 1. And
      #      the false-positive ceiling is precisely what the `solver-corpus`
      #      check's own `why` says must hold - "a contradiction checker that
      #      halts on a non-conflict gets switched off, and then nothing is
      #      checked". Expressed as a check there, that half would simply be
      #      absent, and the gate would stay green through the exact regression
      #      it exists to catch. A gate that can only assert its floor is half a
      #      gate.
      #
      # THE PROBE ALWAYS EXITS 0. It prints a table and a summary and returns 0
      # whatever the numbers say; it returns 2 only when the checker file is
      # missing entirely. So `run:` cannot gate on its status - the counts are
      # parsed and compared instead. A count whose line is not in the output is
      # NOT MEASURED and fails the step. It is never read as a zero, which would
      # turn a probe that printed nothing into a perfect score.
      #
      # BASELINE - MEASURED 2026-09-05, at 4b4eb51, by running exactly the
      # command below against this corpus:
      #
      #     true positives  (caught)          : 8
      #     false negatives (missed silently) : 1    <- P03, the unquantified
      #     false positives (halted wrongly)  : 0       adjective, which the
      #     true negatives  (stayed quiet)    : 10      solver SHOULD miss
      #     undecided       (escalated)       : 7
      #     precision : 1.00   recall : 0.89   (n=9 must-halt cases)
      #
      # RE-MEASURED 2026-09-06, same command, after `guard_entailment`
      # landed in contradiction-check.py. P14 is now convicted by proof:
      # of its two guards - `in arrears for more than 14 days` against
      # `an enterprise account in arrears for more than 30 days` - the
      # second ENTAILS the first, so every state satisfying it satisfies
      # the other. No lexicon entry was added.
      #
      #     true positives  (caught)          : 9
      #     false negatives (missed silently) : 1    <- P03 still, and
      #     false positives (halted wrongly)  : 0       still deliberate
      #     true negatives  (stayed quiet)    : 10
      #     undecided       (escalated)       : 6
      #     precision : 1.00   recall : 0.90   (n=10 must-halt cases)
      #
      # What this corpus CANNOT referee, measured while convicting P14:
      # of the ten must-not-halt cases, ZERO have an exclusive-response
      # pair. So no negative here can punish a rule that only loosens the
      # guard relation - which is why `--break guards` reports precision
      # 1.00 while being plainly unsound. Corpus precision is not evidence
      # for such a rule; only a proof is. Four further cases (P04, P05,
      # P07, P15) were left undecided on that ground rather than convicted.
      #
      # The bounds below ARE those five numbers, not round ones chosen near
      # them. Moving a bound is a diff, and a diff that moves one must carry a
      # fresh measurement and a fresh date, or the comment above stops being
      # true and the gate stops protecting anything anybody measured.
      #
      # `undecided` is deliberately NOT bounded. It is 26 minus the other four,
      # so bounding those bounds it; and a case moving from undecided to caught
      # is the improvement this corpus was built to provoke. Bounding it would
      # block the improvement.
      - name: Solver — 26-case probe, against the 2026-09-06 baseline
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/solver-probe.txt"
          python3 evals/solver-probe.py | tee "$out"
          python3 - "$out" <<'PY'
          import re
          import sys

          # Measured 2026-09-06 at 8216ab6 + guard_entailment. FLOOR = at
          # least this many. CEIL = at most this many. Both halves are
          # needed: a floor alone cannot see a solver that starts halting on
          # non-conflicts. TP 8 -> 9: `guard_entailment` convicts P14, whose
          # guards one ENTAILS the other. A floor of 8 already admitted 9, so
          # nothing was failing; raising it is what stops the gain regressing
          # silently. The other three are unmoved and deliberately so.
          FLOOR = {"true positives": 9, "true negatives": 10}
          CEIL = {"false negatives": 1, "false positives": 0}
          PAT = {
              "true positives": r"true positives\s*\(caught\)\s*:\s*(\d+)",
              "false negatives": r"false negatives\s*\(missed silently\)\s*:\s*(\d+)",
              "false positives": r"false positives\s*\(halted wrongly\)\s*:\s*(\d+)",
              "true negatives": r"true negatives\s*\(stayed quiet\)\s*:\s*(\d+)",
          }

          with open(sys.argv[1], encoding="utf-8") as fh:
              text = fh.read()

          got = {}
          unmeasured = []
          for name, pat in PAT.items():
              m = re.search(pat, text)
              if m is None:
                  unmeasured.append(name)
              else:
                  got[name] = int(m.group(1))

          if unmeasured:
              for name in unmeasured:
                  print("::error::solver probe: '%s' NOT MEASURED - its summary "
                        "line is absent from the probe's output. That is not a "
                        "zero and is not read as one." % name)
              print("::error::the probe ran and exited 0 but did not report %d of "
                    "the %d counts this gate is defined over, so nothing was "
                    "compared. Refusing rather than passing on an unread number."
                    % (len(unmeasured), len(PAT)))
              raise SystemExit(1)

          failures = []
          for name, floor in FLOOR.items():
              if got[name] < floor:
                  failures.append("%s: %d, BELOW the measured baseline of %d"
                                  % (name, got[name], floor))
          for name, ceil in CEIL.items():
              if got[name] > ceil:
                  failures.append("%s: %d, ABOVE the measured baseline of %d"
                                  % (name, got[name], ceil))

          this_run = ", ".join("%s %d" % (n, got[n]) for n in PAT)
          if failures:
              for line in failures:
                  print("::error::solver probe regressed - %s" % line)
              print("::error::baseline measured 2026-09-06 at 8216ab6 + "
                    "guard_entailment: true positives 9, false negatives 1, "
                    "false positives 0, true negatives 10. The prior baseline, "
                    "2026-09-05 at 4b4eb51, read true positives 8; only that "
                    "number moved. This run: %s. Either the solver lost ground, "
                    "or the corpus moved and the bounds in this workflow need "
                    "re-measuring and re-dating in a diff." % this_run)
              raise SystemExit(1)

          print("solver probe at or above the 2026-09-06 baseline: %s" % this_run)
          PY

      # Stage 5, last because it is the slowest: shellcheck runs per changed
      # file. Exit 3 is REFUSED (a blocking check failed, was hollow, timed
      # out, or its tool is missing); exit 2 is bad usage; exit 1 is a crash,
      # which reads as unverified and never as a pass. All three fail the job.
      #
      # `--base`, not `--changed`. `--changed PATH` wants a FILE LISTING the
      # changed paths, one per line — handing it a changed file instead reads
      # as a one-path change set and passes having examined almost nothing.
      # `--base REF` derives the set from `git diff` against the merge base,
      # which is what CI has and what it should be measured on.
      - name: Stage 5 — declared checks over this change
        if: ${{ !cancelled() }}
        env:
          # Branch names, PR titles and commit messages are attacker-influenced
          # on a public repo, so no `github.event.*` value is interpolated into
          # a run: block anywhere in this file. These two are commit SHAs
          # chosen by GitHub, passed through env, and quoted at every use.
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="${PR_BASE_SHA:-}"
          [ -n "$base" ] || base="${PUSH_BEFORE:-}"
          # A force-push, or a first push to a branch, gives an all-zero or
          # unfetchable `before`. Falling back to the first parent measures a
          # smaller change than really landed, so it is a fallback and not the
          # default; when even that does not resolve, git exits non-zero under
          # `set -e` and the job fails rather than gating on an unknown set.
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "::warning::no usable base from the event payload; falling back to HEAD^"
            base="$(git rev-parse --verify HEAD^)"
          fi
          echo "base: $base"
          plugins/productizer/skills/spec/scripts/run-checks.sh \
            --base "$base" \
            --out "$RUNNER_TEMP/checks-result.json"

  # --- A TAG PUSH DRAFTS ITS RELEASE. A PERSON PUBLISHES IT. -----------------
  #
  # Measured 2026-09-14: 81 version tags, 22 release pages. Every tag from
  # v4.8 onward had none, and release checklists had been saying a tag push
  # "creates the release page" - it never did, because nothing here created
  # one. Two rules had to be satisfied at once:
  #   - releases go through CI, not a hand-run command on someone's machine;
  #   - nothing reaches an audience without a person deciding (P2), which is
  #     why references/release.md gates `gh release create` behind a checklist
  #     and an explicit yes.
  # A DRAFT satisfies both. It is not public: only people with write access to
  # the repo can see it until someone presses Publish. So CI does the typing and
  # a person owns the decision, which is the split the lifecycle uses everywhere.
  #
  # WHAT IT WILL NOT DO. It never publishes: after creating the release it reads
  # the release back and fails the job if `isDraft` is anything but true. It
  # never edits an existing release - a page someone already published or
  # rewrote is theirs. And the notes are EVIDENCE from build-release-notes.sh
  # (spec deltas, PRs, commits, files, the pre-publish checklist), not prose;
  # the person publishing writes the prose from them.
  #
  # PERMISSIONS. The workflow's default stays `contents: read`. Only this job
  # can write, only on a tag push, and only after `checks` passed on that tag -
  # so a pull request never gets a token that can create a release, and a tag
  # that fails the gate never gets a draft. `persist-credentials: false` keeps
  # the token out of git's config; `gh` reads it from GH_TOKEN for the one call.
  release-draft:
    needs: checks
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The notes cover the range since the previous version tag, so the
          # history and every tag have to be here, not a single commit.
          fetch-depth: 0
          persist-credentials: false

      - name: Draft the release from the evidence, never publish it
        env:
          GH_TOKEN: ${{ github.token }}
          # The ref name reaches the shell through env and is quoted at every
          # use, the same rule as every other event value in this file.
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::refusing to draft a release for '$TAG': not a version tag"; exit 1 ;;
          esac
          gh --version | head -1
          git fetch --force --tags origin
          # Release tags here are annotated, and the annotation's subject line is
          # the release title. A lightweight tag carries no title to use.
          if [ "$(git cat-file -t "$TAG")" != "tag" ]; then
            echo "::error::$TAG is a lightweight tag; release tags here are annotated and its message is the title"
            exit 1
          fi
          # The previous version tag bounds the range. The very first tag has
          # none, and then the notes cover everything before it.
          since=()
          prev=""
          if prev="$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^")"; then
            since=(--since "$prev")
          else
            prev=""
          fi
          notes="$RUNNER_TEMP/release-notes-${TAG}.md"
          bash plugins/productizer/skills/spec/scripts/build-release-notes.sh . "${since[@]}" --version "${TAG#v}" > "$notes"
          if [ ! -s "$notes" ]; then
            echo "::error::build-release-notes.sh produced no notes for $TAG"
            exit 1
          fi
          title="$(git tag -l --format='%(contents:subject)' "$TAG")"
          [ -n "$title" ] || title="$TAG"
          # Never touch a release that already exists. `gh release view` exits
          # non-zero for "not found" and for any other failure alike; an auth
          # failure would then surface at the create call below, loudly.
          if gh release view "$TAG" > /dev/null; then
            echo "::notice::a release for $TAG already exists and was not touched - a page someone published or edited is theirs"
            exit 0
          fi
          gh release create "$TAG" --draft --verify-tag --title "$title" --notes-file "$notes"
          is_draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
          if [ "$is_draft" != "true" ]; then
            echo "::error::the release for $TAG reads isDraft=$is_draft. This job must never publish; a person does."
            exit 1
          fi
          echo "drafted $TAG (range since ${prev:-the first commit}); it is visible only to people with write access until someone publishes it"
