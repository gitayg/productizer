# The calibration record. R50: a blocking check records its fire rate over
# merged history, how many commits returned a verdict, and a PERSON's ruling on
# every fire in that window. R51: a check whose rate could not be measured
# records that its severity was never calibrated, and why.
#
# Read by plugins/productizer/skills/spec/scripts/check-calibration-recorded.sh,
# whose header carries the schema. In short:
#
#   status: measured      window {first, last, commits, history}, verdicts (> 0),
#                         fires, fire_rate "<fires>/<verdicts> = <pct>%",
#                         measured_by {tool, version, date}, and one ruling per
#                         fire {commit, ruling, by, date, note}
#   status: uncalibrated  reason (as measured), measured_by {tool, version, date}
#
# A ruling is `genuine` or `false-positive` and names the PERSON who ruled it.
# `pending` is a fire nobody has ruled - including one an agent has opened and
# formed a view on; the agent's view goes in `note` and counts for nothing.
#
# EVERY FIGURE BELOW WAS MEASURED ON 2026-10-02, on one machine, by
# measure-check-overfire.sh 1.1 against checks.yaml as committed at 547684e,
# over the 30 non-merge commits 1029c597 (v4.44.0) to 547684e (v4.64.1). None is
# carried over from risk-and-calibration.md: its first table names no window
# end, its B77 tables name no instrument version, and governance-self-footing's
# command has changed since B77 measured it. `history: clone` is used for the
# checks that read git history - the four declaring `git`, plus
# classification-provenance and import-marking, which read it without declaring
# it (B77). `excluded` counts the triggering commits that returned no verdict;
# they are outside the denominator, never passes. The rate is an UPPER BOUND on
# over-fire: every commit replayed was merged, so a fire is a merged defect or a
# false positive, and only a person's ruling tells which.
#
# Not here, on purpose: a check with no record. The check names it.
