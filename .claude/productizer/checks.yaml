            `-a-negative-spend-cap`, `-a-spend-cap-without-cents`, `-a-repeated-turn-cap`);
            `agent-args-passes-the-least-caps` passes 1 and 0.01. Falsified 2026-10-31: the
            presence check removed, 176 of 179; both cap shapes widened to any word, 175 of 179.
        - id: R128
          verdict: Covered
          evidence: >-
            deliver passes the list and reads no YAML: `deliver-protected-no-pyyaml-allows-code`
            exits 0 and `deliver-protected-no-pyyaml-refuses-a-check-script` exits 6 with a python3
            that cannot import PyYAML, as do `deliver-protected-allows-code` and
            `deliver-protected-refuses-a-check-script` with one that can.
    limitations:
      - The real gh, a real GitHub and the action itself are never exercised. gh is a stub and origin is a local bare repository.
      - That GitHub runs the template's calls of this script as written is not measured; check-ci-template.py's guards assert the call text (agent-args, stash-git, capture) and the agent-args cases drive the subcommand, but no case runs the YAML.
      - A config-driven filter.*.clean, diff.*.textconv, fsmonitor or hooksPath EXECUTING during capture is not driven by any case: add -N and diff do not invoke a clean filter, and the relocation puts any agent-written config out of git's reach, so R68 rests on the relocation plus the exit-8 refusal, not on a measured driver execution.
      - That the action tolerates its .git being moved out before the agent runs is not measured on a real runner.
      - That the CLI inside the action stops a run at --max-turns or --max-budget-usd, and how far past the spend cap a run goes, is not measured; the built-in caps of 100 turns and 20.00 dollars were chosen, not measured against a real plan or build run.

  - id: ci-template-safe
    why: the template runs a model in other people's repositories with their secrets, and one edit to its YAML removes a guarantee while every script stays green
    when:
