    limitations:
      - Only the copyable CI template calls it - build-dispatch.sh asks it before delivering an unattended run's patch, and again on the commit. No tracker move or label calls it, so a ticket's stage can still move without it.
      - The forbidden set is a list, not a proof. Attended, nothing but the list applies; under --unattended an ASCII, dot-free file the list does not name (Jenkinsfile, GEMINI.md) is still allowed. Since 1.6 a file a check declared in checks.yaml runs is refused under --unattended (R126), and since 1.10 every script such a script names by its path (R158, B147), and since 1.11 every symbolic link those readings reach and its target (R175, B176), since 1.12 resolved as the kernel resolves it (R188, B180), but a script reached through a name built at run time, or a data file a script reads, is not protected, and a link whose target leaves the repository or is not in the base tree is protected without its target being followed (R176); a `run-checks.sh --config` other than the default is not read; PyYAML is pinned by hash (B148), and that the hashes are PyPI's was read from PyPI's JSON API, not checked against a wheel. A homoglyph is read, not folded - one non-ASCII character as one to two characters - so a reading of three or more, and a homoglyph made of ASCII alone (rn for m), are not refused; and a legitimate non-ASCII name that reads as a rule file is refused attended too. A modified checks-result.json is inert in an attended run; the ruling of 2026-10-12 refuses it only under --unattended, which only the CI template's deliver passes.
      - Default-deny over `.claude/**` refuses a design move's change to every `.claude/productizer/` file but the spec, the backlog, bookkeeping ADDED and, since 1.5, the requirement index MODIFIED in an attended design move (B112). An unattended design move may not write the index, because R91 lists the unattended exceptions and it is not among them.
      - A stage other than design or build with evidence of its own is driven by no case.

  # --- the two ends of an unattended run -----------------------------------
  #
  # B93, R58-R62 and R64; B111, R65; B116, R67 and R68 (v4.67.1). templates/build-from-spec.yml is a workflow an adopter copies
  # into their own repository; it runs one stage with no person at the
  # keyboard. Adapted from the AI Unified Process generate workflow
  # (Apache-2.0, by Simon Martinelli); no code is copied. The maintainer ruled
  # on 2026-10-10 that the person who dispatches the run is the decision, and
  # that its pull request is always a draft.
  #
  # TWO CHECKS, BECAUSE THE GUARANTEES LIVE IN TWO PLACES. What happens on
  # either side of the model is shell in build-dispatch.sh, proven by its
  # self-test against local repositories with gh stubbed. What the model's job
  # may hold is YAML, and one edit to the YAML removes it while every script
  # stays green, so check-ci-template.py reads the template itself. Neither
  # runs GitHub: the template has never run end to end (B93).
  - id: build-dispatch
    why: the two ends of an unattended run - no model when the spec is unchanged, and nothing delivered but a draft pull request from a new branch after stage-advance.sh allowed it - would otherwise be untested shell inside a workflow
    when:
      always: true
    severity: block
    requires: [./plugins/productizer/skills/spec/scripts/build-dispatch.sh, git, python3]
    version_command: [./plugins/productizer/skills/spec/scripts/build-dispatch.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/build-dispatch.sh, --selftest]
    timeout_seconds: 180
    exit_codes:
      pass: [0]
      fail: [1]        # a case did not produce the exit code or the effect it declares
      refused: [2]
    coverage:
      from: stdout_count
      pattern: '([0-9]+) of [0-9]+ cases held'
      min_covered: 1
      spec_units:
        - id: R58
          verdict: Partial
          reason: >-
            Asserted for the UNATTENDED path only - the copyable template. A Build stage a person
            starts in a session is handed the diff by spec-diff.sh when the skill tells the agent
            to run it, and nothing asserts that it was run. Nor that GitHub runs the template's
            calls of this script as written.
          evidence: >-
            `prepare-plan` and `plan-data-has-fenced-diff` - prepare writes the spec's diff
            against the base as a fenced PRODUCTIZER-SPEC-DIFF block in the data file the agent
            reads; `plan-base-is-parent-of-spec-change` - the base is the parent of the spec
            change; `prepare-unchanged` - an unchanged spec exits 4 before any model is called.
        - id: R59
          verdict: Covered
          evidence: >-
            `deliver-build` and `gh-asked-for-a-draft` - the patch is committed to a new branch,
            pushed, and `gh pr create` is given --draft. Falsified 2026-10-10 on a copy with
            --draft removed: 32 of 33, `FAIL gh-asked-for-a-draft`.
        - id: R60
          verdict: Covered
          evidence: >-
            `default-branch-untouched` - origin's default branch did not move, and
            `pushed-the-run-branch` - only productizer/<mode>-<issue>-<run> was pushed, by an
            explicit refspec; `prepare-not-tip` - a HEAD that is not the tip of the default branch
            exits 3 before anything is written.
        - id: R111
          verdict: Covered
          evidence: >-
            `body-names-the-run` and `dry-run-body-names-run` - the pull request body says
            `Productizer-Run: <run id>`; the commit carries the same trailer; `deliver-bad-run-id`
            - a run id that is not id-shaped exits 2.
        - id: R64
          verdict: Covered
          evidence: >-
            `deliver-recheck-on-commit` - after committing, deliver asks stage-advance.sh again with
            --base the tip and --head the commit git made, and exits 6 on a commit carrying a
