  # B142. A version tag runs two jobs in this repository's own workflow (B128):
  # release-prep, whose token can only read, makes the notes and a copy of the
  # CI build template pinned to the tag's commit; release-draft, the one job
  # whose token can write, checks out nothing and runs no repository code. That
  # split is a property of the YAML, and one edit removes it while every script
  # stays green, so the file itself is read. Run with `python3`, not
  # `python3 -I`: it needs PyYAML, which on some machines lives only in the
  # user site.
  - id: release-workflow-safe
    why: the release job holds a token that can write to this repository, and a checkout or one interpreter call added "to read a file" would run repository code with it while every script stays green
    when:
      always: true
    severity: block
    requires: [python3]
    version_command: [python3, ./plugins/productizer/skills/spec/scripts/check-release-workflow.py, --version]
    mode: batch
    command: [python3, ./plugins/productizer/skills/spec/scripts/check-release-workflow.py]
    timeout_seconds: 60
    exit_codes:
      pass: [0]
      fail: [1]        # at least one of the eight assertions does not hold on the workflow
      refused: [2]     # usage, an unreadable or unparseable workflow, no PyYAML, check-ci-template.py not loadable, or no release-prep or release-draft job
    coverage:
      from: stdout_count
      pattern: '([0-9]+) of 9 assertions held'
      min_covered: 1
      spec_units:
        - id: R136
          verdict: Partial
          reason: >-
            Static only: it reads .github/workflows/checks.yml and runs nothing. That GitHub runs
            the jobs as written, enforces the permissions they declare, and that a tag push
            really attaches the copy is proven only by a real tag push. The lines that pin the
            copy are matched in order, whitespace and comments ignored, not as control flow, so a
            line made unreachable by an earlier exit is not seen.
          evidence: >-
            check-release-workflow.py 1.0 (B142), 21 self-test cases over exit codes 0 1 2.
            `attach-pinned` - release-prep refuses a tag naming a commit other than GITHUB_SHA and
            runs check-ci-template.py on the pinned copy with a note refused; release-draft refuses
            a copy whose PRODUCTIZER_SHA is not GITHUB_SHA, then `gh release create --draft` and
            `gh release upload` of the copy; `prep-read-only` - release-prep holds no write scope;
            `draft-needs-prep` and `handover` - the copy reaches release-draft only as an artifact
            a read-only job it needs uploaded. Fixtures attach-no-upload.yml,
            attach-prep-no-sha-guard.yml, prep-write.yml, draft-needs-prep.yml,
            handover-unnamed.yml and handover-unknown-artifact.yml each exit 1; the real workflow
            holds 8 of 8.
        - id: R137
          verdict: Partial
          reason: >-
            Static only, over the run: text: a checkout spelled through a variable or an alias,
            or one an action from another repository makes, is not seen.
          evidence: >-
            `write-job-no-checkout` - a job holding any write scope (its own permissions, else the
            workflow's, else the repository default, read as a write scope) has no actions/checkout
            step and no run: that clones, fetches, pulls, checks out, switches, adds a worktree or
            sparse-checks-out, nor `gh repo clone`. Fixtures write-job-checkout.yml,
            write-job-git-clone.yml and undeclared-permissions.yml exit 1.
        - id: R138
          verdict: Partial
          reason: >-
            Static only, by check-ci-template.py's lexical rule, loaded from that file: an
            interpreter a system tool starts, or a command spelled through a variable or an
            alias, is not seen; git and gh are allowed, and what they could run - hooks, aliases,
            extensions - is not this rule's.
          evidence: >-
            `write-job-no-repo-code` - a write job has no local action, names no interpreter or
            package runner, sources no file, runs no ./ path, and runs bash or sh on no file at
            all, $RUNNER_TEMP included. Fixtures write-job-local-action.yml,
            write-job-runs-python.yml and write-job-runs-staged-script.yml exit 1.
        - id: R71
          verdict: Partial
          reason: >-
            This repository's own release job, not an unattended run's: the release-draft job
            holds `contents: write` and runs no code from the repository. Static only, as for
            R138; the CI build template's write job is ci-template-safe's and build-dispatch's.
          evidence: >-
            `write-job-no-checkout` and `write-job-no-repo-code` hold on .github/workflows/checks.yml
            (8 of 8 assertions); fixtures write-job-runs-python.yml and
            write-job-runs-staged-script.yml exit 1.
        - id: R159
          verdict: Partial
          reason: >-
            This repository's workflow half only; ci-template-safe holds the template. That pip
            on a GitHub runner accepts the two hashes is proven only by the next CI run.
          evidence: >-
            check-release-workflow.py 1.1 (B148), 23 self-test cases, loading
            `unhashed_yaml_install` from check-ci-template.py. The real workflow holds 9 of 9;
            at 81c6031 it fails at jobs.checks.steps[3] and jobs.release-prep.steps[2]. Fixtures
            yaml-hashed.yml exit 0 and yaml-unhashed.yml exit 1. Falsified 2026-10-28 with the
            rule made never to fire: 22 of 23.
        - id: R177
          verdict: Partial
          reason: >-
            This repository's workflow half, by check-ci-template.py's rule; it reads shell text,
            not bash, as ci-template-safe says.
          evidence: >-
            check-release-workflow.py 1.2 (B177), 35 self-test cases, loading
            `unhashed_yaml_install` from check-ci-template.py 1.3: the same twelve fixtures over
            the release-prep job, eleven exit 1 naming the command and the wrapped hashed install
            exits 0. The real workflow holds 9 of 9. Falsified 2026-10-28 with the 1.2 line rule
            restored in check-ci-template.py: 24 of 35.
        - id: R187
          verdict: Partial
          reason: >-
            This repository's workflow half, by check-ci-template.py's scanner; it follows bash's
            word starts for a `#`, not bash's whole grammar, as ci-template-safe says.
          evidence: >-
            check-release-workflow.py 1.4 (B179, B182), 60 self-test cases, loading the scanner
            from check-ci-template.py 1.5: the same five fixtures over the release-prep job, each
            exits 1 naming the install, the subshell comment's a deliberate over-report. The real
            workflow holds 9 of 9. Falsified 2026-10-28 in check-ci-template.py: a `)` a word
            start again, 58 of 60; Python's whitespace a blank, 59 of 60; a backquote comment cut
            to the line end, 59 of 60.
        - id: R191
          verdict: Partial
          reason: >-
            This repository's workflow half, by check-ci-template.py's scanner, which lists the
            shell it does not follow rather than reading bash's grammar, as ci-template-safe says.
          evidence: >-
            check-release-workflow.py 1.4 (B182), 60 self-test cases, loading the scanner from
            check-ci-template.py 1.5: the same twenty fixtures over the release-prep job, each
            exits 1 reporting the run: as not read; 1.3 held 9 of 9 on fifteen. The real workflow
            holds 9 of 9. Falsified 2026-10-28 in check-ci-template.py, each reading removed
            alone: heredoc and `${`, 57 of 60; a substitution inside double quotes and a `(` or
            backquote left open, 58 of 60; each other reading, 59 of 60.
    limitations:
      - It reads one file and runs nothing. Whether GitHub enforces the declared permissions, whether a pinned commit is the release its comment names, and whether the jobs ever ran are not measured.
      - The repository-code rule is lexical and shared with check-ci-template.py, so the two drift together; it is stricter here in one place, refusing bash or sh on any file.
      - The attach-pinned lines are matched in order with whitespace and comments ignored, not as control flow.
      - It needs PyYAML, so it is run with `python3`, not `python3 -I`, which hides the user site where PyYAML may live.

  # --- a self-test that exists, and a self-test that runs ---------------------
  #
  # R39 and R40, which were split from one intent because they are two
  # obligations: R39 says a check tool shall CARRY a self-test, R40 says the
  # suite shall RUN it. A tool carrying one nobody invokes satisfies the first
  # and fails the second, and that is not a hypothetical - it is the state
  # `check-acceptance-rows.sh` was in until 2026-09-06.
  #
  # THIS IS THE CHECK ON THE CHECKS, AND THE NUMBER IT REPORTS IS BAD. Measured
  # 2026-09-06 at 1371af4: of the 31 tools in this repository that checks.yaml
  # or the workflow invokes, 3 carry a self-test that answers. Twenty-eight do
  # not. That is a real reading of this repository and the check is red on
  # arrival because of it, deliberately: the maintainer chose R39's subject
  # noun BROAD over narrow knowing this number, and the red is the work queue.
  #
  # WHAT THAT RED COSTS, STATED RATHER THAN DISCOVERED. `block` on a
  # twenty-eight-item pre-existing condition is the shape this repo has already
  # been burned by once - the CI comment on `validate-spec.py --strict` says a
  # step that fails on a pre-existing condition is a step somebody deletes. It
  # is still `block`, for two reasons. The measurement is UNAMBIGUOUS, unlike
  # `suspect-links`, which is `advise` precisely because it cannot tell a typo
  # from an inversion: a tool either dispatches on a self-test flag or it does
  # not, and the run proves it by executing the flag. And the severity changes
  # nothing about today's verdict anyway - a failing check voids its own
  # `spec_units`, so R39 and R40 land back on `Missing` and `spec_coverage:
  # require` refuses whatever this line says. Severity here is a statement
  # about what the shortfall MEANS, and an unrun self-test is not advice.
  #
  # IT DOES NOT EXEMPT ITSELF, AND ITS OWN NAME IS IN ITS OWN OUTPUT. The
  # command below runs the MEASUREMENT, not the self-test, so this tool reports
  # itself as a carried self-test that nothing reaches - one of the R40
  # findings, on the very first run. Closing it is one workflow step, exactly
  # like the one that closed `check-acceptance-rows.sh`. It is left open here
  # because `.github/workflows/checks.yml` had another writer at the time this
  # was landed, and a verifier that writes itself out of its own denominator to
  # look better is the defect this whole stage exists to refuse.
  #
  # BOTH CLAIMS ARE `Partial` AND BOTH SAY WHY. R39's "reaches each exit code
  # it can return" is NOT measured at all - no self-test in this repository
  # reports which exit codes it drove, and inventing a reporting protocol
  # silently here would produce a claim with no assertion under it. R40 is read
  # off the two files that decide what executes rather than observed executing.
  #
  # min_covered: 20 - the two config files plus the tools. The tool set is 31
  # today; a run reporting fewer than twenty paths has had its enumeration
  # collapse, and a collapsed enumeration is the run that reports a small
  # shortfall because it looked at almost nothing.
  - id: selftest-coverage
    why: a self-test nobody runs has never been observed failing, and a check tool with no self-test at all is a verdict this repo has never seen go red - both are the hollow green every other check here exists to refuse, aimed at the checks themselves
    when:
      always: true
    severity: block
    requires:
      - ./plugins/productizer/skills/spec/scripts/check-selftest-coverage.sh
      - ./plugins/productizer/skills/spec/scripts/selftest-coverage.py
      - python3
    version_command: [./plugins/productizer/skills/spec/scripts/check-selftest-coverage.sh, --version]
    mode: batch
    # --probe-timeout is per self-test. 60 was too tight once the view gained a sixth
    # state: check-view-rendered.sh --selftest measured 50.8s on a developer machine
    # (30.9s before B80), every other self-test under 20s. CI runners are slower, and one
    # probe past the limit makes this check refuse (exit 2) and R39/R40 read Missing -
    # which is how the v4.65.0 tag run failed while main passed on the same commit.
    # 180 is about three times the slowest measured; a hung self-test still times out.
    # --probe-jobs 4 (B160): one at a time, the 62 probes took 644s on a loaded macOS
    # machine against this check's 600s, so the run timed out while every probe held.
    # Four at a time, each still under its own 180s. Four is a choice, not a measured best.
    command: ["./plugins/productizer/skills/spec/scripts/check-selftest-coverage.sh", "--probe-timeout", "180", "--probe-jobs", "4"]
    timeout_seconds: 600
    exit_codes:
      pass: [0]
      fail: [1]        # a tool with no self-test, or a self-test nothing runs
      refused: [2]     # no python3, no PyYAML, an unparseable or empty checks.yaml or workflow, or a self-test that did not answer inside the budget
    coverage:
      spec_units:
        - id: R108
          verdict: Partial
          reason: >-
            THE SECOND CLAUSE IS NOW COUNTED, NOT ASSERTED. Superseded 2026-09-06; the text
            here until then said the clause was NOT MEASURED and that inventing a reporting
            protocol would be a claim with no assertion under it. What changed is that the
            codes a self-test drove are knowable only to the self-test, so the protocol is a
            DECLARATION it makes and this check reads: one line, `exit codes reached: <codes>
            documented: <codes>`, both halves bare integer lists, the reached half computed
            from the cases as they ran. Three figures are kept apart and never added: how many
            DECLARE, how many of those drove every code they document, and how many were NOT
            ASKED. Measured 2026-09-14: 35 of 35 declare, 35 of 35 complete, 0 unmeasured.
            (Superseded: on 2026-09-06 this read 3 of 34 declaring and 31 unmeasured - 11
            emitting nothing, 20 emitting a prose codes line with no `documented:` half.) No exit code
            rests on any of them: a self-test never asked which codes it drove has not been
            shown incomplete, and this reader cannot tell a computed reached-list from a
            hardcoded one. Second gap: the structural NEGATIVES are never executed, so a tool dispatching a
            self-test in a shape the scanner does not recognise reads as carrying none - it
            over-reports the shortfall, which is the safe direction and still a wrong line.
            Third: third-party tools the suite invokes, `shellcheck` today, are rendered n/a and
            excluded from the shortfall, because nobody here can add a self-test to one.
          evidence: >-
            Enumerates the tools the suite actually invokes from the two files that decide it -
            every `command` argv in this file, and every token in a workflow `run:` block that
            resolves to a repository .sh or .py - then measures each one twice. Structurally: a
            NON-COMMENT line that DISPATCHES on the flag, a `case` pattern, a comparison or an
            argparse entry. Then by EXECUTION: every structural positive is run with the flag,
            and a parser that rejects it - exit 2 with an unknown-option line - overrides the
            source, because the parser is what runs. Both halves are load-bearing and were
            falsified: dropping the dispatch-shape rule makes `evals/solver-probe.py` read as
            carrying a self-test on the strength of a line that invokes somebody else's, and
            dropping the rejection override makes a tool that refuses the flag count as covered.
            Measured on this repo 2026-09-14: 35 of 35 repository check tools carry one that
            answers. The R39.b reader was falsified twice - ignoring a documented code that
            was never driven, and accepting a prose codes line as a declaration - and each
            break turns a green corpus red.
        - id: R40
          verdict: Partial
          reason: >-
            IT READS THE TWO FILES THAT DECIDE WHAT EXECUTES; IT DOES NOT WATCH AN EXECUTION. A
            self-test counts as run when its tool and its flag appear together in a declared
            check's argv or on one line of a workflow `run:` block. A declared check whose tool
            is missing at run time reads as reached here while running nothing, and a self-test
            invoked from anywhere else - a Makefile, a hook, a person - is invisible. It reads
            ONE checks.yaml and ONE workflow. And the obligation is vacuous for a tool with no
            self-test to run: that shortfall is R39's, counted there and not here. Measured
            2026-09-14 that set is EMPTY - R39 reads 35 of 35 - so there is nothing this
            verdict is currently silent about. It stays silent about it by construction, not
            because the number happens to be zero today. (Superseded 2026-09-06: this sentence
            named 28 tools, a figure that was hardcoded and went stale.)
          evidence: >-
            For every self-test found, asserts something invokes it AND that its failure can
            still set the run's exit code - for a declared check, that no non-zero code sits in
            `exit_codes.pass`; for the workflow, no `continue-on-error` and no `||` guarding the
            call. A check that runs a self-test and swallows its failure is not running it. Both
            halves falsified against a committed corpus: removing the reachability test takes
            the `unreached` case from exit 1 to exit 0, and removing the swallow test takes the
            `swallowed` case from exit 1 to exit 0. A self-test that does not answer inside the
            budget is `?` and exits 2 - unmeasured - and is never counted as a tool without one.
        - id: R162
          verdict: Partial
          reason: >-
            It shortens the run, not any one probe: a machine slow enough that one self-test
            alone passes 180s still reads ? and refuses, as stage-advance.sh did one at a time
            here (184.8s) and three did under amd64 emulation (B160). Probes side by side
            compete for the same cores.
          evidence: >-
            check-selftest-coverage.sh 1.1 (B160), 25 cases. `rendezvous`: two self-tests that
            each wait for the other to start answer under --probe-jobs 2, exit 0. Falsified
            2026-10-28 with the pool held to one worker: the first read ? past its 20s and the
            case exited 2. Measured here on 2026-10-28 with the per-probe limit raised to 900s:
            one at a time at 81c6031, 63 probes in 1271s at load average 55 to 69; four at a
            time, 270.9s at 69 to 115, slowest probe 165.4s, the same R39 and R40 lines.
      from: stdout_paths
      pattern: '^(\S+)$'
      min_covered: 20
    limitations:
      - R39's "reaches each exit code it can return" is COUNTED, NOT ENFORCED, and the claim stays Partial for it - for a smaller reason than before. Superseded 2026-09-07: this said 31 of 34 do not declare and that writing the emitters was follow-up work. All 34 now declare and all 34 are complete. What keeps it Partial is that a declaration is self-reported - this check compares a self-test's two halves against each other and cannot tell a computed reached-list from a hardcoded one, nor whether the `documented:` half is the tool's true contract - a tool that under-documents its codes reads as complete over an incomplete contract.
      - Reachability is static. It reads checks.yaml and one workflow file; an invocation from a Makefile, a git hook or a person is invisible, and a declared check whose tool is absent at run time still reads as reaching the self-test it names.
      - Structural negatives are never executed. A tool dispatching a self-test in an unrecognised shape reads as carrying none, which over-reports the shortfall rather than hiding it.
      - --probe-jobs 4 shortens the run, not any one probe (B160): a machine slow enough that one self-test alone passes the 180s per-probe limit still reads ? and refuses, and probes side by side compete for the same cores. That no two self-tests write one shared path is read off their source, not enforced.
      - Third-party tools are n/a, not findings. `shellcheck` is a check tool the suite invokes and nobody here can give it a self-test; it is named and counted separately so neither number contaminates the other.
      - Superseded 2026-09-06: it used to report ITSELF as a self-test nothing reaches, because the declared command runs the measurement and not the self-test. The workflow now names `check-selftest-coverage.sh --selftest` on its own line, so the finding is resolved rather than exempted - it was never waived, and the fix was to reach it.

  # --- the retrieval budget, which nothing ran until now -------------------
  #
  # `retrieval-budget.sh` was calibrated against the model's own tokeniser and
  # on 2026-09-06 produced its first real figure about this repository: ten
  # prompts, budgets 124 to 1532 characters against a 29751-byte spec, all in
  # band, byte-identical across four runs including under a different timezone
  # and locale. The prompt set and the baseline were committed. Nothing
  # invoked it. A recorded baseline that only moves when somebody remembers to
  # run the tool by hand is a number with no gate under it, which is the same
  # hollow green every other check in this file exists to refuse - the
  # measurement simply happened to be aimed at the spec rather than at a tool.
  #
  # THE BAND IS A MEASUREMENT, NOT A TARGET. +/-20% around figures taken from
  # this spec at this commit. The remedy for a legitimate move - a requirement
  # inserted above a target, a term that starts matching more of the file - is
  # a deliberate `--record` in a diff somebody signs, not a wider band. A band
  # widened to make a red go green measures nothing at all.
  #
  # `mix` is recorded beside every budget and is NEVER banded: nothing has
  # measured what a healthy markup-and-code percentage is, so a pass or fail
  # on it would be invented. It exists so a content shift under a flat
  # character budget is visible instead of silent.
  #
  # SEVERITY IS `block`, deliberately. An advisory number is one nobody reads
  # and nobody defends; this repository's own record is that an unread
  # advisory failure is the hollow green. The cost is real - a spec edit can
  # turn this red - and that is the check working.
  - id: retrieval-budget
    why: the spec's retrieval cost had been measured once and gated by nothing, so it could double between two commits and every run would still be green
    when:
      always: true
    severity: block
    # ONLY THE SCRIPT. `awk` is refused in every argv position by this
    # runner - it takes its program as a positional argument, so no rule can
    # tell a safe awk from an arbitrary one - and the tool fails loudly on its
    # own if awk is not there.
    requires:
      - ./plugins/productizer/skills/spec/scripts/retrieval-budget.sh
    version_command: [./plugins/productizer/skills/spec/scripts/retrieval-budget.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/retrieval-budget.sh]
    timeout_seconds: 120
    exit_codes:
      pass: [0]
      fail: [4]        # out of band, a target the spec no longer holds, or a fallback to a full scan
      refused: [2, 3, 5, 6]  # usage or a malformed prompt set; no spec; no baseline recorded; no prompt set
    coverage:
      # `stdout_count`, and the number counted is the prompts the run actually
      # measured - the `of N` on its own summary line. Not a path count: this
      # tool reads one spec and reports ten figures from it, so a set of paths
      # would be a set of one and would say nothing about whether the eval ran.
      # A floor of 10 is the committed prompt set: a prompt silently deleted
      # takes the count below it and the check refuses rather than passing on
      # a shrunken eval.
      from: stdout_count
      pattern: '^in-band \d+\s+red \d+\s+no-baseline \d+\s+of (\d+)$'
      min_covered: 10
      # NO `spec_units`. This check asserts no requirement in the spec, and
      # claiming one it does not prove is the exact defect the rest of this
      # file is built against. There is no requirement about retrieval cost
      # today; if one is written, the claim belongs here and not before.
    limitations:
      - It claims no requirement. Nothing in the spec obliges a retrieval budget, so this check names none rather than borrowing one it does not assert.
      - The unit is characters, a PROXY for a token budget calibrated at 3.79-4.31 bytes per token on candidate runs, and no factor is applied. A spec that starts quoting interfaces in fenced blocks moves its real retrieval cost by up to 82% at an unchanged character count; that is why `mix` is printed, and `mix` is not banded.
      - The proxy models retrieval as substring search then read-in-file-order. An agent that greps differently, or reads a section rather than a line, costs something this does not measure.
      - The band is a percentage around a recorded baseline. It cannot tell a budget that grew because the spec grew from one that grew because retrieval got worse; both are red, and which it was is read off the table by hand.

  # === THE SIX CHECKS THE TEMPLATE SHIPS AND THIS REPO HAD NEVER DECLARED ===
  #
  # B51. `/productizer:upgrade` reported that the scaffolded template declares
  # secret-scan, dependency-audit, sast, sast-auth, pii-log-scan and
  # secure-coding-controls, and this file named none of them. An undeclared
  # check does not run and never appears in a result, so the suite was
  # silent about whether it had a secret scanner at all.
  #
  # Each is now DECLARED, and each one's state is a decision written down
  # beside it. Two states, both recorded by id in the result and neither a pass:
  #
  #   `when.paths` that matches nothing today -> `not_triggered`. The
  #       self-expiring n/a, the same shape as `jira-unbound`: the premise is
  #       re-read from the change on every run, and the check starts running
  #       the day the premise stops holding. Nobody has to remember it.
  #   `enabled: false` -> `disabled`. For a check that CANNOT run here, or can
  #       never be triggered here. It is reported by name as disabled, it
  #       covers nothing, and it is not counted as passing. The reason is the
  #       `why` and the comment above it, so the argument is in review.
  #
  # One difference measured in a scratch run: the terminal summary prints a
  # `DISABLED` line per disabled check but prints NO line for a `not_triggered`
  # one - it appears only in checks-result.json and in the `N declared, M
  # triggered` header.
  #
  # `--disable-version-check` on every semgrep `version_command`: without it the
  # line recorded as the tool's version was semgrep's update notice, "A new
  # version of Semgrep is available", measured in the same scratch run.
  #
  # Measured 2026-09-13 on this machine: `command -v` finds semgrep 1.171.0 and
  # npm 10.9.4. It did not find gitleaks until B54, the same day, installed
  # 8.30.1. `git ls-files` finds no root package manifest and no
  # `check-pii-logging.sh` anywhere in the tree.

  # --- secret scan: gitleaks 8.30.1, RUNNING ---------------------------------
  #
  # CHANGED 2026-09-13 (B54). Declared DISABLED in v4.58.0 because gitleaks was
  # not installed on the maintainer's machine; it now is (Homebrew, `gitleaks
  # version` -> 8.30.1), and the workflow installs the same release, checksum
  # verified. Everything below was measured against that binary.
  #
  # DETECTION, measured through run-checks.sh in a scratch clone. Six fake
  # credentials in five files - AWS key id and secret key, GitHub token, Slack
  # webhook, GitLab token, quoted password - generated in the formats the real
  # issuers use: FAIL, six results (aws-access-token, generic-api-key x2,
  # github-pat, slack-webhook-url, gitlab-pat). `hygiene` named two of the six
  # and `semgrep p/secrets` three. The v4.58.0 comment said "five" and "two of
  # five": it was six credentials in five files. The EARLIER hand-typed set is
  # weaker evidence and is kept as such: gitleaks caught only its GitHub and
  # GitLab tokens, because that AWS key id used digits outside AWS's base32
  # alphabet and its secret carried the stopword `example`, which gitleaks
  # allowlists.
  #
  # ONE INVOCATION OVER THE TREE, and why each flag is there:
  #
  #   `dir .`, not `{file}`. First shipped per file: 675 processes, and the
  #      runner's one-second poll made it about eleven minutes (60 files took
  #      61.7s). This shape took 3.6s over the same tree. `{files}` is not an
  #      option: `gitleaks dir a b` does not scan a and b - it printed `no leaks
  #      found`, exit 0, while one of them held a token. `.` also walks
  #      untracked and ignored files, so a local run examines more than the
  #      change and a credential left in an untracked file fails it.
  #   `--exit-code 3`. gitleaks exits 1 for a scan that errored and, by default,
  #      for a finding. With 3, 1 is an error (`FTL stat ...: no such file or
  #      directory`) and 126 an unknown flag. Dropping it turns a leak into
  #      REFUSED exit 1 - run.
  #   COVERAGE FROM `--log-level trace`, BECAUSE EXIT 0 IS NOT "EXAMINED". An
  #      unreadable file logs `WRN skipping file: permission denied`, `scanned
  #      ~0 bytes`, `no leaks found`, exit 0. A file counts only if trace logs
  #      `scanning path` (or `skipping empty file`) for it and no later
  #      skipping/could/issue/unable line names it. Measured: that file is
  #      HOLLOW, `not_examined ['cl/locked.txt']`; judged by exit code, PASS.
  #   `--report-format sarif --report-path -`, BECAUSE TRACE PRINTS CONTENT.
  #      Trace logs the text of candidates it SKIPS - unredacted despite
  #      `--redact`; an allowlisted secret-shaped value came out whole - and
  #      debug logs decoded file content (`segment found`). The runner stores
  #      the last 2000 characters of output in checks-result.json. The SARIF
  #      report is written to stdout after every log line, is redacted, and is
  #      about 53KB, so it is what the stored tail holds. Measured without it:
  #      the stored tail held 2 skipped-candidate lines and 16 decoded-content
  #      lines. With it: 0 and 0, and 0 of 15 planted tokens on a failing run.
  #      This depends on the tail staying far smaller than the report.
  #   THE REPOSITORY CAN SWITCH THE SCAN OFF WITHOUT TOUCHING THIS FILE. A
  #      committed `.gitleaksignore` suppressed a planted token to exit 0; a
  #      `.gitleaks.toml` at the root replaces the ruleset; GITLEAKS_CONFIG in
  #      the environment can load an empty one. `rules_command` asks gitleaks,
  #      at debug level, which configuration it loaded, and counts 1 only for
  #      `using default gitleaks config` with no `.gitleaksignore` found; its
  #      output is counted and never stored. All three were run: HOLLOW, 0
  #      rules. `--ignore-gitleaks-allow` closes inline `gitleaks:allow`
  #      comments; this tree has none.
  #
  # NO ALLOWLIST. The whole working tree was scanned on 2026-09-13 and gitleaks
  # reported no finding in any file, tracked or not, so nothing is exempted. If
  # one appears it is a finding for a person first: a real credential in a
  # public repository is rotated, not suppressed.
  - id: secret-scan
    why: a credential pushed to a public repo installed by strangers has to be rotated, and hygiene's regexes caught two of the six planted fakes where gitleaks caught six
    when:
      always: true
    severity: block
    requires: [gitleaks]
    version_command: [gitleaks, version]
    mode: batch
    stderr: coverage_only
    command: [gitleaks, dir, --no-banner, --no-color, --redact, --ignore-gitleaks-allow, --exit-code, "3", --log-level, trace, --report-format, sarif, --report-path, "-", "."]
    timeout_seconds: 300
    exit_codes:
      pass: [0]
      fail: [3]
      refused: [1, 126]
    coverage:
      from: stdout_paths
      pattern: '^[^\n]*(?:TRC|DBG)(?:\x1b\[[0-9;]*m)* (?:\x1b\[[0-9;]*m)*(?:scanning path|skipping empty file)(?:\x1b\[[0-9;]*m)* (?:\x1b\[[0-9;]*m)*path=(?:\x1b\[[0-9;]*m)*"?([^"\n\x1b]*[^"\s\x1b])"?(?:\x1b\[[0-9;]*m)*$(?![\s\S]*^[^\n]*(?:DBG|WRN|ERR|FTL)(?:\x1b\[[0-9;]*m)* (?:\x1b\[[0-9;]*m)*(?:skipping (?!finding|empty file)|could|issue|unable)[^\n]*path=(?:\x1b\[[0-9;]*m)*"?\1"?(?:\x1b\[[0-9;]*m)*(?:\s|$))'
      must_cover: all_triggering
      min_covered: 1
      min_rules: 1
      rules_command: [gitleaks, dir, --no-banner, --no-color, --redact, --exit-code, "0", --log-level, debug, "."]
      rules_pattern: '\A(?![\s\S]*found \.gitleaksignore file)[\s\S]*?(using default (?:gitleaks )?config)'
    limitations:
      - It inherits gitleaks' global allowlist. Lockfiles, images and .git are skipped before `scanning path` is logged, so such a file in the change reads as not examined rather than passing - measured for the allowlist, not for every skip path gitleaks has.
      - It scans the working tree, not git history. A credential committed and later deleted is still in history, and nothing here scans history.
      - Its standard error is `coverage_only` (B163): gitleaks' trace log, which prints a skipped candidate's value unredacted, is read for coverage and never stored or printed. The stored tail is the SARIF report on standard output, which `--redact` covers; a value gitleaks wrote unredacted to standard output would still be kept.
      - Encoded credentials depend on gitleaks' default decode depth of 5; nothing here measured one.

  # --- dependency audit: declared, and not triggered while there is nothing to audit
  #
  # There is no package manifest at this repository's root: what ships is shell,
  # Python and Markdown, and the one `package.json` in the tree is a survey
  # fixture under `fixtures/unmeasured-report/`. `npm audit` with no lockfile
  # exits 1 with ENOLOCK - measured - so running it every commit would be a
  # red suite about a dependency tree that does not exist.
  #
  # So the trigger IS the premise. The globs are root-anchored on purpose: this
  # runner's `*` does not cross `/`, so a fixture manifest cannot trigger an
  # audit of the root, and a real root manifest or lockfile arriving in a
  # change starts the check on that change with no edit here. The template's
  # `tags` are dropped because nothing in this repository passes `--tags`.
  #
  # The coverage pattern is the corrected template one. The template read
  # `totalDependencies`, which npm 10.9.4's `--json` does not print - measured on
  # a clean one-dependency lockfile, zero matches - so every clean audit would
  # have come back hollow.
  - id: dependency-audit
    why: an advisory against a pinned dependency lands without anyone editing a file, and the moment this repo gains a root manifest there is a tree to audit; until then there is none, and the trigger says so on every run
    when:
      paths:
        - "package.json"
        - "package-lock.json"
    severity: block
    requires: [npm]
    version_command: [npm, --version]
    mode: batch
    command: [npm, audit, --audit-level=high, --json]
    timeout_seconds: 180
    exit_codes:
      pass: [0]
      fail: [1]
    coverage:
      from: stdout_count
      pattern: '(?:"totalDependencies"\s*:\s*|"dependencies"\s*:\s*\{[^{}]*"total"\s*:\s*)([0-9]+)'
      min_covered: 1
    limitations:
      - Not triggered today. It says nothing about dependencies this repo pulls in outside a manifest - the pinned PyYAML and Claude Code CLI installs in the workflow are not audited by anything.
      - npm exits 1 for an advisory at or above the floor AND for ENOLOCK, so a manifest committed without a lockfile fails as if it were vulnerable. That fails closed, and the output says which.

  # --- SAST, baseline: semgrep p/default, RUNNING ---------------------------
  #
  # The one semgrep check this repository can honestly run. Measured over all
  # 19 tracked .py and .js files: 494 rules loaded, 0 findings, exit 0. The
  # workflow installs the same pinned semgrep in an isolated venv.
  #
  # THREE CORRECTIONS TO THE TEMPLATE, EACH MEASURED ON SEMGREP 1.171.0:
  #   1. `--error`. Without it semgrep exits 0 WITH findings: a scratch file
  #      holding `eval(input())` produced one finding and exit 0, and exit 1
  #      only once `--error` was added. The template's `fail: [1]` was a code
  #      semgrep never returned for a finding.
  #   2. `--dump-config` does not exist: `unknown option '--dump-config'`,
  #      exit 2. The template's rule count therefore read 0 on every run and
  #      the check was hollow whatever it scanned. Rules are counted instead
  #      from `--time`, whose JSON names every rule that loaded for a target;
  #      over contradiction-check.py the pattern below matched exactly the 342
  #      ids semgrep listed, no more and no fewer. No `--error` there, so a
  #      finding in that file cannot zero the count.
  #   3. `--metrics=off`. semgrep's own help: with the default `auto`, "metrics
  #      are sent whenever the --config value pulls from the Semgrep server",
  #      which every `p/` ruleset does. This suite runs on contributors'
  #      machines.
  #
  # THE RULESET IS NOT PINNED, and that is accepted with eyes open. `p/default`
  # is fetched from the registry at run time, so its content can change between
  # two runs of an unchanged commit - which the workflow refuses for the
  # manifest validator. The difference is the direction: a registry that adds a
  # rule turns an unchanged commit red on a real finding, which is the same
  # property `dependency-audit`'s `why` names for advisories.
  - id: sast
    why: the ordinary injection and unsafe-evaluation classes in the Python and JavaScript this plugin ships and runs on other people's machines
    when:
      paths:
        - "**/*.py"
        - "**/*.js"
        - "**/*.ts"
        - "**/*.go"
    severity: block
    requires: [semgrep]
    version_command: [semgrep, --version, --disable-version-check]
    mode: batch
    command: [semgrep, --config, p/default, --json, --quiet, --metrics=off, --error, "{files}"]
    timeout_seconds: 600
    exit_codes:
      pass: [0]
      fail: [1]
      refused: [2, 4, 7]
    coverage:
      from: stdout_paths
      json_paths: paths.scanned
      json_not_examined: [errors.path, errors.spans.file, paths.skipped.path]
      must_cover: all_triggering
      min_covered: 1
      min_rules: 50
      rules_command: [semgrep, --config, p/default, --json, --time, --quiet, --metrics=off, plugins/productizer/skills/spec/scripts/contradiction-check.py]
      rules_pattern: '"([a-z0-9_-]+(?:\.[A-Za-z0-9_-]+){3,})"'
    limitations:
      - The rule floor is counted over one Python file, so it proves the Python rules loaded. A registry response that dropped only the JavaScript rules would pass the floor.
      - The ruleset is fetched from the registry on every run and is not content-pinned, so the same commit can be green on one day and red on the next.
      - It sees only .py, .js, .ts and .go. The 72 shell scripts, which are most of what this plugin executes, are `shell-lint`'s and `stderr-suppression`'s, not this check's.
      - Coverage is semgrep's `paths.scanned` less the files its `errors` and `paths.skipped` name (B164). A file semgrep parsed only in part, listed as a PartialParsing error, counts as not examined although rules ran over the part it parsed, so such a file makes the check hollow rather than passing.

  # --- SAST on authentication, and the control-framework scan: DISABLED -----
  #
  # Both trigger ONLY on requirement tags, and a tag reaches this runner only
  # through `--tags`. Measured: nothing in this repository passes `--tags` to
  # run-checks.sh - not the workflow, not a script, not a hook - so as enabled
  # checks they would be `not_triggered` on every run forever. That would look
  # like a scoped check waiting for its change when it is a check that cannot
  # fire, which is the silence B51 was about. `disabled` says what is true.
  #
  # Their argv carries the same `--error` and `--metrics=off` correction as
  # `sast`, so enabling one is a trigger decision and not a hidden bug. They
  # keep no rule floor: `--dump-config` does not exist, and the replacement
  # enumerates rules per target language - `p/secure-defaults` loaded ONE rule
  # for a Python target, against the template's floor of ten.
  - id: sast-auth
    enabled: false
    why: DISABLED because it triggers only on requirement tags and nothing in this repository passes --tags, so enabled it would be not_triggered on every run and read as a scoped check rather than one that cannot fire
    when:
      tags: [auth, authn, authz, session, crypto, secrets]
    severity: block
    requires: [semgrep]
    version_command: [semgrep, --version, --disable-version-check]
    mode: batch
    command: [semgrep, --config, p/jwt, --config, p/secrets, --json, --quiet, --metrics=off, --error, "{files}"]
    timeout_seconds: 900
    exit_codes:
      pass: [0]
      fail: [1]
      refused: [2, 4, 7]
    coverage:
      from: stdout_paths
      json_paths: paths.scanned
      json_not_examined: [errors.path, errors.spans.file, paths.skipped.path]
      must_cover: all_triggering
      min_covered: 1
    limitations:
      - Disabled. It covers nothing. Enabling it needs a caller that derives tags from the spec and passes them, which does not exist.

  - id: secure-coding-controls
    enabled: false
    why: DISABLED because it triggers only on ISO control-id tags, spec.md carries none of them - tagging is backlog item B20 - and nothing in this repository passes --tags; enabled it could never fire
    when:
      tags:
        - "A.8.28"
        - "A.8.26"
        - "42001-6.1.3"
    severity: block
    requires: [semgrep]
    version_command: [semgrep, --version, --disable-version-check]
    mode: batch
    command: [semgrep, --config, p/secure-defaults, --json, --quiet, --metrics=off, --error, "{files}"]
    timeout_seconds: 900
    exit_codes:
      pass: [0]
      fail: [1]
      refused: [2, 4, 7]
    coverage:
      from: stdout_paths
      json_paths: paths.scanned
      json_not_examined: [errors.path, errors.spans.file, paths.skipped.path]
      must_cover: all_triggering
      min_covered: 1
    limitations:
      - Disabled. It covers nothing, and this repository makes no control-framework claim for it to evidence.

  # --- PII in logs: DISABLED, the tool is the template's example ------------
  #
  # The template's entry names `./scripts/check-pii-logging.sh` as a worked
  # example of an in-house rule. That script exists nowhere in this tree - not
  # under `scripts/`, not shipped under the plugin - so enabled it reads
  # `missing_tool` and refuses the suite. Nor is there a subject for it: this
  # plugin runs no service and writes no log line about a person. Writing a
  # scanner to declare it would be a check built to have a check.
  - id: pii-log-scan
    enabled: false
    why: DISABLED because its tool is the template's worked example and exists nowhere in this tree, and this plugin runs no service and logs nothing about a person
    when:
      paths:
        - "**/*.py"
        - "**/*.js"
        - "**/*.ts"
    severity: advise
    requires: [./scripts/check-pii-logging.sh]
    version_command: [./scripts/check-pii-logging.sh, --version]
    mode: per_file
    command: [./scripts/check-pii-logging.sh, "{file}"]
    timeout_seconds: 60
    exit_codes:
      pass: [0]
      fail: [1]
      refused: [2]
    coverage:
      from: per_file_exit
      examined_when_exit_in: [0, 1]
      must_cover: all_triggering
      min_covered: 1
    limitations:
      - Disabled. It covers nothing.

# --- risk tiers: a path no rule covers -------------------------------------
#
# ADVISORY ON PURPOSE, and by the rule these scripts propose: a check earns
# `block` by having its fires RULED over merged history, and this one has no
# fire rate taken at all. references/risk-and-calibration.md carries the rule
# and the figures. Grey is not a tier - a path no rule covers is a decision
# nobody made, and rendering it as the bottom tier is R26's fabricated zero in
# words rather than in numbers.

  - id: risk-tier-classified
    why: a change touching a path no risk rule covers is unmeasured, not safe, and nothing else in this repository notices a path arriving from outside the policy
    when:
      always: true
    severity: advise
    requires:
      - ./plugins/productizer/skills/spec/scripts/classify-change-risk.sh
      - git
    version_command: [./plugins/productizer/skills/spec/scripts/classify-change-risk.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/classify-change-risk.sh, "{files}"]
    timeout_seconds: 60
    exit_codes:
      pass: [0]
      fail: [1]
      refused: [2, 3]
    coverage:
      spec_units:
        - id: R42
          verdict: Partial
          reason: >-
            Reports the tier of every path and the rule that decided it. It reads the PATH and never
            the file's CONTENT, so a typo fix and an inverted requirement in the same red file are
            one measurement here, and the tier being RIGHT is not asserted by anything.
          evidence: >-
            18 self-test cases over exit codes 0 1 2 3, five of which assert the sentence and not
            only the code. The policy was calibrated against all 121 commits and one rule moved
            because of the number: plugin.json is touched by 106 of 121 commits, which put 111 of
            121 commits in the top tier - a tier reached by 92% of commits is a second word for
            "a commit". After the move, 55 of 121.
        - id: R43
          verdict: Covered
          evidence: >-
            A path matching no rule exits 1 and is named. There is deliberately no catch-all rule:
            a catch-all makes every path added tomorrow low-risk on the day nobody has looked at it.
            Falsified by collapsing grey into the bottom tier - three cases went red and one
            documented exit code stopped being reached, which the declaration line reported.
        - id: R44
          verdict: Covered
          evidence: >-
            The other half of the same case, asserted separately: the word `unclassified` is printed
            and no tier word is. Measured over all 121 commits - 740 distinct paths, grey residue 0 -
            which is a property of a policy written after reading that history and says nothing
            about a path arriving tomorrow.
        - id: R45
          verdict: Covered
          evidence: >-
            Prints `complexity: unmeasured` on every run, and is covered by printing the same word
            every time: no path predicts how much planning a change needs, so there is nothing to
            measure and R25 says what to print instead. SIZE is measured from the diff and named as
            size, `unmeasured` with no `--base`.
        - id: R46
          verdict: Covered
          evidence: >-
            The one break the exit codes could not catch. Deriving complexity from the tier left all
            18 codes correct and was caught only by the case that asserts the sentence
            (`wording:mixed`) - the whole argument for asserting sentences and not only codes.
      from: stdout_paths
      pattern: '^(\S+)$'
      must_cover: all_triggering
      min_covered: 1
    limitations:
      - ADVISORY by its own rule - no fire of this check has ever been ruled, and its rate over merged history has not been taken. The only check here whose fires HAVE been ruled is stderr-suppression, at 2 fires over 17 verdicts, both genuine.
      - The tier list's ORDER is the ranking, and that is a property of the policy file. A policy listing its tiers low-to-high would produce confident backwards answers and nothing here would notice.
      - '`--calibrate` and `--base` have no self-test case: both need a real git history, and a self-test that built one would be measuring the fixture it had just written.'
      - checks-result.json is the bottom tier because 43 of 121 commits regenerate it. A hand-forged result file therefore reads as routine - a path cannot tell regenerated from forged.
      - plugin.json is the middle tier because the version is bumped before every commit. A changed description or declared-skills list reads the same as a version bump.

# --- the governance config did not protect itself --------------------------
#
# Measured on this repository at v4.60.0, five ways, each committed on its own
# clone and each run through the whole suite: deleting a check from checks.yaml,
# flipping its `severity: block` to `advise`, adding `enabled: false`, replacing
# `always: true` with a glob matching nothing, and removing one tool's
# `--selftest` line from the workflow. ALL FIVE EXITED 0 PASS. Nothing was
# reading the file that decides which gates exist.
#
# Declared as TWO checks on purpose. The sweep ADVISES, because most weakenings
# are deliberate and a blocking sweep would be switched off inside a week. The
# self-footing half BLOCKS, because a diff that switches off the check watching
# for switched-off checks is the one move that cannot be left to advice.

  - id: governance-weakening
    why: loosening a declared check is an ordinary diff, and five separate weakenings of secret-scan each passed the whole suite green at v4.60.0
    when:
      always: true
    severity: advise
    requires:
      - ./plugins/productizer/skills/spec/scripts/check-governance-weakening.sh
      - python3
      - git
    version_command: [./plugins/productizer/skills/spec/scripts/check-governance-weakening.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/check-governance-weakening.sh, --base, "{base}"]
    timeout_seconds: 180
    exit_codes:
      pass: [0]
      fail: [1]
      refused: [2]
    coverage:
      spec_units:
        - id: R47
          verdict: Partial
          reason: >-
            Reports WHAT MOVED and what it was, and leaves the judgement to a person: whether a
            weakening was WRONG is not asserted and cannot be. Comments, `why:` text and
            `limitations:` entries are outside the governance surface deliberately - a rule that
            went red on reflowed prose would be switched off inside a week.
          evidence: >-
            65 self-test cases over exit codes 0 1 2. Each of the five weakenings measured above is
            now reported by name and by what it was, for example `WEAKENED:
            checks[secret-scan].severity (effective) was 'block' is now 'advise'`. Over all 36
            commits that ever touched either governance file: 32 exit 0, 2 exit 1 (undecided moves,
            zero claimed weakenings), 2 exit 2 (a checks.yaml genuinely unparseable at that commit).
        - id: R133
          verdict: Covered
          evidence: >-
            check-governance-weakening.sh 1.1 with governance-weakening.py (B138), 75 self-test
            cases. `job-token-raised` exits 1 naming the job and the scope - a scope added to an
            existing job's own permissions block, which was never read before; `new-job-token`
            exits 1 on a new job whose token holds a scope above the workflow's default at the
            base, and reports the scope equal to the default as no weakening. Falsified
            2026-10-13 by the building agent, each rule on its own. Its history sweep: only
            5117f48 and ba343ed changed verdict, and both were real widenings that had been
            missed.
        - id: R134
          verdict: Covered
          evidence: >-
            Steps are keyed by id, else by name and the action used with its ref ignored, never
            by position: `step-replaced` exits 1 - an unnamed checkout replaced in place by an
            unnamed download, which a positional key read as one step; `checkout-moved` exits 0
            and reports the move to a read-only job as a tightening, as at ba343ed; `pin-bumped`
            exits 0, a bumped @ref being the same step. Falsified 2026-10-13 by the building agent,
            each rule on its own.
        - id: R160
          verdict: Covered
          evidence: >-
            check-governance-weakening.sh 1.2 (B149), 86 self-test cases. `needs-dropped` - the
            release job's needs: checks removed - exits 1 with `WEAKENED:
            workflow.jobs[release].needs`; `job-if-added` exits 1 with `WEAKENED:
            workflow.jobs[release].if`. Both exited 0 on 1.1. Falsified 2026-10-28 with the job
            comparison off: 81 of 86.
        - id: R161
          verdict: Covered
          evidence: >-
            check-governance-weakening.sh 1.2 (B149). `step-body-changed` (a checkout gaining
            persist-credentials: true under its key) and `run-rewritten` (the Draft run: losing
            --draft) exit 1 with `UNDECIDED: workflow.step[...].body`; `if-rewritten` exits 1
            with the job's and the step's rewritten if: UNDECIDED; `pin-bumped` still exits 0.
            Falsified 2026-10-28: the body comparison off, 82 of 86; both rewritten-if branches
            off, 83 of 86.
        - id: R174
          verdict: Covered
          evidence: >-
            check-governance-weakening.sh 1.3 (B175), 90 self-test cases. With `id: co` on the
            release job's checkout at the base, `id-action-changed` - the action moved to
            someone-else/checkout at the same ref - exits 1 with `UNDECIDED:
            workflow.step[release/id=co].uses`, both names printed; `id-pin-bumped` and
            `pin-bumped` exit 0. Falsified 2026-10-28: the comparison off, 88 of 90; the raw uses
            compared with its @ref, 85 of 90.
      from: stdout_paths
      pattern: '^(\S+)$'
      must_cover: none
      min_covered: 1
    limitations:
      - It reports movement between a base and the work tree. A check that was never strict, and a whole governance surface weak from the day it was written, are invisible to it.
      - Four of its own falsifications came back GREEN on the first attempt, and each was reported as a finding about the test rather than quietly re-run.
      - Since 1.1 a workflow job's own permissions and its steps are compared (R133, R134), since 1.2 a job's `needs:` and `if:` and a kept step's body (R160, R161, B149), and since 1.3 the action a kept step uses, its `@ref` dropped (R174, B175). A changed body, a rewritten `if:` or another action under a kept `id` is UNDECIDED, never a claimed weakening: whether a new `run:` or another action asserts less is not decided here, and every routine edit to a step's `run:` now reads as one.

  - id: governance-self-footing
    why: a diff that deletes or switches off the check watching for switched-off checks is the one move that cannot be left to advice
    when:
      always: true
    severity: block
    requires:
      - ./plugins/productizer/skills/spec/scripts/check-governance-weakening.sh
      - python3
      - git
    version_command: [./plugins/productizer/skills/spec/scripts/check-governance-weakening.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/check-governance-weakening.sh, --self-only, --self-id, governance-weakening, --base, "{base}"]
    timeout_seconds: 180
    exit_codes:
      pass: [0]
      fail: [1]
      refused: [2]
    coverage:
      spec_units:
        - id: R47
          verdict: Partial
          reason: >-
            The narrow half: it asserts only this pair of declarations' own footing, and says nothing
            about any other check. A run under this mode prints `mode: self-footing only` so it can
            never be mistaken for the sweep.
          evidence: >-
            Driven by its own cases both ways: a check switched off elsewhere exits 0 under
            `--self-only` (a real weakening of the surface, and not of this check's footing), while
            deleting this check's own declaration exits 1 naming `SELF WEAKENED: self.declaration`.
            Asking it to assert a footing declared at neither end is exit 2 - nothing to assert,
            which is not a pass.
      from: stdout_paths
      pattern: '^(\S+)$'
      must_cover: none
      min_covered: 1
    limitations:
      - It asserts that the declaration EXISTS and has not moved down a ladder. A declaration that exists and points at a tool that no longer asserts anything is outside it - that is what R39 and R40 are for.

# --- if the diff shows a path, the record should name it --------------------
#
# The failure this exists for happened here: eight agents were writing at once,
# one had files open in a directory that was not being committed, and those
# files went into an unrelated commit. The message was true about the work it
# described and silent about the rest, and silence is what a sweep looks like.
# ADVISORY: a swept path and a path deliberately left unmentioned look identical
# to it, and only a person can tell them apart.

  - id: diff-paths-named
    why: nothing in this repository compared the set of paths a commit touched against the set its own message names, and a sweep is exactly the commit that looks clean
    when:
      always: true
    severity: advise
    requires:
      - ./plugins/productizer/skills/spec/scripts/check-diff-paths-named.sh
      - git
    version_command: [./plugins/productizer/skills/spec/scripts/check-diff-paths-named.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/check-diff-paths-named.sh]
    timeout_seconds: 120
    exit_codes:
      pass: [0]
      fail: [1]
      refused: [2]
    coverage:
      spec_units:
        - id: R109
          verdict: Partial
          reason: >-
            Asserts that the record NAMES the path - as a full path, a path-shaped directory prefix,
            or a basename. It does not assert that the record is HONEST about a path it names:
            naming is not explaining, and a message listing every path mechanically would pass.
          evidence: >-
            The commit message is the record, chosen over the spec's change log (keyed on a
            different event - a classification that changed the spec - so the sweep this exists for
            is outside its trigger and always will be) and over the checks result file (which
            records what the suite examined, and a swept path is examined exactly as happily as an
            intended one).
      from: stdout_paths
      pattern: '^(\S+)$'
      must_cover: none
      min_covered: 1
    limitations:
      - ADVISORY, because a swept path and a path deliberately left unmentioned are identical to it. It says which paths the record does not name and leaves the reading to a person.
      - It reads the LAST commit by default, so the commit being written is outside it until it exists. `--message-file` points the same rule at an uncommitted message, which is how a pre-commit hook would use it.

# --- what the dashboard DRAWS, in a browser --------------------------------
#
# Everything else that touches the view reads the GENERATOR. Between the derived
# graph and the pixels sit a page of JavaScript and 1200 lines of CSS that
# nothing committed had ever exercised. Two page-level breaks were caught there
# once, by a scratch script that was never committed - so the next one would not
# have been.

  - id: view-rendered
    why: a delta state drawn as another state, or an unreadable result drawn as a measured zero, is a false figure in front of a reader and no check read the rendered page
    when:
      always: true
    severity: block
    requires:
      - ./plugins/productizer/skills/spec/scripts/check-view-rendered.sh
      - node
    # The probe is deliberately NOT listed. `requires` asks the runner whether a
    # tool can be EXECUTED, and the probe is data for node rather than a program
    # of its own; listing it reported `missing_tool` for a file that is present
    # and readable. The check itself refuses with exit 2 when its probe is absent,
    # which names the real reason instead of the runner guessing at it.
    version_command: [./plugins/productizer/skills/spec/scripts/check-view-rendered.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/check-view-rendered.sh]
    timeout_seconds: 600
    exit_codes:
      pass: [0]
      fail: [1]
      refused: [2]
    coverage:
      spec_units:
        - id: R104
          verdict: Partial
          reason: >-
            R104 supersedes R49 (B102) and claims what is asserted. In each of three modes - plain,
            `forced-colors: active` and `prefers-contrast: more` - the six overlay states are
            pairwise distinct on glyph and on state word (the verdict suffix cut off), and the five
            change states on word, on glyph and on badge class. Asserted beyond R104: the overlay
            states' (border style, border width, hatched-or-flat fill) TUPLE is distinct - two may
            share a border style - and an unreadable or absent result draws exactly one `?` box
            with zero nodes, zero stat tiles and zero delta rows. NOT asserted: colour, which every
            assertion is blind to, and what a human eye can distinguish; three of the overlay
            states have no live example in this repository's own data, so they are asserted
            against fixtures only.
          evidence: >-
            76 assertions in 22 seconds against fixtures whose right answers are written down, plus
            17 self-test cases over exit codes 0 1 2, each break applied to a BUILT page so a
            template edit that moves the text it matches reads as a mutation that did not apply and
            fails the run rather than silently driving one case fewer. Writing it found that
            `prefers-contrast: more` was not in the template at all - 0 occurrences before, 2 after.
      from: stdout_paths
      pattern: '^(\S+)$'
      must_cover: none
      min_covered: 1
    limitations:
      - Colour is deliberately not asserted, because a reader who cannot use hue must still tell the states apart. Contrast RATIOS are not measured either - the ones behind the prefers-contrast block were computed by hand and written into the template beside the tokens.
      - Of the two contrast modes only `prefers-contrast` has a case that goes red when its block is removed: deleting the `forced-colors` block leaves the states distinct in this browser because the hatch is discarded by the browser, not by the rule.
      - It refuses loudly (exit 2) when node is absent rather than skipping, so an environment without node reports unmeasured instead of green.

# --- the requirement index, generated rather than maintained --------------
#
# B75. The index carried the template's three example rows while the spec held
# 43 active requirements, two of them stating a status the spec denies (R2
# "superseded by R41", R3 "withdrawn"), and nothing compared the table with the
# requirements. It is now generated between markers by
# build-requirement-index.sh and this asserts it is current - the same shape as
# guide-current, and blocking for the same reason: a table that looks
# authoritative and is not is worse than no table.
#
# No requirement obliges the index to exist or be current, so the only claim
# here is R141, on the path options of the builder it runs (v4.72.0).

  - id: requirement-index-current
    why: the requirement index carried the template's three example rows while the spec held 43 active requirements, two of them stating a status the spec denies, and nothing compared the table with the requirements
    when:
      always: true
    severity: block
    requires:
      - ./plugins/productizer/skills/spec/scripts/build-requirement-index.sh
      - ./plugins/productizer/skills/spec/scripts/spec-requirements.sh
      - python3
    version_command: [./plugins/productizer/skills/spec/scripts/build-requirement-index.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/build-requirement-index.sh, --check]
    timeout_seconds: 60
    exit_codes:
      pass: [0]
      fail: [1]        # the table between the markers differs from a fresh render of the spec
      refused: [2, 3]  # the index file missing or unreadable, its markers missing, duplicated or reversed, --index naming the spec, or a marker left in the spec; or a spec that could not be read into an index
    coverage:
      # Printed only after the markers are validated and every requirement is
      # classified; a run that indexed none exits 3 instead, so a zero here is
      # impossible rather than unlikely.
      from: stdout_count
      pattern: '([0-9]+) requirement\(s\) indexed'
      min_covered: 1
      spec_units:
        - id: R141
          verdict: Partial
          reason: >-
            B140 and B141, ruled "converge on repo root". The declared check runs this script at
            the repository root, where the working directory IS the root, so its own run proves
            nothing about a relative option; the cases that drive one from another working
            directory are the script's self-test, which the workflow runs and no declared check
            does. Of the eight scripts changed under the ruling, seven are run by a declared check
            (classification-provenance, jira-unbound, guide-current, requirement-index-current,
            calibration-recorded, view-publish-refused, installed-copies) and graduate.sh by
            none. `--root` itself, if relative, is read from the working directory, which the
            requirement excepts; CLAUDE_TRANSCRIPTS, an environment variable graduate.sh reads, is
            not root-resolved; and the lifecycle's other scripts were not swept.
          evidence: >-
            build-requirement-index.sh 1.2 `--selftest`: `relative-spec-under-root` and
            `relative-index-under-root` read a relative --spec and --index under the root, never
            the working directory.
    limitations:
      - It compares the rows with the spec. It does not assert that a cited check is declared, enabled or claims the requirement - check-acceptance-rows.sh asserts that - nor that a requirement's pattern heading agrees with its sentence, which validate-spec.py reads.
      - The rule that picks check ids out of an acceptance row is a COPY of check-acceptance-rows.sh's rule, agreeing with it today on all 26 pairs. Nothing asserts that parity on every run, so if that rule changes the two drift apart silently.

# --- the two eval corpora, kept valid ---------------------------------------
#
# B79. Neither corpus checker was declared, so nothing stopped a later edit
# re-inlining the spec into a mechanism prompt - the exact defect that corpus
# exists to remove - or breaking the hard corpus that B18's published result
# stands on. Both are deterministic, stdlib-only and pass on the real corpora
# today. Blocking, as solver-corpus and guide-current are: a corpus checker that
# only advises is one a corrupting edit walks straight past, and the results
# already published from these corpora are what it would corrupt.
#
# `always`, not `paths`: each also depends on the plugin path its cases name
# resolving, and a move under plugins/ breaks that without touching evals/. Each
# costs well under a second.
#
# `requires` names python3 alone. The two .py files are not executable, and
# `requires` asks whether a tool can be EXECUTED - listing them reported
# `missing_tool` for the last file declared that way. The command runs them
# through python3, and each refuses by itself if it cannot read what it needs.
#
# NO spec_units: no requirement in the spec is about an eval corpus.

  - id: hard-corpus
    why: the b18-hard corpus is pre-registered and fingerprinted and B18's published result stands on it, and nothing stopped a later edit un-inlining a fixture or breaking a plugins path, which silently turns the plugin arm into a second bare arm
    when:
      always: true
    severity: block
    requires: [python3]
    version_command: [python3, --version]
    mode: batch
    command: [python3, evals/check-hard-corpus.py]
    timeout_seconds: 60
    exit_codes:
      pass: [0]
      fail: [1]        # a fixture not inlined exactly once, a plugins path that does not resolve, or a case missing a file its class needs - each named in a sentence
      refused: [2]     # bad usage, rejected by check-corpus.py's argument parser
    coverage:
      # The case count the structural pass prints; a deleted case drops it below the floor.
      from: stdout_count
      pattern: '^cases\s+:\s+([0-9]+)'
      min_covered: 14
    limitations:
      - A missing `hard-fixtures/` still ends in a traceback at exit 1, so it reads as a finding rather than as could-not-run. Every missing file INSIDE a case is now a named finding (B82): a missing prompt.md, graders/, 01-no-false-halt.md or 02-work-halted.md, and a class with no cases at all.
      - It checks structure only. Recall needs a real `claude plugin eval` result and is not part of this check.

  - id: mech-corpus
    why: the mechanism corpus exists to keep the spec OFF the prompt, and nothing stopped a later edit pasting it back in - which would silently rebuild the defect that made B18's mechanism test void
    when:
      always: true
    severity: block
    requires: [python3]
    version_command: [python3, --version]
    mode: batch
    command: [python3, evals/check-mech-corpus.py]
    timeout_seconds: 60
    exit_codes:
      pass: [0]
      fail: [1]        # a prompt that shares a 10-word run with a fixture, a scaffold or case.yaml that differs from the pinned text, a broken twin pair, a tag outside mech-cases
      refused: [2]     # could not run - bad usage, or a corpus or fixture it could not read
    coverage:
      from: stdout_count
      pattern: '^cases\s+:\s+([0-9]+)'
      min_covered: 14
    limitations:
      - The off-prompt signal is a VERBATIM 10-word run. A paraphrase of the spec pasted into a prompt passes it.
      - It pins what the scaffold and case.yaml SAY. What the harness does with them was measured once, by the stage-0 smoke run recorded as amendment A1, and nothing here re-measures it.

# --- the two validations CI ran and the local suite did not ----------------
#
# B81. The workflow's EARS step runs `validate-spec.py --repo .`, and nothing
# declared here did. v4.61.0 added eight requirements, left the spec header
# saying `35 active`, passed the whole local suite, and failed CI on
# `COUNT_MISMATCH: header declares 35 active, the file holds 43`. The backlog
# validation had the same gap. Declared so the local run and CI ask the same
# question. Blocking, because CI already blocks on both: an advisory copy of a
# blocking CI step is a local run that says yes to something CI says no to.

  - id: spec-valid
    why: CI validated the spec's EARS grammar, id permanence and header counts and the local suite did not, so a stale header count passed locally and failed on main
    when:
      always: true
    severity: block
    requires: [python3]
    version_command: [python3, --version]
    mode: batch
    command: [python3, plugins/productizer/skills/spec/scripts/validate-spec.py, --repo, .]
    timeout_seconds: 120
    exit_codes:
      pass: [0]
      fail: [1]        # at least one ERROR
      refused: [2, 4]  # usage error; NOT MEASURED - a file unreadable, its kind unknown, or nothing in it to check
    coverage:
      from: stdout_count
      pattern: '([0-9]+) file\(s\) checked'
      min_covered: 1
    limitations:
      - It runs exactly what CI's EARS step runs, and no more. Anything that step does not check, this does not either.

  - id: backlog-valid
    why: CI validated the backlog's ids and header counts and the local suite did not; a stale id counter once went four releases unnoticed
    when:
      always: true
    severity: block
    requires: [python3]
    version_command: [python3, --version]
    mode: batch
    command: [python3, plugins/productizer/skills/spec/scripts/validate-spec.py, --kind, backlog, .claude/productizer/backlog.md]
    timeout_seconds: 60
    exit_codes:
      pass: [0]
      fail: [1]
      refused: [2, 4]
    coverage:
      from: stdout_count
      pattern: '([0-9]+) file\(s\) checked'
      min_covered: 1

# --- unquoted expansions, which shell-lint's severity never raised ----------
#
# B85. shell-lint runs `shellcheck --severity=warning`, and SC2086 - an unquoted
# expansion - is severity INFO, so the defect shell-lint's own reason named could
# never fire. Recall measured it: 0 of 10 planted unquoted expansions caught.
# Lowering shell-lint to info would have added about ninety unrelated findings
# (63 of them SC2016, mostly a deliberate `$` inside a quoted awk or python
# program) and buried this one, so this is its own check raising that ONE code.
# The repository had three, all fixed before this was declared, each with its
# self-test output unchanged.

  - id: shell-quoting
    why: an unquoted expansion splits and globs a value nobody meant to split, on machines that are not ours, and shell-lint's severity never raised it
    when:
      paths: ["**/*.sh"]
    severity: block
    requires: [shellcheck]
    version_command: [shellcheck, --version]
    mode: per_file
    command: [shellcheck, --severity=info, --include=SC2086, --format=gcc, "{file}"]
    timeout_seconds: 600
    exit_codes:
      pass: [0]
      fail: [1]
      refused: [2, 3, 4]
    coverage:
      from: per_file_exit
      examined_when_exit_in: [0, 1]
      must_cover: all_triggering
      min_covered: 1
    limitations:
      - It raises SC2086 and nothing else. A split that is intended must be written as one - an array, or `tr` - rather than left unquoted; a file that needs an exception says so with a `# shellcheck disable=SC2086` comment and its reason beside it.

# --- an early reader on a pipe under pipefail (B131) -----------------------
#
# `grep -q` stops at its first match and `head` once it has its lines; whatever
# is still writing into the pipe takes SIGPIPE and exits 141, and pipefail makes
# that the pipeline's status. So a self-test's documented-codes loop reported a
# code that WAS reached as missing (seen once for real in build-guide.sh under
# parallel load), and an assignment from such a pipeline ends a `set -e` script
# with no message. Measured 2026-10-12: 148 false misses in 12000 runs through
# the pipe, 0 in 12000 through a here-string. Every tracked shell file reads 0
# findings since v4.70.0: 41 scripts were converted to here-strings first, and
# the last 18 sites in v4.70.0 itself.
  - id: sigpipe-under-pipefail
    why: an early reader on a pipe under pipefail turns a match into exit 141, so a self-test reports a code it reached as missing and a set -e script ends with no message
    when:
      paths: ["**/*.sh", "**/*.bash"]
    severity: block
    requires: [./plugins/productizer/skills/spec/scripts/check-sigpipe.sh]
    version_command: [./plugins/productizer/skills/spec/scripts/check-sigpipe.sh, --version]
    mode: per_file
    command: [./plugins/productizer/skills/spec/scripts/check-sigpipe.sh, "{file}"]
    timeout_seconds: 60
    exit_codes:
      pass: [0]
      fail: [1]        # an early reader on a pipe under pipefail, named by file and line
      refused: [2]     # an unreadable file, or an exemption with no reason
    coverage:
      from: per_file_exit
      # 0 = read end to end with nothing found, 1 = read end to end with a
      # finding. A 2 is a file it could not read or an exemption it would not
      # honour, and neither is a file it checked.
      examined_when_exit_in: [0, 1]
      must_cover: all_triggering
      min_covered: 1
    limitations:
      - Pipefail switched on in another file (sourced or inherited) is not seen; the `set` line is looked for in each file scanned.
      - A reader reached through a function, alias or variable, other early readers (`sed q`, `awk` with `exit`, `read`, `cmp`, python), and shell outside a .sh or .bash file - a workflow `run:` block, a Markdown fence - are not read. The workflow's two `gh --version` lines were fixed by hand in v4.70.0, not by this check.
      - A `$( ... )` inside an unquoted here-document body, and backtick substitution, are read as text and as plain code respectively.

# --- self-tests the workflow ran and no declared check did (B130) -----------
#
# Each tool below carried a self-test that `.github/workflows/checks.yml` ran
# and no check in this file did, so the requirements its cases prove could not
# be claimed: an unclaimed active requirement reads Missing and refuses the run.
# Declared as their self-tests, the way stage-advance-guard and build-dispatch
# are, because none of the four is a check over a change - each is a tool whose
# verdict a commit can return only as "does it still do what it says". A fifth,
# view-builder, runs build-view.sh's self-test for B115.

  - id: pr-body-renderer
    why: the pull request body is the one rendering of a change a reviewer reads, and an adopter's body that names this repository's artifacts, or renders without the solver probe, reads as evidence that does not exist
    when:
      always: true
    severity: block
    requires: [./plugins/productizer/skills/spec/scripts/pr-spec-comment.sh, git, python3]
    version_command: [./plugins/productizer/skills/spec/scripts/pr-spec-comment.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/pr-spec-comment.sh, --selftest]
    timeout_seconds: 180
    exit_codes:
      pass: [0]
      fail: [1]        # a case did not produce the exit code or the text it declares
      refused: [2]
    coverage:
      from: stdout_count
      pattern: '([0-9]+) of [0-9]+ cases held'
      min_covered: 1
      spec_units:
        - id: R84
          verdict: Covered
          evidence: >-
            The renderer refuses itself, whoever calls it: `no-probe-refused` exits 3 with "there is
            no readable evals/solver-probe.py in this tree", and its `lacks` assertion holds that
            nothing of the body - not even `## What this change did to the spec` - was printed. The
            CI template's own call is covered by build-dispatch (`prepare-body-refused-without-probe`).
            Falsified 2026-10-12 with the probe test made always true: 23 of 25, both no-probe cases
            red.
        - id: R118
          verdict: Covered
          evidence: >-
            In an adopter-shaped repository the body names nothing of this one: `adopter-corpus-size-derived`
            exits 0 and its three `lacks` assertions hold that the body carries no `26-case`, no
            `publish-checklist.md` and no `checks.yml`; the corpus size is read from the probe's own
            count rows; `adopter-gate-path-from-hook` reads the checklist path from the installed
            hook; `no-constitution-named-not-spec` names a missing constitution as missing rather
            than blaming the spec; `no-store-is-partial` carries no corpus size it did not read.
            Falsified 2026-10-12 with the corpus line made to name this repository's 26-case corpus:
            22 of 25, `adopter-corpus-size-derived`, its `lacks` and `no-store-is-partial (lacks)`
            red.
    limitations:
      - The body's prose is asserted by named fragments a case must carry or lack, not as a whole; an artifact this repository has and no `lacks` assertion names would pass.

  - id: checks-stage-runner
    why: the runner is the checks stage, and a refused check whose own reason never reaches the log has to be reconstructed rather than read, which is how the v4.65.0 tag run was lost
    when:
      always: true
    severity: block
    requires: [./plugins/productizer/skills/spec/scripts/run-checks.sh, ./plugins/productizer/skills/spec/scripts/argv-classify.py, git, python3]
    version_command: [./plugins/productizer/skills/spec/scripts/run-checks.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/run-checks.sh, --selftest]
    timeout_seconds: 180
    exit_codes:
      pass: [0]
      fail: [1]        # a case or a result-file assertion did not hold
      refused: [2]
    coverage:
      from: stdout_count
      pattern: 'self-test cases driven: ([0-9]+), result-file assertions: [0-9]+\. Cases and assertions that did not hold: 0'
      min_covered: 1
      spec_units:
        - id: R119
          verdict: Partial
          reason: >-
            The tail is asserted to be printed, and to be the check's own output; its BOUNDS are not.
            No case's tool prints more than 20 lines or a line longer than 300 characters, so a
            runner printing the whole output, or the first 20 lines, would pass every case.
          evidence: >-
            `refused-says-why`: a blocking check that refuses with a reason of its own exits 3, and
            stderr carries the summary heading the check's own output under its row and the tool's
            own reason, which before B89 reached only the result file; the clean case asserts a
            passing check prints no output tail. Falsified 2026-10-12 with the tail never printed: the
            run's two `refused-says-why` stderr assertions red.
        - id: R102
          verdict: Covered
          evidence: >-
            B150. With `allow_repo_local_tools` off, eleven argv shapes that each ran a repository
            file at 6627bcf exit 2 with the payload's marker absent, and with it on each runs
            and the marker appears: `rl-w-ignore`, `rl-versioned`, `rl-absolute`,
            `rl-module-after-option`, `rl-glued-option`, `rl-sed-f`, `rl-file-as-script`,
            `rl-file-after-option`, and the shape in version_command, coverage.command and
            coverage.rules_command (`rl-version`, `rl-coverage`, `rl-rules`). `rl-data-allowed`
            keeps a placeholder and a path the work tree does not hold as data;
            `rl-no-shared-reading` refuses, exit 2, with no argv-classify.py beside the runner.
            Against the 6627bcf runner the eleven opted-out cases and `rl-no-shared-reading` go
            red. Falsified 2026-10-13: operands never gated, 6 findings (`rl-glued-option`,
            `rl-sed-f`); interpreters matched by exact name, 3 (`rl-file-as-script`); the
            options-first reading off, 3 (`rl-file-after-option`). Since 1.2 (B152, v4.72.2, the
            maintainer's strict rule) the gate recognises no interpreter and over-approximates
            R102 by three clauses, each driven off and on: the program resolves inside the work
            tree (`rl-p-relative`, `-absolute`, `-bare`); a literal argument names a path inside
            it (the `rl-a-*` cases, R142); a placeholder is handed to a program not on the
            data-only list (`rl-ph-unlisted`, `-voided`, `-config-list`, R143, R144). The B150
            cases stay as regression cases. Six clause cases are red against 4037079:
            `rl-a-glued-cluster`, `rl-a-base-only`, `rl-a-base-id`, `rl-a-absent-script`,
            `rl-ph-unlisted` and `rl-ph-voided`. Falsified per clause 2026-10-13: the program
            clause off turns the three `rl-p-*` cases red; the argument clause off, 68 findings;
            the placeholder clause off, 4 cases red. Since 1.3 (B157, v4.72.3) every argv is
            judged again just before it runs, and a value spelled as a path under the root counts
            whether or not it exists (R145, R146, now R149): the eleven `wtn-*` cases, each of which ran a
            file an earlier check wrote at b84994b, are refused off and run on. NOT asserted: a
            file a tool runs that no argument names; a file written between the judgement and the
            exec; a value inside a comma-separated list; node_modules resolution; shellcheck and
            semgrep actually run with a placeholder; a listed tool later gaining a code-running
            option.
        - id: R142
          verdict: Partial
          reason: >-
            The runner does not refuse a value inside a comma-separated list (`--x=a,b` is one
            value), or a name a tool resolves through a search path of its own such as
            node_modules; the root `.` is not counted, by ruling (B154).
          evidence: >-
            With the opt-in off each clause-2 case exits 2 with the marker absent, and runs with
            it on: `rl-a-dot-slash`, `-double-slash`, `-dotdot`, `-trailing-slash`, `-opt-equals`,
            `-glued`, `-glued-cluster`, `-base-only`, `-work-tree-only`, `-symlink`, `-base-id`
            (`docs/{base}` judged as the path it becomes), `-dotted`, `-absent-script`, and the
            same argument in version_command and the coverage commands (`rl-a-version`,
            `-coverage`, `-rules`); `rl-a-case-variant` is refused on a disk that folds case.
            `rl-not-inside-allowed` runs `.`, a word with no slash and /dev/null with the opt-in
            off. Falsified 2026-10-13 with the argument clause off: 68 findings. Since 1.3 (B157)
            a path an earlier check writes is refused too: by its spelling at load (R146, now R149) or
            judged again just before it runs (R145), the `wtn-*` cases.
        - id: R143
          verdict: Covered
          evidence: >-
            With the opt-in off, `rl-ph-unlisted` (a placeholder handed to a program not on the
            list), `rl-ph-voided` (grep with --filter), `rl-file-as-script` (`python3 {file}`) and
            `rl-file-after-option` exit 2 with the marker absent, naming clause 3 and the voiding
            option, and each runs with it on; `rl-data-allowed` runs grep with {files} with it
            off. Falsified 2026-10-13 with the placeholder clause off: those four cases red.
        - id: R144
          verdict: Partial
          reason: >-
            A case can try only the keys it names; that no other key of the configuration is read
            for the list rests on the source, where the gate's only input for it is DATA_ONLY in
            argv-classify.py.
          evidence: >-
            `rl-ph-config-list`: a config naming its own program as data-only, under two policy
            keys and on the check, is still refused by clause 3, exit 2, the marker absent; red
            against 4037079. Falsified 2026-10-13 with the gate made to read `policy.data_only`:
            the case and its two assertions red.
        - id: R145
          verdict: Partial
          reason: >-
            The judgement is made immediately before the exec, not at it: a file written in
            between, or by a process an earlier check left running, is not judged; nor is a file
            the command reads that no argument names.
          evidence: >-
            B157. With the opt-in off, a file an earlier check writes with a tool that names
            nothing, then named by a later check with no slash, is refused when the later check
            comes to run - exit 3, its row `refused`, the marker absent, the refusal saying it was
            judged again just before it ran - and with the opt-in on it runs: as the program, a
            bare name a PATH entry into the tree finds (`wtn-program`); as an argument
            (`wtn-argument`); as --opt=VALUE (`wtn-opt-equals`); in version_command, coverage.command
            and coverage.rules_command (`wtn-version`, `-coverage`, `-rules`); and in a per_file
            `{file}` invocation of shellcheck, which a PATH entry into the tree now finds
            (`wtn-per-file`). Each ran the written file at b84994b. Falsified 2026-10-14 with the
            run-time judgement off: those seven cases red; with the per-file and coverage.command
            calls alone removed, `wtn-per-file` and `wtn-coverage` red.
        - id: R149
          verdict: Covered
          evidence: >-
            B157, moved from R146, which R149 supersedes (B159, ruled 2026-10-14). With the
            opt-in off, an extension-less path no tree holds yet, which an earlier check then
            writes, is refused when the config is read, exit 2, the marker absent, and runs with the opt-in on: under a directory the tree holds (`wtn-subdir`), under one it
            does not (`wtn-new-dir`), as --opt=VALUE (`wtn-opt-slash`) and glued to a short option
            (`wtn-glued`); `rl-a-registry-id` refuses `p/default`, a registry id spelled as a path,
            which is this rule's cost. Each ran at b84994b. The root is still not counted
            (`rl-not-inside-allowed` runs `.`). Falsified 2026-10-14 with the spelling rule off:
            the four `wtn-*` cases exit 3, refused only when they came to run, and
            `rl-a-registry-id` runs - five cases red. Since 1.4 (B159, v4.72.4) the exception R149
            names is R148's: a registry id semgrep's data-only entry reads off its --config, --config=
            or -c value while no tree holds a path of that name. `rl-a-registry-id` (another
            program), `sg-path-program` (semgrep named by a path) and `sg-voided` (semgrep with
            --allow-local-builds) still refuse `p/default` by its spelling.
        - id: R148
          verdict: Covered
          evidence: >-
            B159, the maintainer's ruling of 2026-10-14. With the opt-in off, `sg-registry-runs`
            (`semgrep --config p/default`), `sg-config-equals` (`--config=p/x`) and `sg-short-c`
            (`-c r/abc`) run a semgrep stub outside the work tree, each exit 2 at a0c7f6e. The
            existence override refuses the id, exit 2 off and 0 on, when the work tree holds
            `p/default` (`sg-work-tree-holds`), when the base tree does (`sg-base-holds`), and on
            a disk that folds case when it holds `p/DEFAULT` (`sg-case-variant`, measured);
            `wtn-registry` refuses it when semgrep comes to run after an earlier check wrote
            `p/default` - exit 3, its row `refused`. No exception for semgrep named by a path
            (`sg-path-program`), with --allow-local-builds (`sg-voided`), or another program
            (`rl-a-registry-id`). Falsified 2026-10-14: the exception off, 9 findings
            (`sg-registry-runs`, `-config-equals`, `-short-c`, `wtn-registry`); the existence
            override off, 13 (`sg-work-tree-holds`, `-base-holds`, `-case-variant`,
            `wtn-registry`); the voiding ignored, 3 (`sg-voided`). NOT asserted: what the real
            semgrep reads for a registry id, measured by hand with semgrep 1.171.0 and not here.
        - id: R154
          verdict: Covered
          evidence: >-
            B163. `stderr-kept-out`: a check declaring `stderr: coverage_only` whose grep writes
            a line to standard error fails, exit 3; its coverage is read off that stream, its
            `output_tail` is exactly its standard output, and the line is in neither the result
            file nor the printed tail. `stderr-merged`, the same check with no key, keeps it.
            Falsified 2026-10-27 with standard error merged again in `run_limited`: three
            assertions red. NOT asserted: gitleaks itself, whose trace line carrying a skipped
            value was measured by hand with 8.30.1 and is not run here.
        - id: R155
          verdict: Partial
          reason: >-
            The report is hand-written from semgrep 1.171.0 output, not produced by semgrep here,
            and that the three semgrep checks keep the `json_paths` reading rests on this file.
          evidence: >-
            B164. `json-paths`: a semgrep-shaped report read through `json_paths: paths.scanned`
            less `errors.path`, `errors.spans.file` and `paths.skipped.path` counts only the file
            scanned and named in no error; the one under `errors[]` is in `listed_not_examined`
            and the check is hollow, exit 3. `json-pattern`, the old quoted-path pattern over the
            same report, passes counting all three. Falsified 2026-10-27 with the exclusion off:
            three assertions red.
        - id: R156
          verdict: Covered
          evidence: >-
            B165. `dash-path`: a changed file `--b165-dash.txt` is read by grep per file and in a
            batch, exit 0, handed over as `./--b165-dash.txt` with an ordinary path beside it
            unchanged, and coverage matches both. Falsified 2026-10-27 with the prefix removed:
            the case exit 3, grep refusing the name as an option.
    limitations:
      - It is the runner's self-test, not this repository's run. That the real suite's refusals print their tails in CI is seen in the workflow log, not asserted here.
      - A file a tool runs that no argument names - a test runner discovering tests, a config the tool finds by itself (`.semgrepignore`, `.npmrc`, `conftest.py`), a git alias - is not gated. The data-only list rests on the tools' `--help`, read 2026-10-13.
      - The run-time judgement (R145) is made just before each exec; a file written in the gap, or by a process an earlier check left running, is not judged.

  - id: ci-replay
    why: a local suite that passes on this machine's git defaults and fails on the runner's is how two pushes went red, and the replay is only worth running if it removes those defaults
    when:
      always: true
    severity: block
    requires: [python3, git]
    version_command: [python3, --version]
    mode: batch
    command: [python3, ./scripts/replay-ci.py, --selftest]
    timeout_seconds: 300
    exit_codes:
      pass: [0]
      fail: [1]        # a case did not produce the exit code it declares
      refused: [2]
    coverage:
      from: stdout_count
      pattern: '([0-9]+) of [0-9]+ cases held'
      min_covered: 1
      spec_units:
        - id: R120
          verdict: Covered
          evidence: >-
            `B124: steps see the runner's git - master, no identity, no global config - and UTC, not
            this shell's` exits 0 on a fixture workflow whose steps print the default branch, the
            identity and the global configuration they see; `B124: a fixture whose bare origin takes
            git's default branch goes red, as it did on the runner` exits 1 on the v4.67.3 fixture,
            which passed on this machine's own git. Falsified 2026-10-12 with the replay's
            init.defaultBranch pin removed: 17 of 18, the runner's-git case red. The bare-origin case
            stayed red without the pin, because with no system or global configuration this git's
            own default is already master; the pin is what makes that independent of the git.
    limitations:
      - The replay's version is python3's, because replay-ci.py takes no --version; the script itself is pinned only by the commit.
      - The runner's own identity refusal and LANG are not measured; only the default branch is quoted from a runner log.

  - id: classification-recorder
    why: a classification record is the provenance of an intake decision, and a record written into whichever repository the caller stood in is provenance for the wrong spec
    when:
      always: true
    severity: block
    requires: [./plugins/productizer/skills/spec/scripts/record-classification.sh, git, python3]
    version_command: [./plugins/productizer/skills/spec/scripts/record-classification.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/record-classification.sh, --selftest]
    timeout_seconds: 120
    exit_codes:
      pass: [0]
      fail: [1]        # a case did not produce the exit code and the sentence it declares
      refused: [2]
    coverage:
      from: stdout_count
      pattern: 'selftest: ([0-9]+) of [0-9]+ case\(s\) held'
      min_covered: 1
      spec_units:
        - id: R88
          verdict: Covered
          evidence: >-
            Every case runs the writer from a working directory OUTSIDE the root it is given, the
            layout B132 was measured in: `outside-root-default-store` writes the record in the
            root's store, `outside-root-cwd-untouched` holds that nothing lands relative to the
            working directory, `relative-store-under-root` and `relative-store-cwd-untouched` do the
            same for a relative --store, `guard-reads-root-store` holds that a record of the same
            intent in the working directory is not the root's, and `relative-root` resolves a
            relative --root once. Falsified 2026-10-12 with the destination taken relative to the
            working directory again, as 1.0 did: 8 of 15, seven cases red.
        - id: R89
          verdict: Covered
          evidence: >-
            `absolute-spec-outside-root` exits 2 - no commit of the root can be cited for a spec
            outside it - and `absolute-spec-inside-root` exits 0 recording the path repo-relative,
            so the refusal is of the outside path and not of every absolute one;
            `relative-spec-under-root` reads a relative --spec-path under the root. Falsified
            2026-10-12 with the inside-the-root test made always true: 14 of 15,
            `absolute-spec-outside-root` red - it still exited 2, for a spec that did not hash, and
            the case's sentence is what told the two refusals apart.
    limitations:
      - An unreadable spec or store, a repository with no HEAD, two intent ids that slug to one filename and an interrupted run are driven by no case.

  - id: view-builder
    why: the dashboard embeds repository text - backlog prose, commit subjects - and one row that names the capability object, or closes the data block's script element, turns prose into something the page can be read as running; and it builds links from the origin remote, a tracked path and jira.site, any of which can carry a quote or a script scheme into an attribute
    when:
      always: true
    severity: block
    requires: [./plugins/productizer/skills/spec/scripts/build-view.sh, git, python3]
    version_command: [./plugins/productizer/skills/spec/scripts/build-view.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/build-view.sh, --selftest]
    timeout_seconds: 180
    exit_codes:
      pass: [0]
      fail: []         # build-view.sh --selftest exits 2 when a case does not hold; it has no 1
      refused: [2]
    coverage:
      from: stdout_count
      pattern: 'cases driven: ([0-9]+)\. Cases that did not hold: 0'
      min_covered: 1
      spec_units:
        - id: R121
          verdict: Partial
          reason: >-
            Every sink that goes through the builder's two encoders is encoded; an href is
            deliberately not (a character reference there decodes to text the browser can run), so
            a repository path in a link carries the name verbatim. The encoding is sound only while
            embedded text reaches no sink that executes it. And the case builds one page from one
            row: a sink reached by neither encoder is not driven.
          evidence: >-
            `embedded-name` builds two pages from roots differing in one backlog row - naming the
            user config dot-file, bracket-indexing the name and closing the data block's script
            element - and asserts the row added 0 references to the capability object and 0 script
            elements, decodes to its own text in the HTML and is carried encoded in the JS literals.
            Falsified 2026-10-12 with the HTML encoder made the plain escape again: 7 of 8,
            `embedded-name` red, exit 2. check-view-readonly.sh's `prose-path` exits 0 on a backlog
            row naming the path and goes red against e540b84's builder (5 of 6).
        - id: R135
          verdict: Covered
          evidence: >-
            build-view.sh 1.1 with templates/view.html (B139), 9 cases. `config-links` builds a
            plain root and a crafted one - an origin remote, a tracked file name and a jira.site
            carrying a quote, an event attribute and a non-http scheme - and asserts the plain
            root links its quoted file name and its Jira key, the links carry 0 event attributes,
            the crafted root adds 0 non-http hrefs and carries its remote 0 times. Against
            01dbd56's lines it fails - 3 event attributes, 1 non-http href, the remote seen 7
            times - and each of the three fixes reverted alone goes red.
        - id: R157
          verdict: Covered
          evidence: >-
            build-view.sh 1.2 (B146), 9 cases. `config-links` tracks
            `q"onmouseover="alert(1).md` and `h#a?b%c d.md` under a GitHub origin and asserts
            the page links them as `.../q%22onmouseover%3D%22alert%281%29.md` and
            `.../h%23a%3Fb%25c%20d.md`, with 0 event attributes. Falsified 2026-10-28 with
            blob() writing the path as it reads: the case said DID NOT LINK for both names, 1 of
            9 not held. NOT asserted: that GitHub serves the encoded path as that file.
        - id: R190
          verdict: Partial
          reason: >-
            Driven with ntpath on this machine; no Windows machine has built a page, so a
            Windows path the two functions are not handed is not seen.
          evidence: >-
            build-view.sh 1.3 (B181), 9 cases, `graph-cases` running A1..A17. A17 hands
            vz_self_path and vz_arch_shown, with ntpath, an output file and a result on drive C:
            of a tree on drive D: and reads None and the bare file name, and the same files on D:
            as docs/view.html and out\checks-result.json. Falsified 2026-10-28: either function's
            ValueError guard removed, --arch-selftest raised "path is on mount 'C:', start on
            mount 'D:'" and --selftest held 8 of 9. A page built from one root at e5ebb1c by 1.2
            and 1.3, the output beside and inside the tree, is byte-identical once the builder's
            path is normalised.
    limitations:
      - The builder's own code reaches the capability object; only what embedded text adds is counted, against a page built without that row.
      - The page script's own escaping and scheme guard for a link it draws is not driven by a browser in the self-test; it was falsified by hand in puppeteer. A GitHub link is drawn only for a remote of the form github.com/<owner>/<name>.

# --- a blocking check proves its alarms are real before it may block --------
#
# B76, R50/R51. The maintainer chose to ENFORCE it, knowing the run goes red
# until every blocking check has its proof. The proof is a record a person can
# stand behind, in .claude/productizer/calibration.yaml: the window replayed,
# the commits that returned a verdict, the fire rate, and one ruling per fire
# naming WHO ruled. An agent's judgement is recorded as `pending` beside its
# note, and does not count. A check whose rate could not be measured carries an
# `uncalibrated` record with the instrument's own reason (R51). No threshold is
# enforced - no 10% ceiling, no 20-verdict floor; those were proposed and not
# adopted. What is enforced is that the record exists and every fire is ruled.

  - id: calibration-recorded
    why: R50/R51 - a blocking check proves its alarms are real before it may block, and the proof is a record a person ruled on, not prose
    when:
      paths:
        - ".claude/productizer/checks.yaml"
        - ".claude/productizer/calibration.yaml"
        - "plugins/productizer/skills/spec/scripts/check-calibration-recorded.sh"
        - "plugins/productizer/skills/spec/scripts/calibration-recorded.py"
    severity: block
    requires: [./plugins/productizer/skills/spec/scripts/check-calibration-recorded.sh, python3]
    version_command: [./plugins/productizer/skills/spec/scripts/check-calibration-recorded.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/check-calibration-recorded.sh]
    timeout_seconds: 120
    exit_codes:
      pass: [0]
      fail: [1]        # a blocking check with no record, a malformed record, or a fire not ruled by a person
      refused: [2]     # an input unreadable or unparseable, or bad usage
    coverage:
      spec_units:
        - id: R98
          verdict: Partial
          reason: >-
            The fire-rate third of the old R50 (B102). Every enabled blocking check - effective
            severity resolved as the runner resolves it - must carry a measured record with a
            window and a fire rate that agrees with its counts: `a blocking check with no record`,
            `a measured record with no window` and `a fire_rate that disagrees with its counts` are
            findings. NOT asserted: that the window is merged history - it reads no git, so a stale
            window or a wrong SHA passes - and no case drives an absent `fire_rate` key.
        - id: R99
          verdict: Partial
          reason: >-
            The verdict-count third of the old R50 (B102). `a measured record with no verdict
            count` and `a measured record with zero verdicts` are findings. NOT asserted: that the
            count is true of the window's commits - it reads no git - and no case drives a count
            above the window's commit total.
        - id: R100
          verdict: Partial
          reason: >-
            The ruling third of the old R50 (B102). `a pending ruling is not a ruling`, `a ruling
            by an agent is not a ruling` and `a fire with no ruling at all` are findings; a fire
            ruled false-positive by a person is upheld. NOT asserted: that `by` names a real person
            - only that it names no agent - or that a ruled commit lies inside the window.
        - id: R51
          verdict: Covered
          evidence: >-
            A check with no measurable rate is upheld only by an `uncalibrated` record carrying the
            instrument's own reason; a check with neither record is a finding. Populated from
            measurement on 2026-10-02: 39 measured, 3 uncalibrated, each reason quoted verbatim
            from measure-check-overfire.sh.
      from: stdout_paths
      pattern: '^(?:upheld|FINDING)\s+(\S+)'
      must_cover: none
      min_covered: 1
    limitations:
      - 34 of the 39 measured records have zero fires and pass with nothing to rule. Several rest on small denominators - 3, 6, 9, 12 and 14 verdicts. Zero fires over a small window proves little, and the record says so in its counts.
      - It reads no git. A record can go stale as the branch moves and this will not notice.

  # --- a review finding nobody answered, a plan nobody can undo, an approver
  # --- nobody named (B166 to B169, B172) ---------------------------------------
  #
  # Three new tools, each with a self-test that reaches 0, 1 and 2. The
  # self-tests are what this repository runs: it keeps no review records and no
  # docs/sdlc plans, so two of the adopter-facing declarations below them are
  # declared here as the template ships them (B51) and read not_triggered,
  # never passed. approval-rules runs on this tree since v4.75.0 (B178).

  - id: review-record-checker
    why: a review finding with no location, a round with no count, a bug re-found every round and an Important finding nobody answered all read as a review until something reads the record
    when:
      always: true
    severity: block
    requires: [./plugins/productizer/skills/spec/scripts/check-review-record.py, python3]
    version_command: [./plugins/productizer/skills/spec/scripts/check-review-record.py, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/check-review-record.py, --selftest]
    timeout_seconds: 60
    exit_codes:
      pass: [0]
      fail: [1]        # a case did not produce the exit code or the text it declares
      refused: [2]
    coverage:
      from: stdout_count
      pattern: '([0-9]+) of 39 cases held'
      min_covered: 39
      spec_units:
        - id: R163
          verdict: Covered
          evidence: >-
            check-review-record.py 1.0 (B166, B167), 39 cases. `no-line`, `absolute-location` and
            `parent-location` exit 1 with FINDING finding-shape; `range-location` passes
            path:9-14; `bad-severity` and `no-class` exit 1; `template-placeholders-refused` fails
            the shipped templates/review-record.md. Falsified 2026-10-28: location cut to the
            regex alone 37 of 39, severity rule off 38 of 39, class rule off 38 of 39.
        - id: R164
          verdict: Covered
          evidence: >-
            `count-wrong`, `no-issues-with-findings`, `count-zero-not-no-issues` and `count-blank`
            exit 1 with FINDING count. Falsified 2026-10-28: `0` accepted for none 38 of 39; a
            non-zero count not compared 37 of 39.
        - id: R165
          verdict: Covered
          evidence: >-
            REVIEW.md's `## Ignored paths` read as fnmatch globs: `ignored-glob`, `ignored-dir`
            and `ignored-suffix` exit 1; `no-ignored-section` passes saying none listed;
            `absent-policy` exits 2. Falsified 2026-10-28 with the glob loop emptied: 36 of 39.
        - id: R166
          verdict: Covered
          evidence: >-
            `fourth-round-no-rethink` and `fourth-round-placeholder-rethink` exit 1;
            `three-rounds-no-rethink` and `fourth-round-rethink` pass. Falsified 2026-10-28 with
            the cap removed: 37 of 39.
        - id: R167
          verdict: Covered
          evidence: >-
            `round-base-gap` and `round-base-other-commit` exit 1 with FINDING round-base;
            `round-base-long-head` passes an abbreviated id against a longer one. Falsified
            2026-10-28 with the comparison off: 37 of 39.
        - id: R168
          verdict: Covered
          evidence: >-
            `re-reported` - round 2 repeating round 1's location and class, differing in case -
            exits 1; `same-place-other-class` passes. Falsified 2026-10-28 with the rule off: 38
            of 39.
        - id: R169
          verdict: Covered
          evidence: >-
            `important-open` exits 1 with FINDING important-open; `two-records-one-bad` fails the
            run. Through run-checks.sh in a scratch repository with the template's review-record
            declaration, 2026-10-28: FAIL exit 1, and with a waiver naming review-record, FAIL ·
            WAIVED BY the named authority. Falsified 2026-10-28 with the rule off: 37 of 39.
        - id: R170
          verdict: Covered
          evidence: >-
            `closed-without-reason` and `unknown-status` exit 1 with FINDING answered;
            `answered-tally` prints the five counts. Falsified 2026-10-28 with the reason rule
            off: 38 of 39.
    limitations:
      - It reads the record's text. Whether a finding is true, whether a fix fixed it, whether a reason is a good one and whether the review happened are not measured; a review nobody recorded is invisible.
      - Ignored paths are fnmatch globs, where `*` crosses `/`, not gitignore patterns. A cell holding a literal `|` splits its row.
      - The same bug at a moved line is not a re-report to it.

  - id: plan-record-checker
    why: a change whose plan cannot say how it was shown to work or how to undo it has its rollback invented during the incident
    when:
      always: true
    severity: block
    requires: [./plugins/productizer/skills/spec/scripts/check-plan-record.py, python3]
    version_command: [./plugins/productizer/skills/spec/scripts/check-plan-record.py, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/check-plan-record.py, --selftest]
    timeout_seconds: 60
    exit_codes:
      pass: [0]
      fail: [1]        # a case did not produce the exit code or the text it declares
      refused: [2]
    coverage:
      from: stdout_count
      pattern: '([0-9]+) of 17 cases held'
      min_covered: 17
      spec_units:
        - id: R171
          verdict: Covered
          evidence: >-
            check-plan-record.py 1.0 (B168), 17 cases. `plan-no-revert`,
            `plan-placeholder-revert`, `plan-empty-revert`, `plan-no-proof` and
            `plan-proof-runs-into-revert` exit 1; `plan-template-is-placeholder` fails the shipped
            plan.md. Falsified 2026-10-28: revert rule off 10 of 17, tested rule off 13 of 17,
            placeholder accepted 11 of 17.
        - id: R172
          verdict: Partial
          reason: >-
            A pull request body lives on GitHub and nothing in the lifecycle fetches one: this reads
            a body saved to a file, and the template's plan-record check reads only the plan.
          evidence: >-
            Under --kind pr-body, `body-no-tested`, `body-placeholder-revert` and `plan-as-body`
            exit 1, `body-good` passes, and `body-template-is-placeholder` fails the shipped
            templates/pull-request.md.
    limitations:
      - It reads text. Whether the tests named were run, and whether the revert path works, are not measured.

  - id: approval-rules-checker
    why: a CODEOWNERS that leaves the spec, the checks or the workflows without a human owner makes an agent's change to them approvable by anyone with write access
    when:
      always: true
    severity: block
    requires: [./plugins/productizer/skills/spec/scripts/check-approval-rules.py, python3, git]
    version_command: [./plugins/productizer/skills/spec/scripts/check-approval-rules.py, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/check-approval-rules.py, --selftest]
    timeout_seconds: 120
    exit_codes:
      pass: [0]
      fail: [1]        # a case did not produce the exit code or the text it declares
      refused: [2]
    coverage:
      from: stdout_count
      pattern: '([0-9]+) of 21 cases held'
      min_covered: 21
      spec_units:
        - id: R173
          verdict: Partial
          reason: >-
            The branch protection settings that make a CODEOWNERS bind are on GitHub and NOT
            MEASURED; on this repository "Require review from Code Owners" is the maintainer's step
            and is not known to be on. A bot is recognised only by a `[bot]` suffix: a plain user
            name counts as a person and a team as people.
          evidence: >-
            check-approval-rules.py 1.0 (B172), 21 cases in temporary repositories. `no-codeowners`,
            `unowned-later-pattern`, `bot-owner`, `later-glob-takes-file`, `only-one-dir-owned`,
            `added-file-probe` and `case-sensitive` exit 1; `shipped-template-holds` passes the
            shipped templates/CODEOWNERS; `single-star-stays-in-dir` follows GitHub's `docs/*`
            example. Falsified 2026-10-28: first match instead of last 17 of 21, bots counted
            human 19 of 21, the added-file probe off 20 of 21, a `*` crossing directories 20 of
            21, the no-CODEOWNERS finding off 20 of 21. Since v4.75.0 (B178) this repository
            commits .github/CODEOWNERS owning both directories to @gitayg and its own approval-rules
            check is enabled: on this tree it exits 0, 80 paths probed; with the workflows line
            removed it exits 1 naming the workflow files.
    limitations:
      - It reads CODEOWNERS only. Code owner review, stale-approval dismissal, most-recent-push approval and whether GitHub Actions may approve are settings, not files.

  # The three adopter-facing declarations, as templates/checks.yaml ships them.
  # review-record and plan-record read docs/sdlc/**, which this repository does
  # not have, so they read not_triggered and start running the day one lands.
  - id: review-record
    why: an Important review finding nobody answered merges exactly like one that was fixed, and a reviewer re-finding old bugs every round reads as diligence
    when:
      paths:
        - "docs/sdlc/**/review.md"
    severity: block
    requires: [./plugins/productizer/skills/spec/scripts/check-review-record.py]
    version_command: [./plugins/productizer/skills/spec/scripts/check-review-record.py, --version]
    mode: per_file
    command: [./plugins/productizer/skills/spec/scripts/check-review-record.py, --policy, REVIEW.md, "{file}"]
    timeout_seconds: 60
    exit_codes:
      pass: [0]
      fail: [1]
      refused: [2]     # this repository has no REVIEW.md, so a record landing here refuses until one does
    coverage:
      from: per_file_exit
      examined_when_exit_in: [0, 1]
      must_cover: all_triggering
      min_covered: 1
    limitations:
      - Not triggered here today. It covers nothing until a review record lands under docs/sdlc/.

  - id: plan-record
    why: a change nobody can say how to revert is a change whose rollback is invented during the incident
    when:
      paths:
        - "docs/sdlc/**/plan.md"
    severity: block
    requires: [./plugins/productizer/skills/spec/scripts/check-plan-record.py]
    version_command: [./plugins/productizer/skills/spec/scripts/check-plan-record.py, --version]
    mode: per_file
    command: [./plugins/productizer/skills/spec/scripts/check-plan-record.py, "{file}"]
    timeout_seconds: 60
    exit_codes:
      pass: [0]
      fail: [1]
      refused: [2]
    coverage:
      from: per_file_exit
      examined_when_exit_in: [0, 1]
      must_cover: all_triggering
      min_covered: 1
    limitations:
      - Not triggered here today. It covers nothing until a plan lands under docs/sdlc/.

  # ENABLED since v4.75.0 (B178), by the maintainer's ruling of 2026-10-28:
  # this repository commits .github/CODEOWNERS, built from templates/CODEOWNERS,
  # making @gitayg the owner of .claude/productizer/ and .github/workflows/, so
  # the check must pass here. Measured 2026-10-28 on this tree:
  # check-approval-rules.py exits 0, 2 rules, 80 paths probed. No GitHub
  # setting was changed: "Require review from Code Owners" on main is the
  # maintainer's step, and until it is on, the file names an owner nobody is
  # required to hear from - which this check cannot see.
  - id: approval-rules
    why: a change an agent authored to the files that judge it is approvable by anyone with write access unless CODEOWNERS names a person for them
    when:
      paths:
        - ".github/CODEOWNERS"
        - "CODEOWNERS"
        - "docs/CODEOWNERS"
        - ".claude/productizer/**"
        - ".github/workflows/**"
    severity: block
    requires: [./plugins/productizer/skills/spec/scripts/check-approval-rules.py, git]
    version_command: [./plugins/productizer/skills/spec/scripts/check-approval-rules.py, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/check-approval-rules.py]
    timeout_seconds: 60
    exit_codes:
      pass: [0]
      fail: [1]
      refused: [2]
    coverage:
      from: stdout_count
      pattern: 'probed ([0-9]+) path\(s\)'
      min_covered: 2
    limitations:
      - The branch protection settings are NOT MEASURED - they are on GitHub, not in the tree. Until the maintainer turns on code owner review, the owner it names is not required to approve.
      - A plain user name counts as a person whether a person or a machine holds it, and a team counts as people whatever its members are.

  # --- a revert that taught the reviewer nothing, and two bands nobody kept
  # --- (B170, B171) ------------------------------------------------------------
  #
  # Four new tools, each with a self-test. score-reviewer-case.py and
  # check-revert-cases.py reach 0, 1 and 2; the two band detection commands
  # reach 0, 2 and 3, 3 being "not measured". The band commands are run by a
  # scheduled task a person installs, never by this suite, so their self-tests
  # are what holds them here.

  - id: reviewer-case-checker
    why: a reviewer scored by a model on whether it caught a bug is noise measuring noise, and a case with no location cannot be scored at all
    when:
      always: true
    severity: block
    requires: [./plugins/productizer/skills/spec/scripts/score-reviewer-case.py, python3]
    version_command: [./plugins/productizer/skills/spec/scripts/score-reviewer-case.py, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/score-reviewer-case.py, --selftest]
    timeout_seconds: 60
    exit_codes:
      pass: [0]
      fail: [1]        # a case did not produce the exit code or the text it declares
      refused: [2]
    coverage:
      from: stdout_count
      pattern: '([0-9]+) of 25 cases held'
      min_covered: 25
      spec_units:
        - id: R178
          verdict: Covered
          evidence: >-
            score-reviewer-case.py 1.0 (B170), 25 cases. `caught-in-range`, `caught-exact-line`
            and `caught-long-change` exit 0; `missed-line-outside`, `missed-other-file`,
            `missed-nit-at-bug`, `missed-later-round`, `missed-other-change`, `missed-other-base`,
            `missed-malformed-record` and `missed-no-rounds` exit 1 naming what did not hold.
            Falsified 2026-10-28: the line overlap off, the severity rule off, the change rule
            off, the base rule off and round 1 widened to every round, each 24 of 25; the shape
            rule off, 23 of 25.
        - id: R179
          verdict: Covered
          evidence: >-
            `case-no-change`, `case-no-bug-line`, `case-bug-outside-root`, `case-no-fix`,
            `case-key-twice` and `case-keys-after-rule-ignored` exit 2; the shipped
            templates/reviewer-case.md is refused for its placeholders. Falsified 2026-10-28 with
            the fix rule off: 24 of 25.
        - id: R181
          verdict: Partial
          reason: >-
            Read off the template's text: templates/agent-evals.yml lists REVIEW.md under its
            pull_request paths and runs score-reviewer-case.py over evals/reviewer/*.md. The
            workflow has never run on a GitHub runner, and whether `claude -p --agent
            sdlc-reviewer` prints a record the scorer can read is not measured.
          evidence: >-
            `agent-evals-rescores-on-review-md`. Falsified 2026-10-28 with REVIEW.md dropped from
            the template's paths: 24 of 25.
    limitations:
      - It scores a record's text against a case's. Whether a case's bug location is the real one, and whether the reviewer the workflow runs is the one installed, are not measured.

  - id: revert-cases-checker
    why: a revert is the one confirmed miss a reviewer ever gets, and a check that lets one land without a case teaches the reviewer nothing
    when:
      always: true
    severity: block
    requires: [./plugins/productizer/skills/spec/scripts/check-revert-cases.py, python3, git]
    version_command: [./plugins/productizer/skills/spec/scripts/check-revert-cases.py, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/check-revert-cases.py, --selftest]
    timeout_seconds: 120
    exit_codes:
      pass: [0]
      fail: [1]        # a case did not produce the exit code or the text it declares
      refused: [2]
    coverage:
      from: stdout_count
      pattern: '([0-9]+) of 13 cases held'
      min_covered: 13
      spec_units:
        - id: R180
          verdict: Covered
          evidence: >-
            check-revert-cases.py 1.0 (B170), 13 cases in temporary repositories made with `git
            revert`. `revert-without-case` and `case-of-another-change` exit 1 with FINDING
            no-case; `revert-with-case` and `case-short-id` pass, the case read from the working
            tree; `malformed-case` exits 1 with FINDING case-shape; `indented-line-is-a-revert`
            reads a squash body's indented line; `mid-line-mention-is-not` counts one revert over
            two commits. Falsified 2026-10-28: the no-case finding off, 9 of 13; the case-shape
            finding off, 12 of 13; the line anchored with no indent, 12 of 13; the line read
            anywhere, 12 of 13.
    limitations:
      - A revert is a commit message holding a `This reverts commit <id>` line. A revert written by hand without it, and an incident, are not seen.

  - id: band-revert-rate-checker
    why: a band computed by eye, or one that reads a quiet month as within band, says nothing about whether review effort was cut while the revert rate held
    when:
      always: true
    severity: block
    requires: [./plugins/productizer/skills/spec/scripts/band-revert-rate.py, python3, git]
    version_command: [./plugins/productizer/skills/spec/scripts/band-revert-rate.py, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/band-revert-rate.py, --selftest]
    timeout_seconds: 120
    exit_codes:
      pass: [0]
      fail: [1]        # a case did not produce the exit code or the text it declares
      refused: [2]
    coverage:
      from: stdout_count
      pattern: '([0-9]+) of 16 cases held'
      min_covered: 16
      spec_units:
        - id: R182
          verdict: Covered
          evidence: >-
            band-revert-rate.py 1.0 (B171), 16 cases in temporary repositories dated by
            GIT_COMMITTER_DATE, one-day windows. `value-printed` reads 0.3333 for 1 revert over 3
            changes; `within-band`, `one-sigma`, `two-sigma` and `three-sigma` print each tier;
            `merged-branch-revert` counts a revert inside a merged branch once over its one merge.
            Falsified 2026-10-28 with every commit counted as a change: 15 of 16.
        - id: R184
          verdict: Covered
          evidence: >-
            `no-change-in-window`, `too-few-earlier` and `no-spread-rise` exit 3 with NOT
            MEASURED; `no-spread-level` and `drop-is-within` read within. Falsified 2026-10-28:
            the baseline minimum lowered to 2, a flat baseline's rise accepted, and the distance
            made two-sided, each 15 of 16.
        - id: R185
          verdict: Partial
          reason: >-
            Read off the templates: templates/config.json binds each added band under
            `band_bindings` with a config and a detection_command no other band shares, and
            templates/scheduled-band-metric.md reads `band_bindings.<METRIC>` against a frozen
            `<DETECTION COMMAND>`. No scheduled task was installed or run.
          evidence: >-
            `single-metric-install-unchanged`, the binding half.
        - id: R186
          verdict: Covered
          evidence: >-
            `single-metric-install-unchanged` holds the sha256 of templates/bands.yaml and
            templates/scheduled-bands.md and the `bands` binding of templates/config.json as
            v4.74.1 shipped them. Falsified 2026-10-28: one sentence of scheduled-bands.md
            changed, 15 of 16; the `bands` detection_command changed, 15 of 16.
    limitations:
      - The Western Electric run rules are not evaluated - one point, its distance above the mean. A revert written without the line is not counted.

  - id: band-review-rounds-checker
    why: review rounds per change read from anything but the review records would be a second reading of the record, and a quiet month read as within band hides the drop in care
    when:
      always: true
    severity: block
    requires: [./plugins/productizer/skills/spec/scripts/band-review-rounds.py, python3, git]
    version_command: [./plugins/productizer/skills/spec/scripts/band-review-rounds.py, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/band-review-rounds.py, --selftest]
    timeout_seconds: 120
    exit_codes:
      pass: [0]
      fail: [1]        # a case did not produce the exit code or the text it declares
      refused: [2]
    coverage:
      from: stdout_count
      pattern: '([0-9]+) of 14 cases held'
      min_covered: 14
      spec_units:
        - id: R183
          verdict: Covered
          evidence: >-
            band-review-rounds.py 1.0 (B171), 14 cases in temporary repositories. Records under
            docs/sdlc/ read by check-review-record.py's own parser: `value-printed` reads 1.6667
            for 2, 2 and 1 rounds; `dated-by-last-change` moves a rewritten record into the window
            of its last commit; `record-without-rounds` names a record with no Rounds row and does
            not count it; `other-path-ignored` reads no record outside the glob. Falsified
            2026-10-28: dated by the first commit, 13 of 14; a record with no rounds counted,
            13 of 14.
        - id: R184
          verdict: Covered
          evidence: >-
            `no-record-in-window`, `too-few-earlier` and `no-spread-rise` exit 3. Falsified
            2026-10-28: the baseline minimum lowered to 2, 13 of 14; a flat baseline's rise
            accepted, 13 of 14.
    limitations:
      - A change with no review record is not seen, and a record is believed to hold every round the change had.

  # The adopter-facing declaration, as templates/checks.yaml ships it. This
  # repository has made no revert (`git log --grep "This reverts commit"` reads
  # nothing over 158 commits), so it keeps no evals/reviewer/ and the check
  # passes over every range until the first revert lands.
  - id: revert-cases
    why: a revert is the one confirmed miss a reviewer ever gets, and without a case it teaches the reviewer nothing
    when:
      always: true
    severity: block
    requires: [./plugins/productizer/skills/spec/scripts/check-revert-cases.py, git]
    version_command: [./plugins/productizer/skills/spec/scripts/check-revert-cases.py, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/check-revert-cases.py, --base, "{base}"]
    timeout_seconds: 60
    exit_codes:
      pass: [0]
      fail: [1]        # a revert in the range with no case naming its change, or a case missing its change, bug or fix
      refused: [2]     # not a git work tree, or a base git cannot resolve
    coverage:
      from: stdout_count
      pattern: 'examined ([0-9]+) commit\(s\)'
      min_covered: 1
    limitations:
      - A revert is a commit message holding a `This reverts commit <id>` line. A revert written by hand without it, and an incident, are not seen.
