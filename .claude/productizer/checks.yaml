# Stage 5 for this repo. Not the shipped template: these are the checks that
# actually matter for a plugin published publicly and installed by other people.
version: 1

policy:
  empty_run: refuse
  # This repo's own checks live in this repo, and this repo is the one being
  # checked. Saying so explicitly is the point: a cloned repo that has NOT been
  # trusted cannot run its own tooling.
  allow_repo_local_tools: true
  output: .claude/productizer/checks-result.json
  # ENFORCED. Every active requirement must be named by some check, and the run
  # refuses if one is not.
  #
  # `require` no longer means "everything Covered", and that change is what made
  # it reachable. Five obligations here cannot be fully proven from inside a
  # repository: one needs a model in the check path, which the `models.checks`
  # block forbids outright; one is a fact about the publishing service; one
  # needs a forbidden publish actually attempted; one covers a classification
  # that merges nothing and so writes nothing; one names a situation this
  # repository has never been in. Demanding Covered for those demanded a proof
  # that does not exist, and a gate that cannot be satisfied is one somebody
  # switches off.
  #
  # The bar is now: NOTHING MAY BE SILENTLY UNPROVEN. `Missing` refuses. A
  # `Partial` is accepted only because the loader refuses to load one without a
  # `reason`, so every Partial has already said which part is unasserted, in the
  # output, where a reader can disagree with it. That guards the failure this
  # repository keeps having - a check claiming more than it proves, or vanishing
  # - because both land as Missing or as a claim voided by a check that did not
  # run, and both still refuse.
  spec_coverage: require

defaults:
  timeout_seconds: 180
  mode: batch
  severity: block

checks:

  # --- repo hygiene --------------------------------------------------------
  - id: hygiene
    why: this repo is public and installed by strangers; an employer name, a private repo name or a credential in it cannot be unpublished
    when:
      always: true
    severity: block
    requires: [./scripts/check-hygiene.sh]
    version_command: [./scripts/check-hygiene.sh, --version]
    mode: batch
    command: [./scripts/check-hygiene.sh, "{files}"]
    exit_codes:
      pass: [0]
      fail: [1]
      refused: [2]
    coverage:
      from: stdout_paths
      pattern: '^(\S+)$'
      must_cover: all_triggering
      min_covered: 1

  # --- shell linting -------------------------------------------------------
    limitations:
      - It sees only the files handed to it. Git history, commit messages and release bodies are outside its reach, and every one of those has leaked here and had to be swept by hand.
      - The private half of the deny list is loaded at runtime and is absent in CI and in a fresh clone, so those runs check generic rules only. The run says so rather than staying quiet.

  - id: shell-lint
    why: these scripts run on other people's machines, and a shellcheck warning there is their problem, not ours. Unquoted expansions are shell-quoting's job - this check's severity never raises them
    when:
      paths: ["**/*.sh"]
    severity: block
    requires: [shellcheck]
    version_command: [shellcheck, --version]
    mode: per_file
    command: [shellcheck, --severity=warning, --format=gcc, "{file}"]
    timeout_seconds: 600
    exit_codes:
      pass: [0]
      fail: [1]
      refused: [2, 3, 4]
    coverage:
      from: per_file_exit
      examined_when_exit_in: [0, 1]
      must_cover: all_triggering
      min_covered: 1

  # --- the solver's own corpus --------------------------------------------
    limitations:
      - Runs at --severity=warning, which does NOT include SC2086, unquoted expansions. That was found when a deliberate SC2086 failed to turn the gate red, and measured again as a recall miss (B85). `shell-quoting` now raises exactly that code.

  - id: solver-corpus
    why: precision must stay at 1.00 - a contradiction checker that halts on a non-conflict gets switched off, and then nothing is checked
    # Was `paths: ["**/contradiction-check.py"]`, so it only ran when the
    # solver's own source changed and reported `not_triggered` on every other
    # commit. A check with no evidence is not a passing check, and this is the
    # one whose `why` says precision must stay at 1.00 - the property most
    # worth knowing on every run, not only when someone edits the file that
    # provides it. It is a 0.3s stdlib self-test with no external dependency,
    # so `always` costs nothing and buys evidence on every commit.
    when:
      always: true
    severity: block
    requires: [python3]
    version_command: [python3, --version]
    mode: batch
    command: [python3, plugins/productizer/skills/spec/scripts/contradiction-check.py, --selftest]
    exit_codes:
      pass: [0]
      fail: [1]
      refused: [2]
    coverage:
      from: stdout_count
      pattern: 'true positives[^0-9]*([0-9]+)'
      min_covered: 1
      spec_units:
        - id: R101
          verdict: Partial
          reason: >-
            R101 supersedes R33 (B102), which this check claimed Covered. The solver halts on a
            real contradiction and stays quiet on a non-conflict, at precision 1.00 over the
            committed corpus, run on every commit - which asserts the DETECTION that starts the
            stop, and nothing about how long it lasts: not that work on the intent waits, and not
            that a person ruled. A missed contradiction does not fail it; recall is reported, not
            gated. `pending-ruling-scope` holds the spec half of the wait.

  # --- and the probe that is NOT a check here -------------------------------
  #
  # `evals/solver-probe.py` measures the same solver over the 26-case corpus,
  # the harder number the `solver-corpus` limitations above already quote. It
  # is gated, but NOT from this file, and the omission is deliberate rather
  # than an oversight - so it is written down here, where a reader looking for
  # it will look.
  #
  # It is a step in `.github/workflows/checks.yml`, "Solver - 26-case probe",
  # against a baseline measured 2026-09-05. Two reasons:
  #
  #   1. Every check in this file is selected by `when` against the files a
  #      change touched. The probe reads no file from the change; it
  #      re-measures a fixed corpus. `when.always: true` would run it, as it
  #      runs `solver-corpus`, but its `files_in_scope` would be a fiction.
  #
  #   2. Decisive: `coverage.min_covered` is a FLOOR and this vocabulary has no
  #      ceiling. Half the probe's gate is a ceiling - false positives at most
  #      0, silent misses at most 1 - and the false-positive ceiling is exactly
  #      what `solver-corpus`'s own `why` above says must hold. Written as a
  #      check here, that half would be absent and the gate would stay green
  #      through the one regression it exists to catch.
  #
  # If a ceiling ever lands in the coverage vocabulary, this decision is worth
  # revisiting, and the workflow step should move here.

  # --- suppressed stderr ---------------------------------------------------
  #
  # Discarding stderr makes an ERROR and a genuine NO-MATCH identical, and once
  # they are identical the run is green either way. In one session that cost
  # three real defects in this repo: a count that was wrong, an absence that
  # was not an absence, and a check that examined nothing and passed.
  #
  # ADVISE, NOT BLOCK, AND THIS IS DELIBERATE. The first run found 66
  # occurrences across 8 of the 28 shell scripts here - not the 13 anyone
  # expected. Blocking on day one would have been an argument about the rule
  # instead of a list of the debt, and a rule people argue with gets deleted.
  # Advisory reports every one of them into the review brief and blocks
  # nothing.
  #
  # PROMOTE IT TO `block` when the advisory count reaches zero - that is,
  # when every remaining occurrence has either been removed or carries a
  # written reason. The count is printed on every run, so there is no
  # judgement call about when that day arrives. An advisory check nobody ever
  # promotes is a check nobody reads.
  #
  # THE FOUR EXEMPTIONS BELOW ARE THE WHOLE POINT OF THE MECHANISM. Each names
  # a file, quotes the exact redirection, and states why in a sentence a
  # reviewer can disagree with in this diff. An entry that quotes no
  # redirection, or gives no reason, is REFUSED - not honoured, and not
  # downgraded to a finding. A check that can be silenced without saying why is
  # the thing this check exists to prevent.
  #
  # Code you can edit does not need an entry here: put `# stderr-ok: <reason>`
  # on the offending line instead. Same rule, same minimum, next to the code.
    limitations:
      - It is a second opinion on numeric bounds and mutually exclusive responses. Its CONSISTENT means not decided, never cleared.
      - Recall tracks the corpus more than the checker, so both figures are carried together and dated. Measured 2026-09-03, after the disposition lexicon landed - 0.82 on the corpus written first and 0.38 on the harder 26-case one, against 0.73 and 0.12 before it. Precision is 1.00 on the first and 0.83 on the harder one, where a single false positive stands - N09, an extend that complies with a principle.

  - id: stderr-suppression
    why: an error and a genuine no-match look identical once stderr is discarded, and this repo has already shipped three defects that hid in exactly that gap
    # Widened in v4.68.0 (B97) from shell scripts to every workflow, skill,
    # command and Markdown or YAML file: the scanner reads a YAML file's `run:`
    # values and a Markdown file's shell-fenced and `!` blocks as shell, and
    # nothing else in them. Measured before widening: 29 findings over every
    # tracked .md/.yml/.yaml file, 7 once only those values were read, 5 after
    # the fixes, 0 with the fixture's allow entry below.
    when:
      paths:
        - "**/*.sh"
        - "**/*.bash"
        - "**/*.yml"
        - "**/*.yaml"
        - "**/*.md"
    severity: block
    requires: [./plugins/productizer/skills/spec/scripts/check-stderr.sh]
    version_command: [./plugins/productizer/skills/spec/scripts/check-stderr.sh, --version]
    mode: per_file
    command:
      - ./plugins/productizer/skills/spec/scripts/check-stderr.sh
      - --allow
      - 'plugins/productizer/skills/spec/scripts/build-view.sh::2>/dev/null || :::the view builder runs against a repo that may have no history, no tags and no remote; every one of these lines already turns a failure into no data with || : , and git writes a fatal to stderr for the empty case, which is expected and not an error'
      - --allow
      - 'plugins/productizer/skills/spec/scripts/build-view.sh::--git-dir >/dev/null 2>&1::an existence probe for a git work tree, the same shape as command -v; the answer is the exit status and the only thing on stderr is git saying this is not a repository'
      - --allow
      - 'plugins/productizer/skills/spec/scripts/run-checks.sh::$pid" 2>/dev/null::kill and wait address a pid this script started and owns; the only stderr is ESRCH from a child that already exited, which is the ordinary case this loop is written around'
      - --allow
      - 'plugins/productizer/skills/spec/scripts/run-checks.sh::git merge-base "$BASE" HEAD 2>/dev/null::the very next line refuses the whole run and names the base that could not be resolved, so the failure is reported rather than lost - the cost is that git own wording goes with it'
      - --allow
      - 'plugins/productizer/skills/spec/fixtures/ci-template/devnull.yml::2>/dev/null::a fixture that must contain the suppression check-ci-template.py exists to refuse'
      - "{file}"
    timeout_seconds: 60
    exit_codes:
      pass: [0]
      fail: [1]        # suppressed stderr found
      refused: [2]     # a file it could not read, or an exemption with no reason
    coverage:
      from: per_file_exit
      # 0 = clean, 1 = findings. Both mean the file was read end to end. A 2 is
      # a file it bounced off or an exemption it would not honour, and neither
      # is a file it checked.
      examined_when_exit_in: [0, 1]
      must_cover: all_triggering
      min_covered: 1
      spec_units:
        - id: R117
          verdict: Partial
          reason: >-
            The obligation is the scanner's, and this check runs the scanner over the change's
            files; that it reads a YAML file's `run:` values and nothing else is asserted by
            check-stderr.sh's own self-test, which the workflow runs, not by this check's verdict
            on this repository. Not asserted: shell in a YAML key other than `run:` (a `script:`
            handed to an action, a composite action input), and a flow or quoted multi-line
            `run:` value beyond one line.
          evidence: >-
            `yaml-run-block` (a `run: |` block, line 9) and `yaml-run-inline` (`run: cmd`, line 4)
            exit 1 and name the line; `yaml-not-run` exits 0 on a workflow carrying the same
            redirection in a step name and an env value, and says it read 1 line of shell.
            Falsified 2026-10-12 on a copy that read every YAML line as shell: `yaml-not-run`
            went 0 -> 1, 36 of 37.

  # --- one living spec per product ----------------------------------------
  #
  # R1 says the lifecycle shall hold exactly one living spec per product. Until
  # this check existed nothing asserted it: `product.spec_home` was declared in
  # config.json and never read back, so a second `.claude/productizer/spec.md`
  # in a second repo would have gone unnoticed - two allocators both handing
  # out R42, and the divergence found later by whoever trusted the wrong one.
  #
  # `always`, because the failure it catches does not arrive in a diff. A repo
  # is added to the product, or someone scaffolds a spec in the wrong place,
  # and no file in THIS repo changes.
  #
  # UNREACHABLE IS NOT ABSENT. A repo the check cannot open exits 2 - refused -
  # and is never counted as "no spec there". Counting it as absent is how a
  # two-spec product reports as a one-spec product.
    limitations:
      - Fourteen suppressions remain in shell, exempted by allowlist entries with written reasons, and one in a YAML fixture that exists to carry one (`fixtures/ci-template/devnull.yml`). Three rest on a measured SIGPIPE from a deliberate cap, and they exempt the whole line - a genuine error on it would still be hidden.
      - In a YAML file only `run:` values are read, and in Markdown only shell-fenced and `!` blocks. Shell handed to an action under another key, a `!` block that does not open its line, an unfenced or indented code block, and a YAML flow or quoted multi-line `run:` value are not.

  - id: spec-home
    why: two repos both holding a living spec means two allocators both handing out R42, and nothing in this lifecycle noticed until now
    when:
      always: true
    severity: block
    requires: [./plugins/productizer/skills/spec/scripts/check-spec-home.sh]
    version_command: [./plugins/productizer/skills/spec/scripts/check-spec-home.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/check-spec-home.sh, --config, .claude/productizer/config.json]
    timeout_seconds: 60
    exit_codes:
      pass: [0]
      fail: [1]        # too many specs, none, or not where the config says
      refused: [2]     # a repo out of reach, or a config that cannot be read
    coverage:
      spec_units:
        - id: R1
          verdict: Covered
          evidence: >-
            Counts living specs across `product.repos` and refuses when a repo is unreachable, on
            the ground that an unreachable repo makes the number UNKNOWN rather than one.
      # The check's own count of repos it actually reached. A run that reached
      # none prints 0 here and fails coverage as well as exiting 2 - a spec
      # count nobody could compute is not a spec count of zero.
      from: stdout_count
      pattern: 'repos reachable:\s*([0-9]+)'
      min_covered: 1

  # --- a halt that nobody was asked to answer --------------------------------
  #
  # R23 says the lifecycle shall stop and ask which wins. The acceptance row for
  # it asserted the STOP and not the ASK, and the two are not the same event:
  # the halt worked, no ruling was ever drafted, and the work stopped and stayed
  # stopped with nobody holding a question. This check observes the ask.
  #
  # It asserts the obligation, not the implementation. The cautionary case in
  # this repo is R18, whose row says `argv[0] validation` while the principle it
  # enforces requires the whole argv - a row that describes what the code does
  # can never fail.
  #
  # `always`, because the failure does not arrive in a diff. A contradiction is
  # raised in conversation and abandoned; no file changes, which is precisely
  # the problem.
  #
  # UNREADABLE IS NOT ABSENT. A rulings directory nobody can open exits 2, never
  # 0 - a directory nobody can open is exactly where an unasked question hides.
    limitations:
      - A repo it cannot open is refused, never counted as having no spec. But a product whose repos are not all declared is invisible to it entirely.

  - id: ruling-requested
    why: a contradiction that halted without a drafted ruling leaves nobody holding the question, and the spec shows nothing waiting
    when:
      always: true
    severity: block
    requires: [./plugins/productizer/skills/spec/scripts/check-ruling-requested.sh]
    version_command: [./plugins/productizer/skills/spec/scripts/check-ruling-requested.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/check-ruling-requested.sh]
    timeout_seconds: 60
    exit_codes:
      pass: [0]
      fail: [1]        # a concern with no ruling, a ruling nothing cites, or a ruling still wearing the template
      refused: [2]     # the rulings directory or one of its files could not be read
    coverage:
      spec_units:
        - id: R34
          verdict: Partial
          reason: >-
            R34 is the ASK half of the old R23, split out under B31. Asserts that a raised concern
            cites a ruling that exists, is cited back, and is filled in enough to answer - AND that
            every intent recorded as `contradict` has a ruling naming it in its Intent field. That
            last one reaches the stop the others cannot see: a contradiction stopped in conversation
            with nothing written to the spec, which is B11 and which the R23 split did not touch.
            Both halves are exercised on a committed fixture every run, because this repository has
            no rulings and no contradiction on record, so every sweep would otherwise be over an
            empty set - the failure a check here already shipped with. Still unasserted: an intent
            never classified at all leaves no record either, and no check can find it. The fix is
            Stage 1 recording the classification before it asks, which the recorder already
            supports and nothing forces.
      # Files the check actually opened, one per line. The spec is always one of
      # them, so a run that opened nothing is a bug rather than an empty repo.
      from: stdout_paths
      pattern: '^(\S+)$'
      min_covered: 1

  # --- agent templates carry frontmatter nothing reads ------------------------
  #
  # Declared checks covered all files (hygiene), `**/*.sh` and the solver corpus.
  # The agent templates carry YAML frontmatter that selects a model, a tool set
  # and a permission mode - and nothing validated it. A typo in a key name does
  # not fail loudly; it silently falls back to a default, so a template that
  # asked for a restricted tool set quietly gets the unrestricted one.
  #
  # `always`, because the failure does not arrive in a diff: a key stops being
  # honoured when the host changes, not when the template does.
    limitations:
      - It observes that a ruling was drafted, not that the question was good. A ruling can pass every field check and still ask something nobody can answer.
      - A contradiction stopped in conversation with nothing written leaves it nothing to find.

  - id: template-frontmatter
    why: a mistyped frontmatter key does not fail, it falls back to a default, so a template that asked for a restricted tool set silently gets the unrestricted one
    when:
      always: true
    severity: block
    requires: [python3]
    version_command: [python3, ./plugins/productizer/skills/spec/scripts/check-frontmatter.py, --version]
    mode: batch
    command: [python3, ./plugins/productizer/skills/spec/scripts/check-frontmatter.py]
    timeout_seconds: 60
    exit_codes:
      pass: [0]
      fail: [1]        # frontmatter that will not do what it says
      refused: [2, 3]  # 2 a bad invocation; 3 a template absent or unreadable - the check could not run
    coverage:
      # The check's own count of files it opened. A file nobody could read is
      # counted as could-not-run, never as a file that passed.
      from: stdout_count
      pattern: '([0-9]+) file\(s\) checked'
      min_covered: 1
      spec_units:
        - id: R110
          verdict: Covered
          evidence: >-
            check-frontmatter.py 1.1 fails any agent template whose frontmatter `name` contains
            `reviewer` and grants Write, Edit or NotebookEdit, and its default set includes
            agent-spec-reviewer.md. Falsified 2026-10-10 on a copy of that template with Edit added:
            rc 1, `reviewer 'spec-reviewer' grants 'Edit', a tool that can write a file`. NOT
            asserted: a write through Bash or an MCP tool.

  # --- the guide the release ships with ---------------------------------------
  #
  # R9 says the lifecycle shall regenerate the user guide from the active
  # requirements when a release is prepared. Nothing did, and it was not a
  # theoretical gap: v4.8.0 and v4.8.1 both shipped from a hand-edited GUIDE.md.
  #
  # `--check` REGENERATES INTO MEMORY AND WRITES NOTHING, which is the only way
  # a check may touch a file somebody edits. A check that quietly fixed the
  # guide would report a pass on a release nobody had read the guide for.
  #
  # `always`, deliberately not a path trigger. Drift does arrive in a diff of
  # either file, but a paths trigger reports `not_triggered` on every other
  # commit, and this is the one fact worth knowing on the commit where a release
  # is cut. It reads two files in under a tenth of a second.
  #
  # AN UNREADABLE SPEC IS 3, NOT 0. A guide generated from a spec nobody could
  # open would describe a product nobody agreed to, so it refuses to render a
  # count it could not measure - and refused is not a pass.
    limitations:
      - It checks the frontmatter of the agent templates only. A key the host silently ignores still reads as valid here.
      - Reviewer write-tools are matched on the frontmatter `name`. A reviewer whose name lacks the word, and a reviewer that writes through Bash or an MCP tool, both pass.

  # --- the skill body a model loads on every trigger ---------------------------
  #
  # B162, R153. SKILL.md went from 35,461 bytes to 12,586 when the stage detail
  # moved into references/stage-*.md and references/scripts.md. ADVISE, not
  # block: the check is new and has no fire history, and its budget is a
  # number chosen once, not a measured threshold.
  - id: skill-body-budget
    why: the spec skill's body loads whole on every trigger, and one pasted-back section or one renamed reference undoes the split while every other check stays green
    when:
      paths:
        - "plugins/productizer/skills/spec/SKILL.md"
        - "plugins/productizer/skills/spec/references/**"
        - "plugins/productizer/skills/spec/scripts/check-skill-body.py"
    severity: advise
    requires: [python3]
    version_command: [python3, ./plugins/productizer/skills/spec/scripts/check-skill-body.py, --version]
    mode: batch
    command: [python3, ./plugins/productizer/skills/spec/scripts/check-skill-body.py]
    timeout_seconds: 60
    exit_codes:
      pass: [0]
      fail: [1]        # the body is over 13,000 bytes, names a path that is not there, or names a stage file with no "before"
      refused: [2]     # usage, or SKILL.md absent or unreadable
    coverage:
      from: stdout_count
      pattern: '([0-9]+) of 3 assertions held'
      min_covered: 1
      spec_units:
        - id: R153
          verdict: Partial
          reason: >-
            It holds the size and the links, not the behaviour R153 is for: that a model opens a
            named reference when it enters a stage is measured by no eval, and a topic that was in
            the always-loaded further-reading table now takes one more read.
          evidence: >-
            check-skill-body.py 1.0 (B162): SKILL.md is 12,586 bytes against a 13,000-byte budget,
            its 25 references/, scripts/ and templates/ paths resolve under the skill directory,
            and each of its 6 references/stage-*.md mentions has "before" on its line or the line
            above - 3 of 3 assertions. Self-test 11 of 11, exit codes 0 1 2. Falsified 2026-10-25
            per assertion: size rule off, 10 of 11; path rule off, 9 of 11; "before" rule off, 9 of
            11; the line above ignored, 9 of 11; a copy of the skill with stage-9-maintain.md
            renamed turns `real-skill-md` red.
    limitations:
      - It reads text. Whether a model opens a named reference, and whether the reference says what the body promises, are not measured.
      - The 13,000-byte budget is a number chosen at B162, about 400 bytes over the body it was set on; the frontmatter (1,250 bytes) and the Templates table build-view.sh parses (1,063 bytes) cannot move.
      - A path preceded by a word, a dot, a slash or a hyphen is read as another tree's and is not checked, so `.claude/productizer/templates/` and `~/.claude/skills/spec/scripts/` paths are out of its reach.

  - id: guide-current
    why: two releases shipped from a hand-edited guide, and a guide describing behaviour the spec never agreed to reads exactly like one that does
    when:
      always: true
    severity: block
    requires:
      - ./plugins/productizer/skills/spec/scripts/build-guide.sh
      - python3
    version_command: [./plugins/productizer/skills/spec/scripts/build-guide.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/build-guide.sh, --check]
    timeout_seconds: 60
    exit_codes:
      pass: [0]
      fail: [1]        # the committed guide is out of date with the spec
      refused: [2, 3]  # no markers to write between, or a spec that could not be read
    coverage:
      spec_units:
        - id: R105
          verdict: Partial
          reason: >-
            B102. `--check` refuses (2) a guide carrying no markers to write between and (3) a spec
            it cannot read, and the check is blocking, so the checks job fails; the release jobs
            in .github/workflows/checks.yml run only after it (`needs: checks`), so a tag push with
            a guide that cannot be regenerated drafts no release. NOT asserted: that chain, which
            is workflow structure no check reads; a release prepared outside CI; and a failed write
            of the guide, which exits 1 uncaught and is driven by no case.
        - id: R141
          verdict: Partial
          reason: >-
            B140 and B141, ruled "converge on repo root". The declared check runs this script at
            the repository root, where the working directory IS the root, so its own run proves
            nothing about a relative option; the cases that drive one from another working
            directory are the script's self-test, which the workflow runs and no declared check
            does. Of the eight scripts changed under the ruling, seven are run by a declared check
            (classification-provenance, jira-unbound, guide-current, requirement-index-current,
            calibration-recorded, view-publish-refused, installed-copies) and graduate.sh by
            none. `--root` itself, if relative, is read from the working directory, which the
            requirement excepts; CLAUDE_TRANSCRIPTS, an environment variable graduate.sh reads, is
            not root-resolved; and the lifecycle's other scripts were not swept.
          evidence: >-
            build-guide.sh 1.3 `--selftest`: `relative-spec-under-root` and
            `relative-guide-under-root` read a relative --spec and --guide under the root, not the
            working directory, and assert the name of the file read.
        - id: R9
          verdict: Partial
          reason: >-
            Asserts the marker-delimited section is byte-identical to a fresh render, that every
            active requirement's committed row is the row the spec produces today, that a bare
            prose id outside the section resolves, and that no status word outside it contradicts
            the spec. The rest of the guide can still contradict a requirement WITHOUT naming its
            id, and 1.2 tried to narrow that and REFUTED the attempt with measurement rather than
            argument: three traceability rules run against this guide with a planted contradiction
            of R17 scored precision 0.00 (five fires, five false), zero examined, and 0.06 whose
            single catch fires identically on the sentence's own NEGATION. No lexical rule
            separates a sentence from its negation; closing this needs a model in the check path,
            which `models.checks` forbids outright. Partial is therefore deliberate, not pending.
            The check prints the hole's SIZE every run - 85 prose paragraphs outside the section,
            3 reachable by any assertion here, 82 examined by nothing.
      # The script's own count of active requirements it rendered. A run that
      # rendered none never prints this line - it exits 3 - so a zero here is
      # impossible rather than merely unlikely.
      from: stdout_count
      pattern: '([0-9]+) active requirement\(s\) rendered'
      min_covered: 1

  # --- a view that writes back, or a page that can republish itself ---------
  #
  # R4 says every published view shall be read-only WITH RESPECT TO THE SPEC.
  # That is two obligations failing in different places, so one check asserts
  # both: the generator writes nothing into the tree (every file hashed before
  # and after, content AND mtime, generating into a temporary --out), and the
  # page it produces declares no capability that can publish a new version of
  # itself. `downloads` is output and passes. A capability name this check
  # cannot classify also fails, because an unrecognised capability has not been
  # shown to be output-only - failing safe is the point.
  #
  # `always`, because neither failure arrives in a diff: the page's capability
  # is decided by the generator, and a stray write can come from anything it
  # calls.
  #
  # A PAGE THAT COULD NOT BE BUILT IS EXIT 2, never "0 capabilities declared".
    limitations:
      - It compares the generated section against the spec. The hand-written prose around it can say anything, and nothing checks that.

  - id: view-read-only
    why: a view that writes into the repo, or a page that can save new versions of itself, makes the provenance line under every panel false - the page becomes a second source of truth that can disagree with the repo
    when:
      always: true
    severity: block
    requires: [./plugins/productizer/skills/spec/scripts/check-view-readonly.sh]
    version_command: [./plugins/productizer/skills/spec/scripts/check-view-readonly.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/check-view-readonly.sh]
    timeout_seconds: 180
    exit_codes:
      pass: [0]
      fail: [1]        # a repository file moved, or the page declared something it may not
      refused: [2]     # no work tree, no builder, or a page that could not be generated
    coverage:
      spec_units:
        - id: R30
          verdict: Partial
          reason: >-
            Classifies what a published view requests and accepts only a `downloads` written as a
            plain string literal AT THE CALL SITE. A name the check had to ASSEMBLE - concatenation,
            template, binding, escape, evaluated source - is reported with the name and is still a
            finding, `downloads` included: a fold is an inference about a run-time value and this
            check never certifies what it inferred. What is NOT asserted, and is why this is not
            Covered: the file actually arriving on the viewer's device, and the platform property
            that `downloads` writes only there. That is a fact about the publishing service, not
            about this repository, and nothing here can reach it. The other surface - a capability
            granted in the publish CALL - is asserted by `view-publish-refused`, which drives the
            real hook and has now observed it firing.
        - id: R31
          verdict: Partial
          reason: >-
            Asserts that the GENERATED PAGE declares no capability able to publish new versions of
            itself, and refuses any name it cannot classify - by resolving what the page reaches for,
            so an evasive spelling is classified rather than missed and anything unresolvable is a
            finding. R31's actual consequence, the publish step declining, is asserted by
            `view-publish-refused` against the real hook; this check observes the page not asking,
            which is the earlier and weaker of the two.
        - id: R106
          verdict: Covered
          evidence: >-
            Both halves. The generator writes no repository file - every file hashed before and
            after, content and mtime, falsified by a builder that appends to one file and creates
            another. The page half no longer reads BYTES: the page's JavaScript is tokenized
            (escapes decoded, templates with nested substitutions, regex told from division,
            comments skipped) across script bodies, event-handler attributes and javascript: URLs,
            and every capability name and property key is CONSTANT-FOLDED - concatenation,
            templates, and identifiers bound exactly once, with writes counted across declarations,
            parameters, catch, destructuring, every assignment operator and ++/--. Six nets,
            including evaluators whose folded text is rescanned as source. Four pages version 2.0
            passed CLEAN are now findings - measured directly, each version against its own corpus:
            `window["ev"+"al"]("window.cla"+"ude.u"+"se('artifact')")` exits 0 under 2.0 and 1
            under 3.0, naming `artifact`. Seven assertions over 35 cases, each falsified alone
            against a patched classifier, and each case asserts the resolved NAME or `none` so a
            folded request is told from an unreadable one. The 3.1 change that skipped matches in
            text the check read as prose (B115) was reverted in v4.68.1 after a security review
            found a parser differential in it; every byte is read again, as in 3.0 (B133). B115 is
            closed at the data layer in build-view.sh (R94); the check reads every byte.
      # One bare path per repository file hashed. `must_cover: none` and NOT
      # all_triggering, deliberately: this examines the whole tree rather than
      # the change, so a commit that DELETES a file would name a path that no
      # longer exists and the check would be called hollow for being right. The
      # real hollowness guard is inside the check - an empty file list is exit 2.
      from: stdout_paths
      pattern: '^(\S+)$'
      must_cover: none
      min_covered: 1

  # --- an absent tool must be reported missing, not skipped -----------------
  #
  # R13. The behaviour lives in run-checks.sh and was demonstrated by hand; a
  # demonstration is not a test. Nothing stopped a refactor turning
  # `missing_tool` back into a skip while every run stayed green, because a
  # skipped check is invisible: no finding, no failure, no line anyone reads.
  #
  # Six things are asserted separately, and the last one is the one that
  # matters: that it counts as a blocking failure with verdict `refused`. A
  # status written into a file that does not change the verdict is a skip
  # wearing a different name.
  #
  # The fixture's own premise is guarded: if its declared tool turns out to be
  # installed, the case was never tested and that is exit 2 - unmeasured, not a
  # pass.
    limitations:
      - It reads what the page ASKS for. A capability granted in the publish call and never used by the page leaves no trace in the file.
      - The forbidden-name list comes from the reference doc, not the live runtime roster. An unrecognised name fails safe, but the classification is unverified.
      - The two hashes bracket the generator's run, so anything else writing to the tree in that window is attributed to it.

  - id: missing-tool-reported
    why: a check whose tool is absent has to refuse the stage, and a refactor turning that back into a skip would leave every run green with no scanner behind it
    when:
      always: true
    severity: block
    requires: [./plugins/productizer/skills/spec/scripts/check-missing-tool.sh]
    version_command: [./plugins/productizer/skills/spec/scripts/check-missing-tool.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/check-missing-tool.sh]
    timeout_seconds: 120
    exit_codes:
      pass: [0]
      fail: [1]        # an absent tool is no longer reported the way R13 requires
      refused: [2]     # no fixture, no runner, or the fixture's tool turned out to be installed
    coverage:
      spec_units:
        - id: R13
          verdict: Covered
          evidence: >-
            Falsifies the missing-tool report on BOTH resolution branches run-checks.sh has - a bare
            name resolved with `command -v`, and a `./`-relative executable path tested with `[ -x ]` -
            each in its OWN run so neither borrows the other's refusal, and each reported separately so
            a regression names the branch. Six assertions per branch, including that an absent tool
            changes the VERDICT rather than only a status field. Proven against the defect it exists
            for: with the executable-path branch regressed to a silent skip, version 1.0 exited 0
            saying `R13 satisfied` with 6 of 6 upheld, and 2.0 exits 1 naming the branch. Residue:
            absolute-path entries, a present-but-non-executable path, and `severity: advise`.
      from: stdout_paths
      pattern: '^(\S+)$'
      must_cover: none
      min_covered: 3

  # --- a requirement nobody said how to prove ---------------------------------
  #
  # R8 says the lifecycle shall allocate the next unused id AND RECORD IT IN THE
  # ACCEPTANCE CRITERIA TABLE. `validate-spec.py` owns the id half. Nothing owned
  # the other clause, and its failure is silent: a requirement lands, gets cited
  # by a plan, a branch and a PR title, and never acquires a row saying what
  # would prove it.
  #
  # A ROW IS NOT DEMANDED OF SUPERSEDED, WITHDRAWN OR INFERRED REQUIREMENTS. The
  # first two are frozen records. The third is references/import.md:70, which
  # says an inferred requirement gets no row precisely because this comparison is
  # what answers "do the tests assert the criteria". Demanding one is not a
  # stricter check, it is a wrong one that goes permanently red against a correct
  # spec.
  #
  # `always`, because the failure does not arrive in a diff: a row goes missing
  # when a requirement is added elsewhere in the file, not when the acceptance
  # table is edited. The table is the thing that did NOT change.
  #
  # MEASURED 2026-08-30: 25 active, 25 rows, 0 missing - so it lands blocking
  # rather than advisory. The count prints on every run, so if it ever has to
  # drop to `advise`, the day to promote it back is not a judgement call.
    limitations:
      - It exercises batch mode and the PATH-lookup branch. The executable-path branch and per_file mode are untested.

  - id: acceptance-rows
    why: a requirement with no acceptance row is one nobody can tell "verified" from "never looked at" for, and every plan and PR citing its id inherits that
    when:
      always: true
    severity: block
    requires: [./plugins/productizer/skills/spec/scripts/check-acceptance-rows.sh]
    version_command: [./plugins/productizer/skills/spec/scripts/check-acceptance-rows.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/check-acceptance-rows.sh]
    timeout_seconds: 60
    exit_codes:
      pass: [0]
      fail: [1]        # an active requirement with no row, named by id and line
      refused: [2]     # a spec that could not be read or could not be parsed
    coverage:
      spec_units:
        - id: R36
          verdict: Partial
          reason: >-
            Asserts every active requirement has a row, and since 1.1 that WHAT A ROW NAMES IS
            REAL: a cited check exists in checks.yaml and is not switched off, at least one check
            a row cites carries a spec_units claim for that requirement, a cited path resolves and
            a cited script exists, both in exact case on every host since 1.2 (B134). Eight
            committed cases falsify each separately, and three built ones the exact case. It found a
            live defect on its first run - R19's row named `classification-provenance`, which
            claims only R6, while R19 is claimed by `spec-home-stop`; the two artifacts disagreed
            and nothing had noticed. Still Partial, and the residue is narrower than before: it
            asserts a named check CLAIMS the requirement, never that it PROVES it. Rows naming a
            corpus, a config key or a promise are unverifiable prose and are listed by id under
            NOT VERIFIED on every run rather than absorbed into the pass.
        - id: R95
          verdict: Partial
          reason: >-
            A cited path is resolved against each directory's own listing, so the answer is the same
            on a case-insensitive disk and on a Linux runner; it is resolved on disk, not against
            git, so a present file that is not tracked still resolves. A non-ASCII path stored in
            another Unicode normalization than the row spells it is driven by no case.
          evidence: >-
            `path-in-exact-case` exits 0 on rows citing `docs/notes.md`, `docs/` and `tool.sh` as
            listed; `path-in-wrong-case` exits 1 naming `docs/NOTES.md` and `DOCS/` "in that exact
            case", on this case-insensitive disk too; `script-in-wrong-case` exits 1 naming `Tool.sh`.
            Falsified 2026-10-12 with the listing compared case-insensitively: 10 of 11,
            `path-in-wrong-case` red.
      # Every requirement PARSED, not the subset that produced findings.
      # "0 missing rows" is only a claim about a spec somebody actually parsed.
      from: stdout_count
      pattern: 'requirements read:\s*([0-9]+)'
      min_covered: 1

  # --- an import that reads as agreed -----------------------------------------
  #
  # R10. `build-view.sh` RENDERS the inferred status and nothing asserted it was
  # ever applied - the view's own comment calls an unmarked import "the precise
  # failure the inferred status exists to prevent". Unmarked, the audit trail
  # records a decision nobody made, and the Stage 2 halt starts defending an
  # imported accident with the authority of a ratification.
  #
  # THERE IS NO RELIABLE SIGNAL THAT AN IMPORT HAPPENED, AND THE CHECK SAYS SO ON
  # EVERY RUN. Stage 0c writes no artifact and sets no config key. The obvious
  # signal - the word "import" in a commit message - was built and MEASURED
  # FIRST, and attributed six requirements to an import in a fixture where four
  # were agreed one at a time. On THIS repo that is not hypothetical: it is a
  # lifecycle tool WITH an import stage, so a requirement about importing carries
  # the word while having nothing to do with a Stage 0c run. A check that fails
  # on a correct spec gets switched off.
  #
  # So detection is structural: a spec holding an inferred requirement is a spec
  # an import touched. From each MARKED requirement it reaches the batch - the
  # change-log row naming it, and the commit that INTRODUCED it, oldest first so
  # a later reflow is not read as the import - and demands the marking of every
  # sibling. `Stage 0c` is the one piece of prose trusted, being a stage
  # identifier rather than an English word.
  #
  # THE HOLE, STATED: an import that marked NOTHING and named no stage is
  # invisible here, because both structural cohorts start from a marker. The run
  # prints all three cohort tallies and says in words that no import was FOUND,
  # which is not the same fact as an import having been marked correctly.
  # Closing it needs an artifact Stage 0c does not write.
  #
  # GIT IS PART OF THE INPUT. A history that cannot be walked is exit 2 with that
  # cohort printed as an em dash - never as 0 commits.
    limitations:
      - It asserts a row EXISTS, never that the row is true. A row saying nothing asserts this satisfies it exactly as well as a real verifier.

  - id: import-marking
    why: a drafted requirement that lost its inferred marker reads as agreed, so the contradiction halt starts defending an imported accident with the authority of a decision nobody made
    when:
      always: true
    severity: block
    requires: [./plugins/productizer/skills/spec/scripts/check-import-marking.sh]
    version_command: [./plugins/productizer/skills/spec/scripts/check-import-marking.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/check-import-marking.sh]
    timeout_seconds: 120
    exit_codes:
      pass: [0]
      fail: [1]        # a requirement attributed to an import with no marking
      refused: [2]     # an unparseable spec; a git history that could not be walked, whether or not anything else names an import; or a backlog gap row naming Stage 0c whose history could not be read
    coverage:
      spec_units:
        - id: R92
          verdict: Covered
          evidence: >-
            1.2 reads a backlog line naming `Stage 0c` as evidence only in the commit that also
            drafted the requirements it names. The committed suite, run by `--selftest`:
            `stage-in-the-import-commit` exits 1 (the drafting commit wrote the line, the cohort is
            unmarked); `backlog-appended-later` and `backlog-append-names-id` exit 0 (a line
            appended later, even one naming a real id, is not evidence); `stage-in-the-backlog`
            exits 0 on a backlog naming the stage in the work tree only; `backlog-without-git`
            exits 2, a history that could not be read. Falsified 2026-10-12 with 1.1's reading of
            the backlog as it stands restored beside 1.2's: 12 of 13, `backlog-append-names-id` red.
            Since 1.3 (B143, B144) the suite holds 18 cases; the five new ones are
            `no-git-no-evidence` and `unborn-history` (B143), and `prose-in-the-import-commit`,
            `gap-row-beside-prose` and `gap-answered-later` (B144).
        - id: R139
          verdict: Covered
          evidence: >-
            check-import-marking.sh 1.3 (B143). `no-git-no-evidence` exits 2: a root that is not a
            git work tree, whose spec and backlog name no import, is refused rather than reported
            as no import - 1.2 exited 0 there. `unborn-history` exits 0, so a repository with no
            commits yet is read as having no history, not refused; `backlog-without-git` still
            exits 2.
        - id: R140
          verdict: Covered
          evidence: >-
            check-import-marking.sh 1.3 (B144). `prose-in-the-import-commit` exits 0: a backlog
            line naming the import stage in prose, in the commit that drafted requirements, is no
            longer evidence; `gap-row-beside-prose` exits 1, a new gap row whose item opens with
            the stage's id beside that prose; `gap-answered-later` exits 0 - a gap row answered in
            a later commit that adds a requirement does not attribute that requirement to the
            import.
        - id: R10
          verdict: n/a
          reason: >-
            R10 is event-driven - "WHEN a repository with history is imported" - and no import has
            happened here. Four independent sources are read every run and none records a Stage 0c
            import: the change log, the commit history, elsewhere in the spec, and a backlog line
            written by the commit that drafted requirements; the backlog as it stands is not
            evidence (1.2), and since 1.3 only a new gap row whose item opens with the stage's id
            counts; a history that cannot be walked is refused, exit 2, not read as no import
            (1.3). The
            guard is shut, the same shape as `jira-unbound`, and this claim expires by itself -
            record an import and the premise holds, the other three assertions run, and a cohort
            with no markings becomes a finding under its own heading. What stays unreachable even
            then, stated in the check rather than implied: an import that marked nothing AND left
            no record anywhere is byte-identical from outside to a repository never imported, so it
            reports no import rather than a finding. Closing that needs Stage 0c to write a machine
            record of its own id range.
      # Every requirement PARSED. Deliberately NOT the attribution count, which
      # is legitimately 0 on a repo that was never imported and would make every
      # honest run read as hollow.
      from: stdout_count
      pattern: 'requirements read:\s*([0-9]+)'
      min_covered: 1

  # --- a classification nobody can check ------------------------------------
  #
  # R6 says an intent is classified against the WHOLE living spec. A graded eval
  # scored 16/16 on OUTCOMES, which is equally consistent with a classifier that
  # read all 25 active requirements and one that read the first eight and got
  # lucky on a small spec. Outcomes cannot separate those, and the gap widens
  # with every requirement added. What separates them is the list of ids that
  # were actually in front of it.
  #
  # R19 says an unreachable spec home is a stop, not a classification against a
  # remembered copy. Written as a rule it is enforced by whoever remembers it.
  # Written as a hash it is enforced by arithmetic: no readable spec home means
  # no hash, the writer refuses to emit a record without one and creates nothing,
  # and this check refuses a record that has none. Classifying from a remembered
  # copy stops being forbidden and becomes impossible to RECORD.
  #
  # THE ONE PLACE AN EM DASH IS REFUSED. Everywhere else in this lifecycle an
  # unmeasured value is an em dash. Here the correct answer to an unreachable
  # spec is NO RECORD, so a record that honestly writes the gap in is a
  # classification that should never have happened wearing the paperwork of one
  # that did.
  #
  # A RECORD MADE AGAINST AN OLDER SPEC IS NOT A FINDING. The comparison is
  # anchored to the commit the record cites, not to the spec today. The normal
  # intake flow is classify, then merge the delta - so anchoring to today would
  # take this red on every historical record the first time a requirement was
  # added, and a check that is always red gets deleted.
  #
  # `always`, because the failure does not arrive in a diff: an intent is
  # classified against half a spec and nothing in the repo changes.
    limitations:
      - An import that marked nothing at all and named no stage is invisible: both structural cohorts start from a marker. The run says no import was FOUND, which is not the same fact as an import having been marked correctly. Closing this needs an artifact Stage 0c does not write.

  - id: classification-provenance
    why: a graded eval scored 16/16 on classification OUTCOMES, which is equally consistent with a classifier that saw half the spec and got lucky; only the ids that were in scope tell those apart
    when:
      always: true
    severity: block
    requires: [./plugins/productizer/skills/spec/scripts/check-classification-provenance.sh]
    version_command: [./plugins/productizer/skills/spec/scripts/check-classification-provenance.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/check-classification-provenance.sh]
    timeout_seconds: 60
    exit_codes:
      pass: [0]        # every record stands up, or there are none and it says so
      fail: [1]        # a truncated scope list, a hash that does not match, a missing or placeholder hash, two records for one intent, or a fifth classification value
      refused: [2]     # no work tree, no spec, an unreadable store or record, or a recorded commit this clone cannot resolve
    coverage:
      spec_units:
        - id: R6
          verdict: Partial
          reason: >-
            Asserts per record that the ids in scope are exactly the set active in the spec at the
            commit the record names, and that the classification is one of the four. Since 3.0 it
            also asserts, per corroborated classification, that a record EXISTS for the intent that
            line names - the hole 2.0 left, where three records against five corroborated
            classifications passed and printed the difference as a NOTE. And assertion 8 asserts the
            same for every change-log row citing an arriving intent whose merge changed the spec:
            it began advisory because it started red on intent #3, which was classified, merged and
            left no record; that record now exists and the assertion is blocking. The corroborator
            is widened past the backticked spelling, measured at 3 lines to 4 on this backlog, and
            deliberately not tense-free - a tense-free pattern matches this repo's own prose about
            what intake WILL classify. Still NOT asserted: the act. A classification that merges
            nothing - a duplicate or a contradiction - writes no change-log row and no spec delta,
            so no artefact in this repository records it. Closing that needs Stage 2 to call
            record-classification.sh at the moment it settles on one of the four.
        - id: R141
          verdict: Partial
          reason: >-
            B140 and B141, ruled "converge on repo root". The declared check runs this script at
            the repository root, where the working directory IS the root, so its own run proves
            nothing about a relative option; the cases that drive one from another working
            directory are the script's self-test, which the workflow runs and no declared check
            does. Of the eight scripts changed under the ruling, seven are run by a declared check
            (classification-provenance, jira-unbound, guide-current, requirement-index-current,
            calibration-recorded, view-publish-refused, installed-copies) and graduate.sh by
            none. `--root` itself, if relative, is read from the working directory, which the
            requirement excepts; CLAUDE_TRANSCRIPTS, an environment variable graduate.sh reads, is
            not root-resolved; and the lifecycle's other scripts were not swept.
          evidence: >-
            check-classification-provenance.sh 3.1 `--selftest`: `relative-store-under-root` is run
            from a working directory holding a decoy and reads the root's store; `absolute-store`,
            `absolute-spec-path` and `absolute-backlog` read an absolute path as given (through 3.0
            it was joined to the root), and `absolute-store-outside` reads one outside the root.
      # Files actually opened, one per line. The spec is always one of them, so
      # a run that opened nothing is a bug rather than a repo with no records.
      # `must_cover` omitted deliberately: an `always` check taking no {files},
      # the same shape as ruling-requested.
      from: stdout_paths
      pattern: '^(\S+)$'
      min_covered: 1

  # --- a replaced requirement rewritten years later --------------------------
  #
  # R3's marking half is readable in the file in front of you. Its TEXT half is
  # not readable there at all: the spec always says whatever it currently says,
  # and a superseded requirement whose sentence was quietly rewritten looks
  # exactly like one nobody touched. The original survives only in git.
  #
  # This is the first check here to take GIT HISTORY as an input, and it reads
  # what a commit USED TO SAY rather than what a commit changed. A diff-only
  # gate sees an edit at the moment it is proposed and never again - which is
  # how both of this repo's real leaks survived: one in a blob, one in a commit
  # message, neither visible to any diff after the commit that made it.
  #
  # The baseline is chosen PER REQUIREMENT: the newest commit at which that
  # requirement was still active. One ref cannot be that commit for every id,
  # which is why validate-spec.py --baseline cannot answer R3.
  #
  # `always`. The edit that matters was merged some commits ago and is, to
  # every diff since, simply the agreed text.
  #
  # min_covered: 2 is deliberate. One covered path means the spec was read and
  # NO history was - precisely the run that answers nothing while exiting 0.
    limitations:
      - A classification that left no record at all is invisible. Zero recorded is not detectable as an intake that classified in conversation and wrote nothing.
      - It proves the scope list matches the spec it names. That the named commit is the RIGHT one is established by the writer, not by this.

  # WHICH FILES ARE THE SPEC -- the discovery contract, recorded here because
  # this is the check that hardcodes a single spec path today, and because a
  # contract stated only inside one tool is a contract the next tool re-invents
  # differently.
  #
  # `validate-spec.py --repo ROOT --list-files` prints the repo's spec files,
  # one absolute-or-ROOT-relative path per line, in declared order, and is the
  # single source of that list. Any tool that reads the spec should take the
  # list from it rather than hardcoding `.claude/productizer/spec.md`.
  #
  #   exit 0  the list is on stdout, one path per line, every path a readable
  #           file. An empty stdout at exit 0 cannot happen.
  #   exit 1  an undeclared spec file was found in the spec directory. NO list
  #           is printed; stdout carries `PATH:1: ERROR SPEC_FILE_UNDECLARED:
  #           ...`. A caller must treat this as unmeasured for its own purpose,
  #           not fall back to the default path.
  #   exit 4  discovery refused - config.json unreadable or `spec.path`
  #           malformed, or a declared part is not on disk. stdout carries
  #           `DISCOVERY_REFUSED` and a `NOT MEASURED` line.
  #   exit 2  usage error, on stderr.
  #
  # THE RULE IT IMPLEMENTS. `spec.path` in ROOT/.claude/productizer/config.json
  # is authoritative: a string is one file, a list of strings is a split spec in
  # reading order, and no config at all means `.claude/productizer/spec.md`.
  # Nothing is inferred from a filename - a glob would let a file join the id
  # space because of what it was called. The glob is used only in the other
  # direction: any other `.md` in the spec directory that reads as a spec, or
  # that cannot be read at all, is an ERROR rather than a silent inclusion, so a
  # repo that splits its spec and forgets to declare it gets a named file
  # instead of a confident pass.
  #
  # Paths are emitted with `os.path.normpath`, so `--repo .` prints
  # `.claude/productizer/spec.md` and `--repo /abs/root` prints an absolute
  # path. A caller that needs one form should pass the ROOT that produces it
  # rather than rewriting what comes back.

  - id: superseded-text
    why: a superseded requirement's sentence can be rewritten long after the fact and nothing in the file shows it; only the commit before the supersede holds what was agreed
    when:
      always: true
    severity: block
    requires:
      - ./plugins/productizer/skills/spec/scripts/check-superseded-text.sh
      - ./plugins/productizer/skills/spec/scripts/spec-requirements.sh
      - git
    version_command: [./plugins/productizer/skills/spec/scripts/check-superseded-text.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/check-superseded-text.sh]
    timeout_seconds: 120
    exit_codes:
      pass: [0]
      fail: [1]        # text altered, marker removed, or a pointer to nothing
      refused: [2]     # a shallow clone, an untracked spec, a spec with no requirements
    coverage:
      spec_units:
        - id: R3
          verdict: Covered
          evidence: >-
            A superseded requirement keeps the sentence it carried at the last commit at which it
            was still active, keeps its marker, and is still THERE. The presence half was added
            after an audit showed that deleting the entry outright passed - the loop walked what
            survived rather than what should have. Falsified three ways: rewrite the sentence,
            remove the marker, delete the entry.
      from: stdout_paths
      pattern: '^(\S+)$'
      min_covered: 2

  # --- a spec change merged under a live contradiction ------------------------
  #
  # R12. The load-bearing word is DEPENDS. references/rulings.md: "A pending
  # ruling blocks its own delta and nothing else. Unrelated intents keep
  # flowing." A check refusing every spec change while any ruling is pending
  # would enforce the opposite of R12 while passing for it - and would fail
  # slowly, by teaching people to stop routing work through intake at all.
  #
  # Scope is derived from the ruling itself: the requirement quoted in its
  # `## The conflict` section, plus the ids in the concern row citing it.
  # Everything else is REPORTED as allocated and let through, on its own line,
  # so the decision not to block is visible rather than silent.
  #
  # `always`, because the window a pending ruling holds open starts at the
  # commit that raised it - older than whatever is under review now - and a
  # ruling raised in a different PR governs this one.
  #
  # UNREADABLE IS NOT ABSENT. No rulings directory is clean and says so: R12
  # governs a state this repo has never entered. A rulings directory that
  # exists and cannot be listed is exit 2 - that is where an unruled
  # contradiction hides.
    limitations:
      - A requirement that ENTERS the repo already superseded and already rewritten cannot be caught: its first commit is the only baseline there is.
      - A shallow clone is refused rather than passed, which means CI must fetch full history for this to measure anything.

  - id: pending-ruling-scope
    why: a pending ruling that blocks nothing is a stop nobody obeys, and one that blocks everything is a stop everybody routes around
    when:
      always: true
    severity: block
    requires:
      - ./plugins/productizer/skills/spec/scripts/check-pending-ruling-scope.sh
      - ./plugins/productizer/skills/spec/scripts/spec-requirements.sh
      - git
    version_command: [./plugins/productizer/skills/spec/scripts/check-pending-ruling-scope.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/check-pending-ruling-scope.sh]
    timeout_seconds: 120
    exit_codes:
      pass: [0]
      fail: [1]        # a spec change depending on an unruled contradiction
      refused: [2]     # a ruling that cannot be scoped, or a window out of reach
    coverage:
      spec_units:
        - id: R101
          verdict: Partial
          reason: >-
            The wait, for the spec only (B102). While a ruling's status is `pending` a spec change
            touching a requirement it names is refused, and the refusal lifts only when the status
            changes. NOT asserted: work on the intent outside the spec - a plan, a build, a stage
            advance - since `stage-advance.sh` never reads rulings; and that the ruling that lifts
            it was made by a person.
        - id: R103
          verdict: Partial
          reason: >-
            R103 supersedes R12 (B102), naming the three changes. ADDS is driven: the `merged`
            case refuses the incoming behaviour allocated under a new id, and `unrelated` lets an
            unrelated addition through. REFINES (a named requirement's sentence edited) and
            SUPERSEDES (its status changed) are refused by the code and driven by NO case.
            Refuses a spec change that edits, supersedes or points forward at the contested
            requirement, and now recognises the incoming behaviour merged under a DIFFERENT EARS
            keyword or a reworded condition - the audit's case, which the previous version reported
            as merely allocated and passed. THE LIMITATION THIS ROW USED TO CARRY WAS REFUTED BY
            MEASUREMENT: it argued that closing the gap needs a similarity threshold and that a
            threshold starts refusing unrelated intents. Measured over every pair of requirements in
            this spec, the new rule flags 19 with ZERO from different lineages, against 22 and THREE
            for the old one - the widening removed false positives rather than adding them, because
            the old rule's condition clause for a ubiquitous requirement was the system name alone
            and matched every ubiquitous requirement against every other. The rule is exercised on a
            committed fixture in every run, both ways, because this repository has no pending ruling
            and the sweep alone would assert nothing. Still unasserted: the same behaviour with BOTH
            condition and obligation rewritten past the overlap bar, and R12 against a real pending
            ruling here, of which there are none.
      from: stdout_paths
      pattern: '^(\S+)$'
      min_covered: 1
    limitations:
      - The incoming behaviour merged under a sentence with a different EARS trigger than the contested requirement is not recognised. Closing it needs a similarity threshold, which starts refusing unrelated intents - the failure rulings.md names.

  # --- R27 and R28: measure the precondition, do not claim the behaviour ----
  #
  # Both are EARS optional-feature clauses guarded on a backlog item naming a
  # Jira key. Nothing here does: `jira` is null in the config - the recorded
  # "GitHub only" answer - and no backlog row carries a key. So the obligation
  # is not unimplemented, it is UNREACHABLE, and the honest verdict is `n/a`.
  #
  # The n/a is not an excuse with a reason bolted on. It is bound to a
  # measurement that reruns every time: the runner voids a coverage claim from
  # a check that failed, so the instant Jira is bound or a key appears, this
  # check fails, both claims void, R27 and R28 return to `Missing`, and the
  # suite refuses. The n/a expires by itself. Nobody has to remember it.
  #
  # Building the integration instead stays a backlog item, which is the
  # decision that was actually made. This declares what is true today, and
  # arranges to stop being true on its own.
  - id: jira-unbound
    why: an n/a nobody can expire is an excuse; this one is re-measured from the two files that decide it, every run
    when:
      always: true
    severity: block
    requires:
      - ./plugins/productizer/skills/spec/scripts/check-jira-unbound.sh
      - python3
    version_command: [./plugins/productizer/skills/spec/scripts/check-jira-unbound.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/check-jira-unbound.sh]
    timeout_seconds: 60
    exit_codes:
      pass: [0]
      fail: [1]        # Jira is bound, or a backlog row names something key-shaped
      refused: [2]     # config or backlog absent or unreadable - the precondition is UNKNOWN, which is not shut
    coverage:
      from: stdout_paths
      pattern: '^(\S+)$'
      min_covered: 1
      spec_units:
        - id: R27
          verdict: n/a
          reason: >-
            No backlog item names a Jira key and `jira` is null in the config, so the
            "Where a backlog item names a Jira key" guard never opens in this repository.
            This is measured from both files on every run, not asserted once: bind Jira or
            write a key into the backlog and this check fails, which voids this claim and
            puts R27 back to Missing.
          evidence: .claude/productizer/config.json and .claude/productizer/backlog.md, read each run
        - id: R28
          verdict: n/a
          reason: >-
            Same guard as R27, same measurement. With no Jira binding and no key in the
            backlog there is no Jira for the lifecycle to write back to, so the obligation
            not to write is unreachable rather than unimplemented. It returns to Missing the
            moment the guard can open.
        - id: R141
          verdict: Partial
          reason: >-
            B140 and B141, ruled "converge on repo root". The declared check runs this script at
            the repository root, where the working directory IS the root, so its own run proves
            nothing about a relative option; the cases that drive one from another working
            directory are the script's self-test, which the workflow runs and no declared check
            does. Of the eight scripts changed under the ruling, seven are run by a declared check
            (classification-provenance, jira-unbound, guide-current, requirement-index-current,
            calibration-recorded, view-publish-refused, installed-copies) and graduate.sh by
            none. `--root` itself, if relative, is read from the working directory, which the
            requirement excepts; CLAUDE_TRANSCRIPTS, an environment variable graduate.sh reads, is
            not root-resolved; and the lifecycle's other scripts were not swept.
          evidence: >-
            check-jira-unbound.sh 1.1 `--selftest`: `rel-shut` joins a relative --config to the root
            from another working directory; `abs-shut`, `abs-bound` and `abs-outside` read an
            absolute --config or --backlog as given (through 1.0 a config that was there was
            reported absent).
          evidence: .claude/productizer/config.json and .claude/productizer/backlog.md, read each run
    limitations:
      - It measures that the guard is SHUT. It says nothing whatever about what the lifecycle would do if it were open, because nothing here reads or writes Jira at all.
      - The key pattern has no exclusion list, so a token like `UTF-8` in the backlog will fail this check. That is the intended direction to be wrong in - a false positive costs five minutes, a false negative leaves two requirements in an n/a nobody notices.

  # --- an unmeasured value must not be recorded as zero ---------------------
  #
  # R26, and P1's first sentence. Its pair R25 - report it as unmeasured - is
  # already asserted, and the two are not the same claim. A run can print
  # `spec coverage: UNMEASURED` on the terminal and, in the same breath, write
  # `units_total: 0` into the result file every downstream reader parses: R25
  # passes on that run and R26 fails on it. That state was CONSTRUCTED from
  # this runner, not argued for - the printed line is keyed on the status and
  # the recorded values are not, so the two live in different code paths.
  #
  # So this check reads THE RESULT FILE and never the printed line. It drives
  # `fixtures/fabricated-zero/` through run-checks.sh, which makes two values
  # unmeasurable at once because the runner records them in two shapes: the
  # coverage denominator (spec file absent, so the fields must be NULL) and one
  # check's own coverage (declared tool absent, so the block must be ABSENT).
  # Absent, null and zero are three states and collapsing them is the defect;
  # each field is classified into one of them and the classification prints, so
  # a failure says which state the field is in.
  #
  # Both premises are guarded. If the tool turns out to be installed, or the
  # spec path turns out to exist, nothing was unmeasurable and R26 was never
  # exercised - exit 2, unmeasured, never a pass.
  - id: no-fabricated-zero
    why: a fabricated zero is the only failure here that is invisible - a month later it reads exactly like a real zero, and nobody can tell which they are looking at
    when:
      always: true
    severity: block
    requires: [./plugins/productizer/skills/spec/scripts/check-no-fabricated-zero.sh]
    version_command: [./plugins/productizer/skills/spec/scripts/check-no-fabricated-zero.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/check-no-fabricated-zero.sh]
    timeout_seconds: 120
    exit_codes:
      pass: [0]
      fail: [1]        # a value nobody could measure is recorded as zero
      refused: [2]     # no fixture, no runner, an unreadable result, or a premise that did not hold
    coverage:
      # The three files it opened: the runner under test and the two fixture
      # files. A run that printed fewer opened fewer, and did not run the case.
      from: stdout_paths
      pattern: '^(\S+)$'
      must_cover: none
      min_covered: 3
      spec_units:
        - id: R26
          verdict: Covered
          evidence: fixtures/fabricated-zero/ driven through run-checks.sh; seven assertions on the recorded result, falsified three ways
    limitations:
      - It names six fields plus a sweep over cannot-run rows. A zero fabricated into a seventh field would not be caught; a blanket "no 0 anywhere" would go red on real counts like `passed: 0`.
      - Two of P1's four sources are exercised - an absent tool and an unreadable file. A failed API call and a refused permission are not reached by any fixture.
      - Assertion 7 sweeps cannot-run rows, and this fixture produces only a `missing_tool` row, which never carried a coverage block - so that assertion sees an empty set here. The positive case lives in the `cannot-run-coverage` check over `fixtures/timeout-zero/`.
      - It covers run-checks.sh only. P1 also names import-survey.sh, build-view.sh and track-traffic.sh, and none of those is touched here.

  # --- a contradiction must merge nothing -----------------------------------
  #
  # R24. R23's pair - stop, and ask - is asserted by two checks, and NEITHER
  # looks at the spec afterwards. A contradiction that halted loudly and merged
  # quietly passes every other check in this file. This one drives a committed
  # fixture through the real contradiction path and then compares the spec.
  #
  # LITERAL WHOLE-FILE IDENTITY IS NOT THE TEST, and demanding it would fail
  # correct behaviour. The stop is REQUIRED to append an `Areas of concern`
  # row - step 3 of references/rulings.md, and `ruling-requested` goes red
  # without it. So assertion 1 hashes the spec with that section excised, and
  # every other byte must match. That leaves one blind region, which is why
  # assertion 2 also requires every id inside that section to name a
  # requirement that existed before the run: an id taken there is a merge, and
  # the excision would otherwise hide it. That gap was found by falsifying, not
  # by reading - the first version of this check went green on it.
  #
  # Four assertions, reported separately: the spec is unchanged, no id was
  # allocated, the change log gained no row, the acceptance table gained no
  # row. A contradiction that quietly took the next id has merged the losing
  # side even if no sentence changed, and the counter moving is the tell.
  #
  # The premise is guarded at both ends. If the fixture's intent does not
  # actually contradict, the case was never tested - exit 2. If the merge path
  # exits non-zero, it never ran to completion, and a spec left untouched by an
  # ERROR is not a spec the lifecycle declined to merge - also exit 2.
  - id: nothing-merged
    why: R23's two checks assert the stop and neither looks at the spec afterwards, so a contradiction that halted loudly and merged quietly passes every check in this file
    when:
      always: true
    severity: block
    requires:
      - ./plugins/productizer/skills/spec/scripts/check-nothing-merged.sh
      - python3
    version_command: [./plugins/productizer/skills/spec/scripts/check-nothing-merged.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/check-nothing-merged.sh]
    timeout_seconds: 120
    exit_codes:
      pass: [0]        # the contradiction path merged nothing
      fail: [1]        # the spec moved, an id was taken, or a log row appeared
      refused: [2]     # no fixture, no contradiction checker, a premise that did not hold, or a merge path that never ran
    coverage:
      # The four files it opened: both fixture files, the checker that settles
      # the premise, and the merge path it drove. A run that printed fewer
      # opened fewer, and did not run the case.
      from: stdout_paths
      pattern: '^(\S+)$'
      must_cover: none
      min_covered: 4
      spec_units:
        - id: R24
          verdict: Covered
          evidence: fixtures/nothing-merged/ driven through request-ruling.sh; four assertions on the spec afterwards, each falsified separately
    limitations:
      - It proves the CONTRADICTION PATH merges nothing. `request-ruling.sh` is the only script under skills/spec/scripts that writes spec.md - a grep result, not a guarantee, and a second writer added later is invisible to this.
      - Prose written into `## Areas of concern` is not seen. Assertion 1 excises that section and assertion 2 catches only ids taken inside it.
      - >-
          The `record-classification.sh` path is not exercised; it needs a work tree with the spec
          committed at HEAD. "Recording a contradict classification merges nothing" is therefore unasserted.
      - A file the merge path CREATES elsewhere in the sandbox is not noticed. The comparison is scoped to the spec, which is what R24 is about, but a merge that landed somewhere else entirely would not show here.

  # --- no verdict, no count -------------------------------------------------
  #
  # R26's other half, and the reason it needed one. `no-fabricated-zero`'s
  # seventh assertion sweeps every cannot-run row for a recorded coverage count.
  # It was correct, and it had been sweeping an EMPTY SET since the day it was
  # written: its fixture produces only a `missing_tool` row, and `missing_tool`
  # is the single status that never carried a coverage block. The assertion had
  # never once seen the thing it was looking for.
  #
  # Measured on the runner as it stood: four of the five cannot-run statuses
  # recorded `covered: 0` - timeout, no_version, refused and unmapped_exit. A
  # scanner killed at its limit printed nothing, and nothing is not zero.
  #
  # So this fixture reaches the state by a DIFFERENT mechanism - a command that
  # sleeps past its limit - and the premise guard enforces exactly that: point
  # this at the absent-tool fixture and it refuses, because that would be the
  # same empty set again.
  #
  # Two assertions, and the second matters as much as the first: a check that
  # RAN and genuinely covered nothing must still record its zero. That is a
  # measurement, and deleting it would be this same bug pointed the other way.
  - id: cannot-run-coverage
    why: an assertion that has never seen a positive case is not evidence, and this one had been sweeping an empty set since it was written
    when:
      always: true
    severity: block
    requires:
      - ./plugins/productizer/skills/spec/scripts/check-cannot-run-coverage.sh
      - python3
    version_command: [./plugins/productizer/skills/spec/scripts/check-cannot-run-coverage.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/check-cannot-run-coverage.sh]
    timeout_seconds: 120
    exit_codes:
      pass: [0]
      fail: [1]        # a check that reached no verdict recorded a coverage count
      refused: [2]     # no fixture, no runner, an unreadable result, or a premise that did not hold
    coverage:
      from: stdout_paths
      pattern: '^(\S+)$'
      must_cover: none
      min_covered: 3
      spec_units:
        - id: R26
          verdict: Covered
          evidence: fixtures/timeout-zero/ driven through run-checks.sh; falsified by pointing it at the pre-fix runner, which records covered=0 on a killed check
    limitations:
      - The fixture costs about six wall seconds, three of which are the runner's own TERM-then-KILL grace period and cannot be shortened from the config.
      - It asserts the SHAPE - no coverage key on a no-verdict row. It does not assert that the other evidence on that row (files_in_scope, exit_code, timed_out, output_tail) is still there, though all four survive today.

  # --- declared scope, and the hollow refusal ------------------------------
  #
  # R5 and R15. The hollow behaviour lived in run-checks.sh and had been
  # DEMONSTRATED, never tested - nothing stopped a refactor turning the refusal
  # back into a pass while every run stayed green. Falsified: patch the hollow
  # branch to record `pass` and four of the ten assertions go red, including
  # the one that matters most - that it changes the VERDICT, not just the
  # label. A status written into a file that does not change the verdict is a
  # skip wearing a different name.
  - id: declared-scope
    why: a check that exits zero having examined less than it declared is the largest hollow pass available, and the refusal that stops it had never been tested
    when:
      always: true
    severity: block
    requires:
      - ./plugins/productizer/skills/spec/scripts/check-declared-scope.sh
      - python3
    version_command: [./plugins/productizer/skills/spec/scripts/check-declared-scope.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/check-declared-scope.sh]
    timeout_seconds: 120
    exit_codes:
      pass: [0]
      fail: [1]
      refused: [2]
    coverage:
      spec_units:
        - id: R107
          verdict: Covered
          evidence: >-
            A check declaring no coverage requirement is refused at config load; driven
            through the real runner over a committed fixture.
        - id: R96
          verdict: Covered
          evidence: >-
            The report half of the old R15 (B102). A fixture check exiting 0 having examined
            less than it declared is recorded with status `hollow`, its coverage reads
            satisfied=False with the shortfall (examined 1 against a declared minimum of 2), and
            the runner's report line reads HOLLOW for it; the inverse still passes. Falsified by
            patching the hollow branch to record a pass - four of ten assertions went red.
        - id: R97
          verdict: Partial
          reason: >-
            The verdict half of the old R15 (B102). Asserted for a BLOCKING check only: the
            runner exits 3 over the shortfall and the result reads verdict `refused` with one
            blocking failure. An advisory check that comes back hollow is recorded as an advisory
            failure and voids its claims (run-checks.sh's own `adv-hollow-voids` case), and no
            case of this check drives one.
          evidence: >-
            `the run exits 3 (refused) over the shortfall` and `it counts as a blocking failure
            and the verdict is refused`, two of the ten assertions; both went red when the hollow
            branch was patched to record a pass.
      from: stdout_paths
      pattern: '^(\S+)$'
      must_cover: none
      min_covered: 3

  # --- the spec's structural invariants -------------------------------------
  #
  # R2 and R8. R2 is a claim about HISTORY, so this reads git history and
  # refuses a shallow clone rather than passing over one.
  #
  # It also closes a hole the audit found in `superseded-text`: deleting a
  # superseded requirement outright passed there, because that check iterates
  # over what is present and a vanished requirement is not in the loop. This
  # one compares against every reachable spec version, so a disappearance is a
  # finding. Falsified both ways - delete an active id and R2.2 goes red at
  # 27 of 28; set the counter below a used id and R8.1 goes red while R8.2
  # still holds.
  - id: spec-integrity
    why: every id in every plan, test, review and PR title points at this file, so an id that changes meaning silently invalidates all of them
    when:
      always: true
    severity: block
    requires:
      - ./plugins/productizer/skills/spec/scripts/check-spec-integrity.sh
      - git
      - python3
    version_command: [./plugins/productizer/skills/spec/scripts/check-spec-integrity.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/check-spec-integrity.sh]
    timeout_seconds: 180
    exit_codes:
      pass: [0]
      fail: [1]
      refused: [2]     # unreadable spec, no history, or a shallow clone
    coverage:
      spec_units:
        - id: R2
          verdict: Covered
          evidence: >-
            Every id defined in any reachable spec version is still defined today, under its
            own number, meaning what it meant. Falsified by deleting an active id and by
            moving a sentence to a different id.
        - id: R35
          verdict: Covered
          evidence: >-
            R35 is the ALLOCATION half of the old R8, split out under B31 so it has its own id and
            its own claim. The counter is strictly above every id ever used - superseded and
            withdrawn included, because a used id is used forever - and every addition is named in
            the change log. Falsified by setting the counter below a used id.
      from: stdout_paths
      pattern: '^(\S+)$'
      must_cover: none
      min_covered: 3
    limitations:
      - It also asserts R1 within the spec home, but does not CLAIM R1 - `spec-home` claims that, and it is the one that counts across `product.repos`. Two checks claiming one requirement is two places to disagree, not double coverage.
      - A shallow clone is refused rather than passed, so CI must fetch full history for this to measure anything.

  # --- the unmeasured value, on the line a person reads ---------------------
  #
  # R11, R20 and R25. R25's pair R26 is asserted against what gets RECORDED;
  # this asserts what gets REPORTED, and the two are separable - a run can
  # print UNMEASURED while writing 0, which was constructed in this repo.
  # Falsified: make the survey draft from a barren repo and R20.1 goes red;
  # stop the runner printing the word and R25.1 goes red.
  - id: unmeasured-report
    why: an unmeasured value that prints as a number is indistinguishable from a real one a month later, and nobody can tell which they are looking at
    when:
      always: true
    severity: block
    requires:
      - ./plugins/productizer/skills/spec/scripts/check-unmeasured-report.sh
      - python3
    version_command: [./plugins/productizer/skills/spec/scripts/check-unmeasured-report.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/check-unmeasured-report.sh]
    timeout_seconds: 180
    exit_codes:
      pass: [0]
      fail: [1]
      refused: [2]
    coverage:
      spec_units:
        - id: R11
          verdict: Partial
          reason: >-
            Downgraded from Covered 2026-10-13 (B102). Two figures are tied to their files: the
            Living spec tile moves with the spec it is built from (R11.1) and renders a marker when
            that spec cannot be read (R11.2), and the Checks tile reads `?` over a result file that
            will not parse (R11.3). Nothing asserts that EVERY figure is read from a repository
            file, and no case here removes a source file.
          evidence: >-
            A figure whose source cannot be read is drawn as a marker and never as a number,
            and a real measurement still renders its number.
        - id: R20
          verdict: Covered
          evidence: >-
            A barren repository reaches the refusing verdict and an evidenced one does not.
            Falsified by making the survey draft anyway - R20.1 went red.
        - id: R25
          verdict: Covered
          evidence: >-
            Each tool says the word on the line a person reads, asserted across the runner,
            the hygiene check and the status report, with the inverse asserted too.
            Falsified by stopping the runner printing it - R25.1 went red.
      from: stdout_paths
      pattern: '^(\S+)$'
      must_cover: none
      min_covered: 5

  # --- a repository never chooses what runs ---------------------------------
  #
  # P4, via R18 and R22, plus the half of R17 that exists. Split from the
  # decision half deliberately: that half FAILS, and a real failure must not
  # void the claims of three requirements that are genuinely asserted.
  - id: untrusted-execution
    why: this is the plugin's central security claim, and R18's acceptance row named the implementation rather than the obligation, so it could never fail
    when:
      always: true
    severity: block
    requires:
      - ./plugins/productizer/skills/spec/scripts/check-untrusted-execution.sh
      - ./plugins/productizer/skills/spec/scripts/argv-classify.py
      - python3
    version_command: [./plugins/productizer/skills/spec/scripts/check-untrusted-execution.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/check-untrusted-execution.sh, --assert, 'r17-block,r18,r22']
    timeout_seconds: 180
    exit_codes:
      pass: [0]
      fail: [1]
      refused: [2]
    coverage:
      spec_units:
        - id: R102
          verdict: Covered
          evidence: >-
            R102 supersedes R29 (B102), naming R22's opt-in as its exception. The three bypasses
            R29 was written for are each constructed and each refused: a repo-local script passed
            as an argument with the opt-in off (`interpreter-operand`), and - with the opt-in ON,
            so the refusal cannot be the opt-in's - a program taken positionally and a build tool
            named by neither list; a legitimate command still runs. Measured 2026-10-13 through
            run-checks.sh: under the opt-in a repo-local program in argv[0] or an interpreter's
            first operand runs, while awk, make, env and an inline program stay refused.
            Corrected 2026-10-13 (B150, v4.72.1): this claim did not hold at 6627bcf - twenty
            argv shapes ran a repository file with the opt-in off, `python3 -W ignore x.py` and
            `python3.9 x.py` among them - and `interpreter-operand` drives only the one shape.
            The other shapes are asserted by `checks-stage-runner`.
        - id: R123
          verdict: Partial
          reason: >-
            Asserts the BLOCK half only - 30 refused rows and 14 allowed ones, so a gate that
            blocked everything would fail too. The deciding half is asserted by
            `publish-gate-decides`, which claims R17 in full.
        - id: R18
          verdict: Covered
          evidence: >-
            A shell or interpreter carrying an inline program is refused in every argv position,
            including the three bypasses previously reproduced, while a legitimate command runs.
        - id: R22
          verdict: Covered
          evidence: >-
            A repo-local tool does not run with `allow_repo_local_tools` false and does run with
            it true; both directions asserted, because a gate that never opens is not a gate.
      from: stdout_paths
      pattern: '^(\S+)$'
      must_cover: none
      min_covered: 2

  # --- the half of R17 that does not exist ----------------------------------
  #
  # THIS CHECK IS EXPECTED TO FAIL, and it is advisory so that it reports the
  # gap on every run without blocking work on a defect nobody has fixed yet.
  #
  # R17 says the gate shall block a publishing command UNTIL A PERSON DECIDES.
  # The gate implements blocking and implements no deciding: 14 consent signals
  # were tried and none lifts the block. So the only route left is retyping the
  # command, which the gate's own closing paragraph argues against - it
  # describes the failure it causes. Tracked as B30.
  #
  # CORRECTED 2026-09-06, measured. The paragraph above is kept because its FACTS
  # still hold - 14 agent-writable consent signals were tried and none lifts the
  # block - but the CONCLUSION drawn from them was wrong, and this comment went on
  # asserting it long after it stopped being true. It read: "The gate implements
  # blocking and implements no deciding" and "It carries NO coverage claim". Both
  # are false against this file's own contents: the block below declares R17
  # verdict Covered, and the deciding half IS implemented - a recognised publish
  # carrying a fresh, command-matching checklist returns permissionDecision `ask`,
  # handing the decision to a prompt the gated process can neither draw nor answer.
  # That is deciding by ESCALATION rather than by a signal, which is why no signal
  # lifting the block was ever evidence against it.
  #
  # Found by an agent correcting the same defect class in two script headers, one
  # file over. A comment that contradicts the declaration beneath it is a second
  # source of truth, and this one was wrong long enough to be quoted as current.
  - id: publish-gate-decides
    why: the deciding half is the one an agent could forge, so it is asserted by construction - a signal the agent can write must never turn a publish into allow
    when:
      always: true
    severity: block
    requires:
      - ./plugins/productizer/skills/spec/scripts/check-untrusted-execution.sh
      - python3
    version_command: [./plugins/productizer/skills/spec/scripts/check-untrusted-execution.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/check-untrusted-execution.sh, --assert, r17-decision]
    timeout_seconds: 120
    exit_codes:
      pass: [0]        # the gate hands the decision to a person and refuses where it cannot
      fail: [1]        # no route to a person, or a forgeable signal opened it
      refused: [2]
    coverage:
      spec_units:
        - id: R123
          verdict: Covered
          evidence: >-
            Both halves asserted by construction. BLOCK: 30 refused rows and 14 allowed, so a gate
            that blocked everything would fail too. DECIDE: a recognised publish with a fresh,
            command-matching checklist returns permissionDecision `ask`, handing it to a prompt the
            gated process cannot draw or answer; none of 14 agent-writable signals turns a publish
            into `allow`; and a mode the documentation does not promise a prompt in gets the hard
            refusal. Each falsified separately - including one that first passed for the wrong
            reason and was fixed.
      from: stdout_paths
      pattern: '^(\S+)$'
      must_cover: none
      min_covered: 1
    limitations:
      - It drives the SHIPPED template, not this repo's installed hook. The two were identical and drifted the moment one was edited; nothing asserts they stay in sync. Tracked as B33.
      - It cannot prove a human actually sees the prompt. It proves the gate hands the decision to the harness and refuses everywhere the documentation does not promise a prompt. What the harness then does is the harness's contract, not this check's.

  # --- an unreachable spec home must stop the lifecycle ---------------------
  #
  # R19 had no check. The acceptance table pointed at `check-spec-home.sh`,
  # whose own header says it asserts R1 - and measured, an unreachable spec
  # home produced BYTE-IDENTICAL output and the same exit code whether nothing
  # had been classified or a classification had been recorded from a remembered
  # copy. Its verdict is independent of whether R19 was obeyed.
  #
  # `classification-provenance` cannot own it either: it reads the spec first
  # and exits 2 the moment the home is unreachable, so the one situation R19 is
  # about is the one it refuses to render a verdict in.
  #
  # Four constructed trees. Cases 01 and 02 are the SAME tree differing only in
  # whether one classification record exists - the two-tree experiment, made
  # standing. The negative controls matter as much: a detector that fired on
  # any record, or on unreachability alone, would pass the positive cases.
  - id: spec-home-stop
    why: an unreachable spec home is exactly when a classification is worth least and easiest to make anyway, and nothing asserted the stop
    when:
      always: true
    severity: block
    requires:
      - ./plugins/productizer/skills/spec/scripts/check-spec-home-stop.sh
      - python3
    version_command: [./plugins/productizer/skills/spec/scripts/check-spec-home-stop.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/check-spec-home-stop.sh]
    timeout_seconds: 60
    exit_codes:
      pass: [0]
      fail: [1]        # an unreachable home no longer stops a classification, or the detector fires where it must not
      refused: [2]     # no fixture, a case whose premise did not hold, or an assertion no case exercised
    coverage:
      spec_units:
        - id: R19
          verdict: Partial
          reason: >-
            Asserts the obligation over four constructed trees and a built history. STATE: an
            unreachable home with nothing classified is clean, the same tree with one record is a
            finding, a record that cannot name its spec commit is a finding, a reachable home with a
            well-formed record stays clean. TIMELINE, which 1.0 could not read: a record committed
            BEFORE the commit that broke the home is spared and one committed AFTER is not - by
            ancestry, not dates, because committer clocks disagree and rebases rewrite them. Each
            falsified alone against its own single-record history; a two-record history would have
            let one number stand for two readings. A shallow clone is refused. It now also runs its
            detector over THIS repository rather than only its fixtures. What is NOT asserted: this
            repository's home is reachable, so R19's trigger never fires here and the run renders NO
            verdict on whether this repository would stop - it says so rather than holding
            vacuously.
      from: stdout_paths
      pattern: '^(\S+)$'
      must_cover: none
      min_covered: 15
    limitations:
      - It observes records, never the act of classifying. The writer's refusal path is the other half of the mechanism.
      - Reachability is decided locally. A home unreachable for a reason only the network could report reads as reachable here.
      - Running as a user who can read anything defeats the unreadable-spec and unlistable-store premise guards, as it defeats every such test.

  # --- an installed executable must still be its template -------------------
  #
  # The publish gate exists twice: the template every repo installing this
  # plugin receives, and this repo's own copy under `.claude/hooks/`. They were
  # byte-identical and nothing said so. Editing one drifted them instantly, and
  # the drift stayed invisible until a check that drives the TEMPLATE failed
  # against a fix that had only landed in the hook.
  #
  # The dangerous direction is the reverse: this repo hardening its own gate
  # while every consumer keeps the weaker copy, with the suite green because it
  # only ever tests the template.
  #
  # SEEDS ARE NOT COMPARED, deliberately. `templates/` also holds spec.md,
  # backlog.md, config.json, constitution.md and checks.yaml, which are copied
  # once and then edited - they differ from their template the moment the repo
  # is used, and comparing them would go red on five files for doing exactly
  # what they are for. Only executables landing under the hooks directory are
  # compared: a hook is code, not a seed, and carries no per-repo edit.
  - id: installed-copies
    why: a gate hardened in one copy and not the other leaves every consumer running the weaker one, and the suite stays green because it tests only the copy that changed
    when:
      always: true
    severity: block
    requires: [./plugins/productizer/skills/spec/scripts/check-installed-copies.sh]
    version_command: [./plugins/productizer/skills/spec/scripts/check-installed-copies.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/check-installed-copies.sh]
    timeout_seconds: 60
    exit_codes:
      pass: [0]
      fail: [1]        # a copy drifted, or lost its executable bit
      refused: [2]     # a missing directory, an unreadable file, or no pair to compare
    coverage:
      from: stdout_paths
      pattern: '^(\S+)$'
      must_cover: none
      min_covered: 2
    limitations:
      - It compares only `*.sh` under the hooks directory. A template installed anywhere else, or under a different name, is not seen.
      - It asserts the two copies AGREE, never that either is correct. Both being wrong in the same way passes.

  # --- a classification that changed the spec and left no record -------------
  #
  # R32, the narrowed R7. THE TRIGGER IS THE HARD HALF and it is STRUCTURAL: an
  # id appeared, a requirement went superseded or withdrawn, or the counter
  # moved - each measured against the previous commit that touched the spec.
  #
  # A word-only spec commit - typo, reword, reflow - is NOT a classification and
  # no row is demanded for it. Measured on this repo: of 11 post-founding spec
  # commits, 4 are structural and 7 are word-only, so a text-diff trigger would
  # have demanded 11 rows and been wrong 7 times. A check that goes red on the
  # next typo is a check somebody switches off. Both lists print on every run,
  # so the LIST can be argued with rather than the verdict.
  #
  # THE FIRST VERSION OF THIS CHECK WAS WRONG AND ITS OWN FIXTURE CAUGHT IT.
  # It asked whether some row named one of the moved ids, and passed a history
  # where a commit superseded one requirement, added another, and wrote no row
  # at all - because a much older row happened to name that id for a different
  # event. Every id reaches the log eventually, so "named anywhere" converges on
  # "always satisfied". It now matches in the COLUMN for that kind of change.
  - id: changelog-row
    why: a requirement that moved with no change-log row has no join to the commit, branch or issue that moved it, and nobody can reconstruct one a year later
    when:
      always: true
    severity: block
    requires:
      - ./plugins/productizer/skills/spec/scripts/check-changelog-row.sh
      - ./plugins/productizer/skills/spec/scripts/spec-requirements.sh
      - git
      - python3
    version_command: [./plugins/productizer/skills/spec/scripts/check-changelog-row.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/check-changelog-row.sh]
    timeout_seconds: 120
    exit_codes:
      pass: [0]
      fail: [1]        # a spec-changing classification with no row recording it
      refused: [2]     # a shallow clone, an untracked spec, a one-commit history, a counter-only commit
    coverage:
      spec_units:
        - id: R32
          verdict: Partial
          reason: >-
            Asserts the CONSEQUENCE completely and the TRIGGER partially. Every commit at which an id
            appeared or a requirement went superseded or withdrawn is checked for a row recording
            that id in the column for that kind of change, in the commit that made the change - four
            assertions, each falsified alone. A fifth is REPORTED and never demanded: a requirement
            whose id and status are unchanged and whose sentence changed is a refine landing, and it
            is character-for-character the same event as a typo fix. It is listed by location, called
            RESOLVED when a `Refined` entry names it at that commit, and sets no exit code. That is
            measured rather than conceded: this repository's entire spec history holds ZERO in-place
            requirement rewrites - a synthetic history proves the detector works, so the zero is
            measured and not a broken probe - and the only in-place rewrite committed anywhere here
            is the fixture that exists to be the anti-cry-wolf control. There is no evidence base for
            the refine-to-typo ratio, so demanding a row would be a rule with nothing behind it.
      from: stdout_paths
      pattern: '^(\S+)$'
      must_cover: none
      min_covered: 3
    limitations:
      - A refine that keeps a requirement's id and rewrites its sentence is not detected, on purpose - no evidence in the repository separates it from a typo fix.
      - A shallow clone is refused rather than passed, so CI must fetch full history for this to measure anything.
      - Attribution is by ID, never by date; the change-log dates in this repo already disagree with the commit dates by a day.
      - The founding commit is exempt - it introduced every id it holds at once, and demanding rows for those would go permanently red against this repo's own correct spec.

  # --- a view that could republish itself must not reach the publish step ----
  #
  # R31's obligation is that the lifecycle REFUSES TO PUBLISH. `view-read-only`
  # observes the page not ASKING, which is a different sentence. Until
  # `artifact-gate.sh` there was no refusal to observe at all: an artifact is
  # published through the Artifact tool, and `publish-gate.sh` is registered on
  # the Bash matcher, so it never saw one. R31 was not merely unverified - half
  # of it did not exist, exactly as R17 was this morning.
  #
  # This drives the real hook with fixture payloads, watches it decline, and
  # then checks that the hook it drove is the one `settings.json` actually wires
  # to that tool. Nothing is ever published.
  #
  # THE STALE-COPY CASE IS THE ONE WORTH HAVING. Point the registration at a
  # real, executable, correctly-registered hook that happens to be the WRONG
  # FILE and the first five groups stay green while A6 names it: the gate gets
  # hardened, the registration keeps pointing at the old file, and every
  # assertion above measures something the harness will not run.
  - id: view-publish-refused
    why: a page that can save new versions of itself is a second source of truth that can disagree with the repo; the only place a capability GRANTED BY THE PUBLISH CALL is visible is the publish call, and a correct gate nothing invokes is not a gate
    when:
      always: true
    severity: block
    requires:
      - ./plugins/productizer/skills/spec/scripts/check-view-publish-refused.sh
      - jq
    version_command: [./plugins/productizer/skills/spec/scripts/check-view-publish-refused.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/check-view-publish-refused.sh]
    timeout_seconds: 60
    exit_codes:
      pass: [0]
      fail: [1]        # a publish that had to be refused was not, one that had to go through did not, or the registered hook is not the one driven
      refused: [2]     # no hook, no fixture, an unreadable settings file, or a premise never exercised
    coverage:
      spec_units:
        - id: R31
          verdict: Partial
          reason: >-
            Drives the real PreToolUse hook and asserts it REFUSES - R31's obligation, and the half
            nothing observed before. Both surfaces: the capability asked for inside the page, and the
            one granted by the publish CALL, which `view-read-only` states it cannot see. Eight
            assertion groups, each falsified separately against patched copies of the hook and of
            settings.json, on macOS/BSD and under GNU coreutils.
            A6 asserts the WIRING - settings.json names this hook, the named file exists, is
            executable, and is byte-identical to the one driven. A7 asserts the FIRING, which was
            previously argued to be unprovable: the gate records every decision to an uncommitted
            JSON-lines file, and a real dashboard publish produced `decision: allow, action: publish`
            - the Artifact tool does invoke this hook. A8 asserts the recorder from the other end, so
            a recorder that silently stopped is a finding rather than an A7 that reads `nothing has
            published yet` forever.
            WHAT THE EVIDENCE DOES NOT COVER, printed on every run: every record is a publish the gate
            ALLOWED, so it shows the tool invokes the hook and not that it would invoke it for a
            publish the hook would REFUSE - only a recorded deny settles that, and one appears only if
            a forbidden publish is attempted. A record proves the hook ran, not who ran it. Where no
            publish has happened the firing is UNASSERTED and says so rather than refusing: a clone
            that never publishes cannot observe it, and a permanent blocking refusal there is a gate
            people route around. And a capability granted by an earlier publish and inherited by a
            later call that omits `capabilities` is held by the publishing service, not this repo.
      from: stdout_paths
      pattern: '^(\S+)$'
      must_cover: none
      min_covered: 1
    limitations:
      - It asserts the wiring, not the firing. A6 proves settings.json names this hook and that the named file is the one driven; nothing proves the Artifact tool invokes it, which would take a real publish.
      - The matcher must be spelled exactly `Artifact`. A harness that also honours a regex spelling such as `Artifact|Bash` would be correctly wired and reported here as a finding - loud rather than silent, since the finding names the matcher it did find.
      - The capability taxonomy is duplicated between this hook and check-view-readonly.sh. A name classified in one and not the other lets the two disagree about what a view may declare, and nothing detects that today.

  # --- a waiver changes the verdict, never the measurement ------------------
  #
  # R37 and R38, from intent #7. A ruling already records that a person
  # overruled a failing check; what the CHECK shows afterwards was never
  # decided. Intake split it because the rendering and the FORMAT that records
  # the waiver are two obligations.
  #
  # P1 DECIDES THE DESIGN. An overridden check WAS measured, so P1 does not
  # forbid a waiver - but a failure rendered green because somebody said so is a
  # judgment wearing a measurement's clothes. So `status` stays `fail`, the
  # findings stay, coverage stays, and only the BLOCKING and the RENDERING move.
  # A waived check that comes out `pass` anywhere is the defect this exists to
  # prevent, and the check asserts that per case.
  #
  # P4 DECIDES THE DEFAULT. Waivers live in the repository, and a clone that can
  # waive its own blocking checks has arrived with its gates disarmed. So
  # `policy.waivers` is absent by default and the directory is never opened
  # without it - the same shape as `allow_repo_local_tools`. Measured: the same
  # waiver file on disk, one config line apart, is exit 0 waived and exit 3
  # unwaived. A waiver also expires, selects nothing (its `Check:` is only ever
  # compared to declared ids), and its authority is a label rather than a
  # credential - untrusted text, never executed or resolved.
  #
  # AND A WAIVER DOES NOT WAIVE THE SPEC. The waived check is still `fail`, so
  # its coverage claims stay voided and the requirement returns to `Missing`;
  # under `spec_coverage: require` the run still refuses - on the denominator,
  # not on the check. That is deliberate: a person may accept a failing check,
  # not un-assert a requirement.
  - id: waiver-rendering
    why: a waiver implemented as "set the status to pass" satisfies every casual reading of R38 and produces the hollow green this stage exists to refuse; and a runner honouring waivers without an opt-in lets a cloned repo arrive with its gates disarmed
    when:
      always: true
    severity: block
    requires:
      - ./plugins/productizer/skills/spec/scripts/check-waiver-rendering.sh
      - python3
    version_command: [./plugins/productizer/skills/spec/scripts/check-waiver-rendering.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/check-waiver-rendering.sh]
    timeout_seconds: 180
    exit_codes:
      pass: [0]
      fail: [1]        # a waiver is no longer treated the way R37 and R38 require
      refused: [2]     # no fixture, no runner, or a premise that did not hold
    coverage:
      spec_units:
        - id: R37
          verdict: Covered
          evidence: >-
            Drives a committed fixture through the real run-checks.sh, ten runs, one verdict each.
            A waiver missing `Check`, `Authority`, `Reason` or `Expires` is reported malformed
            NAMING THE ABSENT FIELD and is not honoured - one case per field, so a regression names
            which field stopped being required. A waiver naming a check the config does not declare
            is `unknown_check`, and the unrecognised id is asserted NOT to be quoted back, because
            it is text from the repository. Two waivers over one check are `duplicate` and neither
            is honoured. Falsified: dropping `Reason` from the required fields takes that case from
            8 of 8 to 1 of 8; removing the duplicate guard silently honours the first waiver.
        - id: R38
          verdict: Covered
          evidence: >-
            Asserts per case that the waived check's recorded status is `fail` and NOT `pass`, that
            its line reads FAIL and waived rather than PASS, that the waiver sits BESIDE the
            unchanged failure in the result, and that the run exits 0 rather than 3. The unwaived
            twin - same failing check, same waiver file still on disk, one config line apart - is
            asserted to exit 3 and render plain FAIL, which is P4's default-off half. Expired,
            malformed, unknown and passing-check waivers each soften nothing. Falsified: making the
            honoured branch also write `status = pass` takes the waived case from 8 of 8 to a
            failure; giving `policy.waivers` a default breaks the unwaived case; removing the
            expiry comparison breaks the expired one.
      from: stdout_paths
      pattern: '^(\S+)$'
      must_cover: none
      min_covered: 24
    limitations:
      - The `unreadable` waiver state and the unlistable-directory warning have no fixture; both need an I/O failure that does not survive a checkout.
      - Only the `pass` leg of `not_applicable` is driven. The cannot-run statuses, `hollow`, `disabled`, `not_triggered` and `advise` share one branch that was read rather than measured.
      - >-
          Every fixture switches spec coverage off, so the interaction where a waived `fail` still
          voids its own coverage claims and refuses under `require` is documented but not driven.
      - Someone who can land a commit in a repo that has already opted in can waive that repo's own check until the expiry - the same power as editing checks.yaml, visible in the diff and bounded by a date.

  # --- a requirement sentence rewritten under live citations ------------------
  #
  # The gap the incumbents close and this repository did not. Permanent ids
  # (R2) are why a citation survives; they are also why it can go quietly
  # wrong. Rewrite an ACTIVE requirement's sentence in place and its id still
  # resolves, its status is unchanged, its acceptance-criteria row still names
  # a check written against the old wording, and that check's coverage claim
  # still reads Covered. Nothing errors and nothing is red.
  #
  # DOORS marks every linked object suspect on change. OpenFastTrace puts a
  # revision inside the id so bumping it voids the links - unavailable here,
  # because that is a renumbering with a nicer name and R2 forbids it. This
  # takes DOORS' half: the id stays permanent, and the change raises a flag.
  # `Productizer-Req:` trailers record which requirement a commit served, which
  # is provenance; provenance invalidates nothing.
  #
  # NOT superseded-text's job, and the two must not be collapsed. A supersede
  # or a withdrawal leaves a forward pointer and a retained sentence, so the
  # citation still leads somewhere a reader can follow. A rewrite in place
  # leaves nothing at all. The check reports the two counts separately and
  # falsifying proved the branch load-bearing: removing it turns a supersede
  # into three false suspect findings.
  #
  # `advise`, AND THAT IS THE HONEST SETTING. It cannot tell a typo fix from an
  # inversion - `recieve` to `receive` and `shall` to `shall not` are one
  # measurement - and it says so on every run. A gate that holds the merge on a
  # distinction it cannot make is one people route around, and a routed-around
  # gate measures nothing. Exit 2 still blocks whatever the severity says,
  # which is the right asymmetry: a flag you can disagree with is cheap, and
  # not knowing is not.
  #
  # `spec_units` ARRIVED WITH R41, AND ONLY THEN. This block used to say NO
  # spec_units deliberately - "a mechanism the spec has not asked for; when it
  # does, the claim goes here". R41 asked for it on 2026-09-06, in almost this
  # check's words: an active requirement's sentence rewritten in place, and
  # every artifact citing it whose own line has not changed since that rewrite
  # reported suspect. So the claim goes here, and it is `Partial` rather than
  # Covered for a reason this check already declared in its own limitations
  # BEFORE the requirement existed: it compares against ONE base ref. R41 says
  # "since that rewrite", which is a baseline PER REQUIREMENT at the commit
  # that requirement's sentence last changed. A rewrite behind the single base
  # ref reads here as the agreed text and raises nothing - demonstrated
  # 2026-09-05 and written into R41's own acceptance row. Claiming Covered
  # would put a verdict on the half this check is blind to.
  #
  # min_covered: 2 - the spec now AND the spec at the base. One covered path
  # means one version was read and the other was not, which is the run that
  # compares nothing while exiting 0.
  - id: suspect-links
    why: a requirement's sentence can be rewritten in place with its id and status untouched, and every acceptance row, coverage claim and downstream citation keeps resolving to wording nobody re-read
    when:
      always: true
    severity: advise
    requires:
      - ./plugins/productizer/skills/spec/scripts/check-suspect-links.sh
      - ./plugins/productizer/skills/spec/scripts/spec-requirements.sh
      - git
    version_command: [./plugins/productizer/skills/spec/scripts/check-suspect-links.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/check-suspect-links.sh]
    timeout_seconds: 120
    exit_codes:
      pass: [0]
      fail: [1]        # a sentence moved under a citation whose own line did not
      refused: [2]     # no base, a shallow clone, a spec absent at the base, or a spec with no requirements
    coverage:
      spec_units:
        - id: R41
          verdict: Partial
          reason: >-
            IT COMPARES AGAINST ONE BASE REF, and R41's "since that rewrite" needs a baseline
            PER REQUIREMENT, at the commit that requirement's own sentence last changed. A
            sentence rewritten BEFORE the base reads here as the agreed text and raises nothing,
            so every artifact citing it stays unflagged. Demonstrated 2026-09-05 on a constructed
            history and recorded in R41's acceptance row: with the default base the run exits 0
            PASS reporting `sentence changed in place: 0` while a stale acceptance row goes
            unreported, and the same tree with a base behind the rewrite exits 1 and flags it.
            Two narrower gaps are unasserted too: clearing is per LINE, so a coverage claim whose
            `- id: Rn` line never moves stays flagged when only the evidence beside it was
            rewritten, and a citation naming no id - a paragraph quoting the sentence - is
            invisible. Fixture and eval trees are excluded by path.
          evidence: >-
            Within one base ref it asserts the whole of R41's sentence. It resolves every active
            requirement at HEAD and at the base, reports as `sentence changed in place` only
            those whose id AND status are unchanged and whose normalised sentence moved - a
            supersede or a withdrawal is routed to check-superseded-text.sh and counted
            separately - then finds every tracked file citing a moved id and reports as SUSPECT
            each citation whose OWN LINE did not change in the same range. Per-line clearing is
            the load-bearing part and was found by running the fixture, not by reading: the
            first version asked whether the FILE had been edited and cleared the
            acceptance-criteria row - the primary dependant - because it lives in the spec, the
            one file a rewrite guarantees was touched. An empty comparison is exit 2 in four
            distinct ways and never a pass.
      from: stdout_paths
      pattern: '^(\S+)$'
      min_covered: 2
    limitations:
      - It cannot tell a semantic rewrite from a typo fix. It measures that words moved, never what they now mean, and prints that limitation on every run.
      - An id inside a template or an example is indistinguishable from a citation of it.
      - It compares against ONE base ref. An active requirement rewritten before that ref reads as the agreed text, and nothing here covers that - superseded-text covers the same blindness for superseded ids only.
      - Fixture and eval trees are excluded because they carry their own specs with their own numbering. Measured on this repo, 81 tracked files match R3 and 19 are outside those trees.
      - Clearing is per line, so a coverage claim's `- id: Rn` line never moves and the claim stays flagged when only the evidence beside it is rewritten. The finding says the file was edited, which is the triage signal, not a clearance.
      - A citation that names no id - a paragraph quoting the sentence - is invisible.

  # --- a citation this change writes that resolves to nothing -----------------
  #
  # B90, R52/R53. Adapted from the DANGLING_REF rule of the AI Unified Process
  # (Apache-2.0, by Simon Martinelli); the idea is theirs, the code is not.
  # Diff-scoped: it reads only the lines a change ADDS, because a citation
  # already in the tree at the base is drift-reverse.sh's business, and a check
  # that repeats the same rows on every change is one people stop reading.
  #
  # ADVISE, AND THE NUMBER THAT SAYS WHY. Replayed over every commit in this
  # repository against its parent on 2026-10-10: 132 in history, 109 measurable,
  # 25 fired with 92 findings, and none of the 92 was a citation anybody meant,
  # by a by-hand reading recorded in references/traceability.md. Finding
  # precision on this history is zero. Replayed again 2026-10-12: 139 in
  # history, 116 measurable; 1.0 fired on 27 with 94 findings, 1.1 on 26 with
  # 91. That figure cannot change - the commits are made. The remedy is the
  # EXAMPLE marker, and since v4.68.0 every example id in the tree is inside
  # one or is R0: a change adding every tracked file reads 0 findings, where it
  # read 20 (B101). Blocking stays unearned until changes made after that give
  # the check a precision of its own.
  - id: dangling-citations
    why: a citation of an id the spec does not hold reads exactly like provenance, and nothing checked that a new one resolves at the moment it is written
    when:
      always: true
    severity: advise
    requires:
      - ./plugins/productizer/skills/spec/scripts/check-citations.sh
      - ./plugins/productizer/skills/spec/scripts/spec-requirements.sh
      - ./plugins/productizer/skills/spec/scripts/req-trailer.sh
      - git
    version_command: [./plugins/productizer/skills/spec/scripts/check-citations.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/check-citations.sh, --base, "{base}"]
    timeout_seconds: 180
    exit_codes:
      pass: [0]
      fail: [1]        # at least one FINDING: an added citation the spec does not hold, or a trailer naming one
      refused: [2]     # no base, an unresolvable ref, a shallow clone missing the base, or a spec with no requirements or no counter
    coverage:
      spec_units:
        - id: R52
          verdict: Partial
          reason: >-
            It reads only ADDED lines, so a citation already in the tree at the base is not
            examined. A citation is a TOKEN - `R` and digits - so an example id outside an
            EXAMPLE block is indistinguishable from a real one: replayed over 116 measurable
            commits of this repository's history 1.1 fired on 26 with 91 findings, and a by-hand
            reading found none of them was a citation anybody meant. Since v4.68.0 every example
            id in the tree is marked or is R0, so a change adding every tracked file reads 0
            findings; what the precision is on changes made after that is not yet measured.
            Fixture and eval trees, the spec, the constitution and the generated requirement index
            are not read; the backlog is, since 1.2. Replayed over this repository's history, 1.1
            fired on 26 commits with 91 findings and 1.2 on 27 with 94; the three new findings are a
            forward citation of R32 and an illustrative R42 read twice.
          evidence: >-
            Every requirement id on an added line is resolved against the spec at HEAD through
            spec-requirements.sh. An id at or above `Next requirement id` is
            CITATION_NEVER_ALLOCATED and one below it with no row is CITATION_ALLOCATED_MISSING;
            every commit trailer in the range goes through `req-trailer.sh --validate`. 31
            self-test cases over exit codes 0 1 2, each asserting a sentence. `R0`, the reserved
            example id, prints as an EXAMPLE line; an id with a leading zero is
            CITATION_NEVER_ALLOCATED; an id beside a multibyte character, read under a UTF-8
            locale, is read and not refused (`utf8-neighbour`, exit 2 on the BSD awk before every
            awk here read bytes).
        - id: R53
          verdict: Partial
          reason: >-
            The supersede chain is asserted only when it ends at an active requirement. A withdrawn
            id, and a chain that ends anywhere else, print a note saying where the chain ended and
            are driven by no self-test case. Same token and added-lines limits as R52.
          evidence: >-
            A new citation of a superseded id prints `NOTE CITATION_SUPERSEDED <path>:<line> <id> ->
            <id>`, following `Superseded by` to the requirement that stands now; the `superseded`
            self-test case asserts `R1 -> R4`. A note does not change the exit code.
        - id: R93
          verdict: Partial
          reason: >-
            The check is advisory, so a dangling id on an added backlog line is reported and does not
            refuse the change. Only ADDED lines are read: a line rewritten in place is read as added,
            and a line already in the backlog at the base is not examined.
          evidence: >-
            Since 1.2 the backlog is read like any other file. `backlog` exits 1 naming
            `CITATION_NEVER_ALLOCATED .claude/productizer/backlog.md:2` for an appended row citing an
            id never allocated; `backlog-rewritten` exits 1 reading only the one line that changed;
            `backlog-r0` exits 0 printing R0 as an EXAMPLE. Falsified 2026-10-12 with the backlog
            excluded again, as 1.1 did: 28 of 31, those three red.
      from: stdout_count
      pattern: 'requirements resolved against:\s*([0-9]+)'
      min_covered: 1
    limitations:
      - On this repository's history the precision of a finding is zero - 91 findings over 26 of 116 measurable commits under 1.1, none a citation anybody meant - and it cannot change. Since v4.68.0 every example id in the tree is marked or is R0 (0 findings on a change adding every tracked file); a precision on changes made after that is not yet measured.
      - req-trailer.sh reads the spec through its own id pattern, not spec-requirements.sh, so the two halves of this check can disagree about an id that is bold outside the `## Requirements` section.
      - One spec path. A spec split across files reads as missing requirements.

  # --- a stage that moves on nothing, backwards, or over its own rules --------
  #
  # B91, R54, R55 and R63 (which superseded R56 in v4.67.0, B110); B116, R66 (v4.67.1); B106, B114, B117 and B120, R72-R77 (v4.68.0). Adapted from the forward-only, rank-gated status advance in the
  # AI Unified Process (Apache-2.0, by Simon Martinelli); no code is copied. The
  # forbidden-path rule is this repository's own.
  #
  # DECLARED AS ITS SELF-TEST, the way solver-corpus declares
  # contradiction-check.py's: the guard is a pure decider over one stage move,
  # and no change to this repository IS a stage move, so the verdict a commit
  # can return is whether the decider still decides correctly. ONE CALLER, AND
  # IT IS NOT A TRACKER: since v4.67.0 build-dispatch.sh asks it before
  # delivering an unattended run's patch. No tracker move invokes it, so for a
  # ticket R54, R55 and R63 are Covered as properties of the tool and not yet
  # as a step anybody takes (B91).
  #
  # 1.1 IS A SECURITY FIX (B110). 1.0 read the changed paths out of the patch's
  # `diff --git` headers with awk, and git writes the paths it APPLIES: nine
  # reproductions had 1.0 allow a patch while git wrote a workflow or
  # checks.yaml. 1.1 applies the patch to a scratch index and reads git's own
  # answer, and refuses `.github/**`, `.claude/**` and the other files that
  # steer CI or an agent by default. The broken 1.0 is in v4.66.0 (f1f44f3),
  # which was never pushed.
  - id: stage-advance-guard
    why: a stage that moves on a run that produced nothing, backwards, or over a change to the rules it is judged by is a status that lies, and every tracker move reads it
    when:
      always: true
    severity: block
    # The script itself as argv[0], never `bash <script>`: run-checks.sh refuses
    # a program that takes a command as an operand in any argv position (R29),
    # and it refused the `bash` form this entry was first written with.
    requires: [./plugins/productizer/skills/spec/scripts/stage-advance.sh, ./plugins/productizer/skills/spec/scripts/argv-classify.py, git, python3]
    version_command: [./plugins/productizer/skills/spec/scripts/stage-advance.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/stage-advance.sh, --selftest]
    timeout_seconds: 180
    exit_codes:
      pass: [0]
      fail: [1]        # a case did not produce the exit code it declares
      refused: [2]
    coverage:
      from: stdout_count
      pattern: '([0-9]+) of [0-9]+ cases held'
      min_covered: 1
      spec_units:
        - id: R54
          verdict: Covered
          evidence: >-
            Exit 1, PRODUCED NOTHING: the `bookkeeping-only` and `empty-patch` cases - a change
            touching only stage snapshots, the checks result file or classification records, and
            an empty one - exit 1, and so does a design advance whose only change is whitespace.
        - id: R55
          verdict: Covered
          evidence: >-
            Exit 5, NOT A FORWARD MOVE: the `backward-move`, `same-stage` and `order-from-config`
            cases exit 5, the last reading the stage order from config.json rather than from the
            script.
        - id: R63
          verdict: Covered
          evidence: >-
            Exit 3, FORBIDDEN PATH, judged on the paths git applies: the `diff-*` cases exit 3 on
            patches whose headers name an allowed file while git writes a workflow or checks.yaml,
            a renamed path among them (`diff-header-names-differ`, `diff-rename-into-forbidden`);
            the `rule-*` cases exit 3 on a composite action, agent, command and skill
            definitions, CLAUDE.md at any depth, .mcp.json, .gitattributes, config.json and case
            variants such as `.GitHub/workflows`; `workflow-forbidden`,
            `build-mode-spec-forbidden` and `plan-mode-code-forbidden` still exit 3, and
            `backlog-allowed` and `build-mode-code-allowed` exit 0, so the rule is not refusing
            everything. 129 cases since 1.4.
        - id: R66
          verdict: Covered
          evidence: >-
            Exit 3, a DELETION of the lifecycle's own bookkeeping refused: the
            `bk-delete-record-refused` case removes a committed classification and adds a real
            `plan.md`, and exits 3 so the real evidence cannot launder the deletion past.
            Bookkeeping ADDED stays R54's PRODUCED NOTHING case; a snapshot or classification
            MODIFIED is R76's. Falsified 2026-10-11 by making the decider stop tracking a
            deletion: `bk-delete-record-refused` went from exit 3 to exit 0.
        - id: R72
          verdict: Covered
          evidence: >-
            Exit 1 in build mode when nothing changed outside `artifacts.path`:
            `build-mode-test-only-plan` and `build-mode-artifacts-variant-not-evidence` (a case
            variant of the artifacts directory is not outside it) exit 1; `build-mode-test-code`
            exits 0, and `no-mode-test-plan-counts` exits 0, so the rule is build mode's and not
            every move's. Falsified 2026-10-12 with `if false` on the build-mode branch: 96 of 99,
            3 cases red.
        - id: R73
          verdict: Covered
