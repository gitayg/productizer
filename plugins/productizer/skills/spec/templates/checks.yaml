# .claude/productizer/checks.yaml — the checks stage, declared.
#
# Security and quality checks are a configured stage, not a list baked into the
# tool. This file is the whole declaration; `scripts/run-checks.sh` only obeys
# it. Adding, removing or re-scoping a check is a pull request against this
# file, reviewed like code.
#
# WHO OWNS IT. One named person accountable for the checks stage — a security
# or engineering manager. Not the agent, and not whoever is shipping today. An
# owner who can be persuaded to loosen a check mid-change is not a gate.
#
# DATA ONLY, NEVER A COMMAND LINE. Every `command` is an argv list, never a
# string. A string would be handed to a shell, and this file is committed, so
# anyone who can land a commit would then be choosing what executes on the
# machine of whoever pulls it. The runner refuses a string.
#
# THE ONE RULE THIS FILE EXISTS TO ENFORCE:
#
#     A CHECK THAT EXAMINED NOTHING IS A FAILURE, NOT A PASS.
#
# Every check declares what it must have covered. The runner measures what it
# actually covered and fails the check when the two disagree — whatever exit
# code the tool returned. A scanner that grades A while opening one file out of
# thirty-three is the failure being prevented; `references/checks.md` sets out
# that case in full.
#
# THE SECOND RULE, WHICH CLOSES THE HOLE IN THE FIRST:
#
#     THE DENOMINATOR COMES FROM THE SPEC, NOT FROM THE CHECK.
#
# `coverage` says what a check must have examined — and the check author writes
# it, so a check can shrink its own scope and still pass honestly. The unit list
# under `coverage.spec_units` is therefore measured against the requirements
# enumerated from `policy.spec`, not against anything in this file. Drop a unit
# from a check's list and it does not leave the denominator: it turns up as
# `Missing` and the run refuses.
#
# Every active requirement gets a row in the result, the covered ones included.
# A report that lists only the failures leaves the reader supplying their own
# denominator, which is the same mistake in a different place.
#
# TEAM-LEVEL SETTINGS ARE NOT LOCALLY OVERRIDABLE.
#
# A `checks.local.yaml` beside this file may say `timeout_seconds`, because a
# slow laptop is nobody else's business. Everything else here — severity, when,
# coverage, commands, every `policy` key — decides what gets examined and
# whether the run blocks, which is what everyone downstream reads out of
# `checks-result.json`. Those are honoured only from this committed file. A
# local copy supplying one is ignored, with a warning naming it on stderr.
#
# AND: a config in which every check is `enabled: false` is a load error, not
# a clean pass. A configuration with no active verification refuses to load
# rather than exit 0 having verified nothing.
#
# ---------------------------------------------------------------------------
# THIS IS A TEMPLATE. AN UNEDITED COPY CHECKS AN IMAGINARY REPO.
#
#   1. Delete the checks whose tools you do not run. A declared tool that is
#      not installed fails the run; it is never skipped.
#   2. Run it once and read the coverage line of every check. A scanner
#      reporting one file out of thirty-three has found you a bug in your
#      checks stage, not a green build.
#   3. Break each check on purpose — plant a fake key, add an unquoted
#      variable, pin a vulnerable dependency — and watch it go red before you
#      believe it. A check never observed failing is decoration.
#   4. Confirm the exit codes below against the builds of the tools you
#      actually have. They are the vendors' documented codes, not guesses
#      about yours, and an exit code this file does not describe is treated as
#      a failure rather than a pass.
# ---------------------------------------------------------------------------

version: 1

policy:
  # A change that triggers no check at all is not a passing change: it means
  # this file does not describe the repo. `refuse` says so out loud. `pass`
  # hides it, and is here only so a repo mid-adoption can opt in deliberately.
  empty_run: refuse

  # Where the machine-readable result lands. Stage 6 review reads this file;
  # it is the evidence that the checks stage ran and what it covered.
  #
  # This path — and every relative path in this file, including the tools named
  # in `requires` and `command` — resolves against the REPOSITORY ROOT, which
  # the runner takes from the git work tree holding this config, not from this
  # config's own directory. It prints the root it chose on every run; read that
  # line if a tool you know is installed reports as missing.
  output: .claude/productizer/checks-result.json

  # The coverage denominator, derived mechanically. Every ACTIVE requirement in
  # this file becomes one row in the result; a requirement marked superseded or
  # withdrawn is out of the denominator, because the spec says the behaviour is
  # no longer agreed. An unreadable spec, or one with no requirements in it, is
  # reported UNMEASURED and refuses — never as "0 units, all covered".
  spec: .claude/productizer/spec.md

  # `auto`     measure as soon as any check declares `coverage.spec_units`, and
  #            say plainly that nothing was measured while none does
  # `require`  always measure; a spec that cannot be read refuses the run
  # `"off"`    a committed, visible opt-out. QUOTE IT: YAML reads a bare `off`
  #            as the boolean false.
  spec_coverage: auto

defaults:
  timeout_seconds: 120
  mode: batch
  severity: block

checks:

  # --- 1 · secret scan ----------------------------------------------------
  #
  # Runs against every change, because a secret can be committed into any file
  # type — a fixture, a notebook, a README.
  #
  # Per-file invocation, deliberately. Batch mode would let the tool decide
  # which files it felt like opening and still exit 0; per-file mode makes the
  # runner watch each file be accepted or refused, so "it only looked at one of
  # them" becomes visible instead of green. It costs one process per file.
  #
  # ONE `gitleaks dir .` OVER THE TREE. Every flag below was measured on
  # gitleaks 8.30.1; what each prevents:
  #
  #   `--exit-code 3`  gitleaks exits 1 both for an error and, by default, for
  #                    a finding. With 3, a leak is 3 and 1 is an error.
  #   trace coverage   exit 0 is not "examined": an unreadable file logs `WRN
  #                    skipping file: permission denied` and exits 0. A file
  #                    counts only when trace logs `scanning path` for it and
  #                    nothing later says it was skipped.
  #   SARIF on stdout  trace prints the text of candidates gitleaks SKIPS,
  #                    unredacted despite `--redact`, and debug prints decoded
  #                    file content. The runner stores the tail of the output;
  #                    the redacted SARIF report comes last and fills it.
  #   rules_command    a `.gitleaksignore` or `.gitleaks.toml` in the scanned
  #                    tree, or GITLEAKS_CONFIG in the environment, changes or
  #                    empties what runs with no edit to this file. This counts
  #                    1 only for the default config with no ignore file, so
  #                    any of them reads 0 rules and the check is hollow. If you
  #                    need exemptions, remove the guard deliberately, here.
  #   not `{files}`    `gitleaks dir a b` does not scan both - measured, it
  #                    exited 0 with a token in one of them. And not per file:
  #                    one process per file cost about a second each under
  #                    this runner.
  #
  # `.` includes untracked and ignored files, so a local run examines more than
  # the change. `detect --no-git` is deprecated since v8.19.0.
  - id: secret-scan
    why: a secret reaching the remote must be rotated; blocking the merge afterwards fixes nothing
    when:
      always: true
    severity: block
    requires: [gitleaks]
    version_command: [gitleaks, version]
    mode: batch
    command: [gitleaks, dir, --no-banner, --no-color, --redact, --ignore-gitleaks-allow, --exit-code, "3", --log-level, trace, --report-format, sarif, --report-path, "-", "."]
    timeout_seconds: 300
    exit_codes:
      pass: [0]
      fail: [3]
      refused: [1, 126]
    coverage:
      from: stdout_paths
      pattern: '^[^\n]*(?:TRC|DBG)(?:\x1b\[[0-9;]*m)* (?:\x1b\[[0-9;]*m)*(?:scanning path|skipping empty file)(?:\x1b\[[0-9;]*m)* (?:\x1b\[[0-9;]*m)*path=(?:\x1b\[[0-9;]*m)*"?([^"\n\x1b]*[^"\s\x1b])"?(?:\x1b\[[0-9;]*m)*$(?![\s\S]*^[^\n]*(?:DBG|WRN|ERR|FTL)(?:\x1b\[[0-9;]*m)* (?:\x1b\[[0-9;]*m)*(?:skipping (?!finding|empty file)|could|issue|unable)[^\n]*path=(?:\x1b\[[0-9;]*m)*"?\1"?(?:\x1b\[[0-9;]*m)*(?:\s|$))'
      must_cover: all_triggering
      min_covered: 1
      min_rules: 1
      rules_command: [gitleaks, dir, --no-banner, --no-color, --redact, --exit-code, "0", --log-level, debug, "."]
      rules_pattern: '\A(?![\s\S]*found \.gitleaksignore file)[\s\S]*?(using default (?:gitleaks )?config)'

      # WHICH REQUIREMENTS THIS CHECK VERIFIES. Uncomment and point at ids that
      # exist in `policy.spec`; the runner refuses a claim against an id the
      # spec does not list as active, because a claim nobody can look up is not
      # coverage.
      #
      #   Covered  this check verifies the requirement       (evidence optional)
      #   Partial  part of it — say which part is missing
      #   n/a      vacuous by the spec itself — `reason` REQUIRED
      #
      # `Missing` is not claimable. It is what the runner concludes about a
      # unit nothing covered, which is the one verdict a check must not be able
      # to write about itself.
      #
      # A CLAIM IS NOT COVERAGE. Each claim is bound to this check's own result:
      # if the check is disabled, its tool is absent, it timed out, it failed or
      # it came back hollow, the claim is voided and the unit goes back to
      # Missing. A disabled, skipped or todo check covers nothing.
      #
      # spec_units:
      #   - {id: R31, verdict: Covered, evidence: "per-file gitleaks over the whole change"}
      #   - {id: R32, verdict: Partial, reason: "history is not scanned, only the working tree"}
      #   - {id: R33, verdict: n/a, reason: "concerns the deploy gate, which this stage does not run"}

  # --- 2 · shell linter ---------------------------------------------------
  #
  # Scoped by path. A change with no shell in it does not pay for this.
  - id: shell-lint
    why: an unquoted variable in a deploy script is a production incident, not a style nit
    when:
      paths:
        - "**/*.sh"
        - "**/*.bash"
    severity: block
    requires: [shellcheck]
    version_command: [shellcheck, --version]
    mode: per_file
    command: [shellcheck, --severity=warning, --format=gcc, "{file}"]
    timeout_seconds: 300
    exit_codes:
      pass: [0]
      fail: [1]           # findings at or above the severity floor
      refused: [2, 3, 4]  # could not open, could not parse, bad invocation
    coverage:
      from: per_file_exit
      # 0 = clean, 1 = findings. Both mean the file was read. Anything else
      # means shellcheck bounced off it, and a file it bounced off is not a
      # file it checked.
      examined_when_exit_in: [0, 1]
      must_cover: all_triggering
      min_covered: 1

  # --- 3 · dependency audit ----------------------------------------------
  #
  # Triggered by the manifest and lockfile, and by a requirement tagged
  # `dependency` even when the diff touches no manifest — a requirement that
  # says "adopt library X" attracts the audit before the code exists.
    limitations:
      - Runs at --severity=warning, which does NOT include SC2086, unquoted expansions. That was found when a deliberate SC2086 failed to turn the gate red.

  - id: dependency-audit
    why: a transitive advisory lands without anyone editing a file; the lockfile is the change
    when:
      paths:
        - "package.json"
        - "package-lock.json"
        - "**/package-lock.json"
      tags: [dependency, supply-chain]
    severity: block
    requires: [npm]
    version_command: [npm, --version]
    mode: batch
    # No {files}: npm audits the resolved tree, not a file list.
    command: [npm, audit, --audit-level=high, --json]
    timeout_seconds: 180
    exit_codes:
      pass: [0]
      fail: [1]
    coverage:
      # The audit's own count of what it resolved. A registry outage that
      # produces an empty tree exits 0 and looks identical to a clean audit —
      # this number is what tells them apart.
      #
      # Two shapes. `totalDependencies` is the old report; npm 10.9.4 prints
      # `"metadata": {"dependencies": {..., "total": N}}` instead and has no
      # `totalDependencies` at all - measured on a clean one-dependency lockfile,
      # where the old pattern matched nothing and every clean audit was hollow.
      from: stdout_count
      pattern: '(?:"totalDependencies"\s*:\s*|"dependencies"\s*:\s*\{[^{}]*"total"\s*:\s*)([0-9]+)'
      min_covered: 1

  # --- 4 · SAST, baseline -------------------------------------------------
  #
  # THREE FLAGS EVERY SEMGREP CHECK BELOW CARRIES, each measured on semgrep
  # 1.171.0:
  #
  #   `--error`        without it semgrep exits 0 WITH findings. A file holding
  #                    `eval(input())` under p/default gave one finding and exit
  #                    0; `--error` made it exit 1. Without the flag `fail: [1]`
  #                    names a code semgrep never returns for a finding.
  #   `--metrics=off`  semgrep's own help: under the default `auto`, "metrics
  #                    are sent whenever the --config value pulls from the
  #                    Semgrep server", which every `p/` ruleset does.
  #   `--time`         in `rules_command` only. `--dump-config`, which this
  #                    template used to name, is not an option: `unknown option
  #                    '--dump-config'`, exit 2, so the rule count read 0 on
  #                    every run and the check was hollow whatever it scanned.
  #                    `--time` lists every rule that loaded for its target, and
  #                    `rules_pattern` matched exactly those ids - 342 of 342 over
  #                    one Python file. The list is PER LANGUAGE of the target,
  #                    so point it at one committed file in your main language,
  #                    and set the floor from what you measure. Left unedited the
  #                    target does not exist, semgrep exits 2, and the check
  #                    refuses - which is the safe way for it to be wrong.
  - id: sast
    why: the ordinary injection and path-traversal classes, on every change that touches code
    when:
      paths:
        - "**/*.py"
        - "**/*.js"
        - "**/*.ts"
        - "**/*.go"
    severity: block
    requires: [semgrep]
    version_command: [semgrep, --version, --disable-version-check]
    mode: batch
    command: [semgrep, --config, p/default, --json, --quiet, --metrics=off, --error, "{files}"]
    timeout_seconds: 600
    exit_codes:
      pass: [0]
      fail: [1]           # findings
      refused: [2, 4, 7]  # fatal error, invalid rule, every rule failed to load
    coverage:
      # Semgrep names each file it scanned in `paths.scanned`. Compare that
      # against the files this change actually touched: a parse failure makes
      # semgrep skip a file and still exit 0, which is a silent hole exactly
      # the shape of the one that motivated this whole stage.
      from: stdout_paths
      pattern: '"([^"]+\.(py|js|ts|go))"'
      must_cover: all_triggering
      min_covered: 1
      # A ruleset that failed to download is an empty ruleset, and an empty
      # ruleset always passes. Count the rules that actually loaded.
      min_rules: 50
      rules_command: [semgrep, --config, p/default, --json, --time, --quiet, --metrics=off, path/to/one/committed/file.py]
      rules_pattern: '"([a-z0-9_-]+(?:\.[A-Za-z0-9_-]+){3,})"'

  # --- 5 · SAST, authentication ------------------------------------------
  #
  # THE POINT OF PER-ITEM SCOPING. This check is not on the path list — it is
  # on the requirement tags. A requirement tagged `auth` attracts a stricter
  # ruleset, a longer timeout and a blocking verdict; a copy edit attracts
  # neither. The scoping follows what the change MEANS, which is recorded in
  # the living spec, not what it happens to touch.
  - id: sast-auth
    why: an authentication change earns more scrutiny than a copy edit, and the spec is where that is known
    when:
      tags: [auth, authn, authz, session, crypto, secrets]
    severity: block
    requires: [semgrep]
    version_command: [semgrep, --version, --disable-version-check]
    mode: batch
    command: [semgrep, --config, p/jwt, --config, p/secrets, --json, --quiet, --metrics=off, --error, "{files}"]
    timeout_seconds: 900
    exit_codes:
      pass: [0]
      fail: [1]
      refused: [2, 4, 7]
    coverage:
      from: stdout_paths
      pattern: '"([^"]+\.(py|js|ts|go))"'
      must_cover: all_triggering
      min_covered: 1
      min_rules: 10
      # Measured over one Python file: p/jwt loaded 3 rules and p/secrets 38.
      rules_command: [semgrep, --config, p/jwt, --config, p/secrets, --json, --time, --quiet, --metrics=off, path/to/one/committed/file.py]
      rules_pattern: '"([a-z0-9_-]+(?:\.[A-Za-z0-9_-]+){3,})"'

  # --- 6 · in-house script ------------------------------------------------
  #
  # Your own rule, held to the same contract as a vendor's: an argv list, a
  # version it can state, exit codes that separate a finding from a crash, and
  # a coverage assertion. `advise` because this one has a known false-positive
  # rate — it reports into the review brief and does not block the merge.
  #
  # Move it to `block` the week its findings stop being argued with. An
  # advisory check nobody ever promotes is a check nobody reads.
  - id: pii-log-scan
    # `enabled: false` takes a check out of force without deleting it: it is
    # reported as `disabled` rather than omitted, and every requirement it
    # claimed goes back to Missing. Switching every check off is a load error.
    enabled: true
    why: PII in a log line survives every retention policy the product promises
    when:
      paths:
        - "**/*.py"
        - "**/*.js"
        - "**/*.ts"
      tags: [pii, logging, privacy]
    severity: advise
    requires: [./scripts/check-pii-logging.sh]
    version_command: [./scripts/check-pii-logging.sh, --version]
    mode: per_file
    command: [./scripts/check-pii-logging.sh, "{file}"]
    timeout_seconds: 60
    exit_codes:
      pass: [0]
      fail: [1]
      refused: [2]
    coverage:
      from: per_file_exit
      examined_when_exit_in: [0, 1]
      must_cover: all_triggering
      min_covered: 1

  # --- 7 · suppressed stderr ----------------------------------------------
  #
  # `2>/dev/null` makes an ERROR and a genuine NO-MATCH identical. Once they
  # are identical, the run is green either way — and a check that examined
  # nothing looks exactly like a check that found nothing, which is the failure
  # this whole file exists to refuse, arriving one level down inside the tools.
  # In the repo that ships this template it hid three real defects in one
  # session: a broken count, a false absence, and a check that examined
  # nothing.
  #
  # `advise` HERE IS NOT TIMIDITY. Run it once before you set `block`: a repo
  # of any age has more of these than anyone expects, and blocking on day one
  # turns the rollout into an argument about the rule instead of a list of the
  # debt. The count is printed on every run. Promote to `block` the day it
  # reaches zero — a number, not a judgement call.
  #
  # EXEMPTIONS, AND WHY THEY COST A SENTENCE EACH. There are legitimate uses.
  # `command -v x >/dev/null 2>&1` is an existence TEST whose answer is the
  # exit status, and it is exempt structurally with no entry. Everything else
  # states a reason, in one of two places:
  #
  #   INLINE, for code you own — `# stderr-ok: <reason>` on the offending line.
  #   ALLOWLIST, for code you do not — an `--allow` argument, right here in the
  #   committed config, reviewed in the same diff as the check that grants it.
  #
  # Both refuse (exit 2) when the reason is missing or under 12 characters, and
  # the allowlist also refuses a snippet that does not itself quote the
  # redirection — a snippet naming only the surrounding code would exempt that
  # whole line forever, including a suppression added to it next year. A check
  # that can be silenced without saying why is the thing this check prevents.
  #
  # `check-stderr.sh` ships with this skill under `skills/spec/scripts/`. Copy
  # it to `./scripts/` or point the paths below at the plugin; either way a
  # repo-local tool path needs `policy.allow_repo_local_tools: true`.
  - id: stderr-suppression
    why: an error and a genuine no-match are indistinguishable once stderr is discarded, and a hollow check then looks exactly like a clean one
    when:
      paths:
        - "**/*.sh"
        - "**/*.bash"
    severity: block
    requires: [./scripts/check-stderr.sh]
    version_command: [./scripts/check-stderr.sh, --version]
    mode: per_file
    command:
      - ./scripts/check-stderr.sh
      # One entry per exemption. FILE::SNIPPET::REASON — the snippet is a
      # literal substring of the offending line and must contain the
      # redirection itself; the reason is a sentence someone can disagree with
      # in review. Delete these two examples; they describe another repo.
      - --allow
      - 'scripts/build-view.sh::2>/dev/null || :::the builder runs against a repo that may have no history, no tags and no remote, and every one of these lines already turns a failure into no data with || :'
      - --allow
      - 'scripts/run-checks.sh::$pid" 2>/dev/null::kill and wait address a pid this script started and owns, so the only stderr is ESRCH from a child that already exited'
      - "{file}"
    timeout_seconds: 60
    exit_codes:
      pass: [0]
      fail: [1]        # suppressed stderr found
      refused: [2]     # unreadable file, or an exemption with no reason
    coverage:
      from: per_file_exit
      # 0 = clean, 1 = findings. Both mean the file was read. A 2 is a file it
      # bounced off or an exemption it would not honour, and neither is a file
      # it checked.
      examined_when_exit_in: [0, 1]
      must_cover: all_triggering
      min_covered: 1

  # --- 8 · one living spec per product ------------------------------------
  #
  # The declared-checks answer to "exactly one living spec per product". It
  # reads `product.spec_home` and `product.repos` out of config.json and asks
  # every repo one question: do you hold the spec file? Two answers of yes is a
  # failure — two allocators both handing out R42, two specs both believed, and
  # the divergence found later by whoever trusted the wrong one. Zero is also a
  # failure.
  #
  # UNREACHABLE IS NOT ABSENT. A repo the check cannot open exits 2 — refused,
  # distinct from both pass and fail — and is never counted as "no spec there".
  # Counting it as absent is precisely how a two-spec product reports as a
  # one-spec product: the second spec is in the repo nobody could reach.
  #
  # `always`, because this failure does not arrive in a diff. A repo joins the
  # product, or someone scaffolds a spec in the wrong place, and no file in
  # this repo changes.
  #
  # Multi-repo products need to tell it where the other checkouts are:
  # `--repo owner/name=../name` per repo, or `--remote` to ask the GitHub
  # contents API via `gh`. `--remote` is off by default because a check that
  # reaches the network is not deterministic, and a rate limit would read as an
  # outage rather than a verdict.
    limitations:
      - Fourteen suppressions remain, exempted by allowlist entries with written reasons. Three rest on a measured SIGPIPE from a deliberate cap, and they exempt the whole line - a genuine error on it would still be hidden.

  - id: spec-home
    why: two repos both holding a living spec means two allocators both handing out R42, and nothing else in the lifecycle notices
    when:
      always: true
    severity: block
    requires: [./scripts/check-spec-home.sh]
    version_command: [./scripts/check-spec-home.sh, --version]
    mode: batch
    command: [./scripts/check-spec-home.sh, --config, .claude/productizer/config.json]
    timeout_seconds: 60
    exit_codes:
      pass: [0]
      fail: [1]        # too many specs, none, or not where the config says
      refused: [2]     # a repo out of reach, or a config that cannot be read
    coverage:
      # The check's own count of repos it actually REACHED. A run that reached
      # none prints 0 and fails coverage as well as exiting 2: a spec count
      # nobody could compute is not a spec count of zero.
      from: stdout_count
      pattern: 'repos reachable:\s*([0-9]+)'
      min_covered: 1

  # --- 9 · a control framework, wired to the same tags --------------------
  #
  # `when.tags` matches REQUIREMENT TAGS carried by the change — and a tag is
  # just a string, so a control id is a tag like any other. Tag a requirement
  # `A.8.28` in the living spec and this check fires on exactly the changes
  # that touch that control, and on nothing else. No second system, no
  # spreadsheet kept in parallel, no quarterly reconciliation between the two.
  #
  # QUOTE THE IDS. `A.8.28` is fine bare, but `42001-6.1.2` is not obviously a
  # string to a YAML parser and `8.28` would be read as a number. Quote them
  # all and stop thinking about it.
  #
  # WHAT THIS BUYS, EXACTLY: for the control ids you tag, a dated, per-change
  # record of which tool ran, at which version, over which files, and what it
  # covered. That is the evidence layer UNDER a management system. It is not
  # the management system. `references/checks.md` sets out the boundary in
  # full — read it before anyone writes "ISO 27001 compliant" on a slide.
    limitations:
      - A repo it cannot open is refused, never counted as having no spec. But a product whose repos are not all declared is invisible to it entirely.

  - id: secure-coding-controls
    why: a change touching a tagged control gets the control's own scan, on the change that touches it, with a dated record of what was covered
    when:
      tags:
        - "A.8.28"        # ISO/IEC 27001:2022 Annex A — secure coding
        - "A.8.26"        # application security requirements
        - "42001-6.1.3"   # ISO/IEC 42001 — AI risk treatment
    severity: block
    requires: [semgrep]
    version_command: [semgrep, --version, --disable-version-check]
    mode: batch
    command: [semgrep, --config, p/secure-defaults, --json, --quiet, --metrics=off, --error, "{files}"]
    timeout_seconds: 900
    exit_codes:
      pass: [0]
      fail: [1]
      refused: [2, 4, 7]
    coverage:
      from: stdout_paths
      pattern: '"([^"]+\.(py|js|ts|go))"'
      must_cover: all_triggering
      min_covered: 1
      # Was 10. p/secure-defaults loaded ONE rule over a Python file, so a floor
      # of ten refused every Python run whatever it scanned. Measure yours.
      min_rules: 1
      rules_command: [semgrep, --config, p/secure-defaults, --json, --time, --quiet, --metrics=off, path/to/one/committed/file.py]
      rules_pattern: '"([a-z0-9_-]+(?:\.[A-Za-z0-9_-]+){3,})"'
      # THE CLAIM IS NOT THE EVIDENCE. Naming the requirement the control is
      # tagged on ties this check's result to that requirement in the report;
      # if the check is disabled, its tool is missing, or it came back hollow,
      # the claim is voided and the requirement goes back to Missing.
      #
      # spec_units:
      #   - {id: R44, verdict: Covered, evidence: "p/secure-defaults over every file in the change"}

  # --- a halt that nobody was asked to answer --------------------------------
  #
  # R23 says the lifecycle shall stop and ask which wins. The acceptance row for
  # it asserted the STOP and not the ASK, and the two are not the same event:
  # the halt worked, no ruling was ever drafted, and the work stopped and stayed
  # stopped with nobody holding a question. This check observes the ask.
  #
  # It asserts the obligation, not the implementation. The cautionary case in
  # this repo is R18, whose row says `argv[0] validation` while the principle it
  # enforces requires the whole argv - a row that describes what the code does
  # can never fail.
  #
  # `always`, because the failure does not arrive in a diff. A contradiction is
  # raised in conversation and abandoned; no file changes, which is precisely
  # the problem.
  #
  # UNREADABLE IS NOT ABSENT. A rulings directory nobody can open exits 2, never
  # 0 - a directory nobody can open is exactly where an unasked question hides.
  - id: ruling-requested
    why: a contradiction that halted without a drafted ruling leaves nobody holding the question, and the spec shows nothing waiting
    when:
      always: true
    severity: block
    requires: [./plugins/productizer/skills/spec/scripts/check-ruling-requested.sh]
    version_command: [./plugins/productizer/skills/spec/scripts/check-ruling-requested.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/check-ruling-requested.sh]
    timeout_seconds: 60
    exit_codes:
      pass: [0]
      fail: [1]        # a concern with no ruling, a ruling nothing cites, or a ruling still wearing the template
      refused: [2]     # the rulings directory or one of its files could not be read
    coverage:
      # Files the check actually opened, one per line. The spec is always one of
      # them, so a run that opened nothing is a bug rather than an empty repo.
      from: stdout_paths
      pattern: '^(\S+)$'
      min_covered: 1

  # --- agent templates carry frontmatter nothing reads ------------------------
  #
  # Declared checks covered all files (hygiene), `**/*.sh` and the solver corpus.
  # The agent templates carry YAML frontmatter that selects a model, a tool set
  # and a permission mode - and nothing validated it. A typo in a key name does
  # not fail loudly; it silently falls back to a default, so a template that
  # asked for a restricted tool set quietly gets the unrestricted one.
  #
  # `always`, because the failure does not arrive in a diff: a key stops being
  # honoured when the host changes, not when the template does.
    limitations:
      - It observes that a ruling was drafted, not that the question was good. A ruling can pass every field check and still ask something nobody can answer.
      - A contradiction stopped in conversation with nothing written leaves it nothing to find.

  - id: template-frontmatter
    why: a mistyped frontmatter key does not fail, it falls back to a default, so a template that asked for a restricted tool set silently gets the unrestricted one
    when:
      always: true
    severity: block
    requires: [python3]
    version_command: [python3, ./plugins/productizer/skills/spec/scripts/check-frontmatter.py, --version]
    mode: batch
    command: [python3, ./plugins/productizer/skills/spec/scripts/check-frontmatter.py]
    timeout_seconds: 60
    exit_codes:
      pass: [0]
      fail: [1]        # frontmatter that will not do what it says
      refused: [2]     # bad invocation, or a template that could not be read
    coverage:
      # The check's own count of files it opened. A file nobody could read is
      # counted as could-not-run, never as a file that passed.
      from: stdout_count
      pattern: '([0-9]+) file\(s\) checked'
      min_covered: 1

  # --- the guide the release ships with ---------------------------------------
  #
  # R9 says the lifecycle shall regenerate the user guide from the active
  # requirements when a release is prepared. Nothing did, and it was not a
  # theoretical gap: v4.8.0 and v4.8.1 both shipped from a hand-edited GUIDE.md.
  #
  # `--check` REGENERATES INTO MEMORY AND WRITES NOTHING, which is the only way
  # a check may touch a file somebody edits. A check that quietly fixed the
  # guide would report a pass on a release nobody had read the guide for.
  #
  # `always`, deliberately not a path trigger. Drift does arrive in a diff of
  # either file, but a paths trigger reports `not_triggered` on every other
  # commit, and this is the one fact worth knowing on the commit where a release
  # is cut. It reads two files in under a tenth of a second.
  #
  # AN UNREADABLE SPEC IS 3, NOT 0. A guide generated from a spec nobody could
  # open would describe a product nobody agreed to, so it refuses to render a
  # count it could not measure - and refused is not a pass.
    limitations:
      - It checks the frontmatter of the agent templates only. A key the host silently ignores still reads as valid here.

  - id: guide-current
    why: two releases shipped from a hand-edited guide, and a guide describing behaviour the spec never agreed to reads exactly like one that does
    when:
      always: true
    severity: block
    requires:
      - ./plugins/productizer/skills/spec/scripts/build-guide.sh
      - python3
    version_command: [./plugins/productizer/skills/spec/scripts/build-guide.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/build-guide.sh, --check]
    timeout_seconds: 60
    exit_codes:
      pass: [0]
      fail: [1]        # the committed guide is out of date with the spec
      refused: [2, 3]  # no markers to write between, or a spec that could not be read
    coverage:
      # The script's own count of active requirements it rendered. A run that
      # rendered none never prints this line - it exits 3 - so a zero here is
      # impossible rather than merely unlikely.
      from: stdout_count
      pattern: '([0-9]+) active requirement\(s\) rendered'
      min_covered: 1

  # --- a view that writes back, or a page that can republish itself ---------
  #
  # R4 says every published view shall be read-only WITH RESPECT TO THE SPEC.
  # That is two obligations failing in different places, so one check asserts
  # both: the generator writes nothing into the tree (every file hashed before
  # and after, content AND mtime, generating into a temporary --out), and the
  # page it produces declares no capability that can publish a new version of
  # itself. `downloads` is output and passes. A capability name this check
  # cannot classify also fails, because an unrecognised capability has not been
  # shown to be output-only - failing safe is the point.
  #
  # `always`, because neither failure arrives in a diff: the page's capability
  # is decided by the generator, and a stray write can come from anything it
  # calls.
  #
  # A PAGE THAT COULD NOT BE BUILT IS EXIT 2, never "0 capabilities declared".
    limitations:
      - It compares the generated section against the spec. The hand-written prose around it can say anything, and nothing checks that.

  - id: view-read-only
    why: a view that writes into the repo, or a page that can save new versions of itself, makes the provenance line under every panel false - the page becomes a second source of truth that can disagree with the repo
    when:
      always: true
    severity: block
    requires: [./plugins/productizer/skills/spec/scripts/check-view-readonly.sh]
    version_command: [./plugins/productizer/skills/spec/scripts/check-view-readonly.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/check-view-readonly.sh]
    timeout_seconds: 180
    exit_codes:
      pass: [0]
      fail: [1]        # a repository file moved, or the page declared something it may not
      refused: [2]     # no work tree, no builder, or a page that could not be generated
    coverage:
      # One bare path per repository file hashed. `must_cover: none` and NOT
      # all_triggering, deliberately: this examines the whole tree rather than
      # the change, so a commit that DELETES a file would name a path that no
      # longer exists and the check would be called hollow for being right. The
      # real hollowness guard is inside the check - an empty file list is exit 2.
      from: stdout_paths
      pattern: '^(\S+)$'
      must_cover: none
      min_covered: 1

  # --- an absent tool must be reported missing, not skipped -----------------
  #
  # R13. The behaviour lives in run-checks.sh and was demonstrated by hand; a
  # demonstration is not a test. Nothing stopped a refactor turning
  # `missing_tool` back into a skip while every run stayed green, because a
  # skipped check is invisible: no finding, no failure, no line anyone reads.
  #
  # Six things are asserted separately, and the last one is the one that
  # matters: that it counts as a blocking failure with verdict `refused`. A
  # status written into a file that does not change the verdict is a skip
  # wearing a different name.
  #
  # The fixture's own premise is guarded: if its declared tool turns out to be
  # installed, the case was never tested and that is exit 2 - unmeasured, not a
  # pass.
    limitations:
      - It reads what the page ASKS for. A capability granted in the publish call and never used by the page leaves no trace in the file.
      - The forbidden-name list comes from the reference doc, not the live runtime roster. An unrecognised name fails safe, but the classification is unverified.
      - The two hashes bracket the generator's run, so anything else writing to the tree in that window is attributed to it.

  - id: missing-tool-reported
    why: a check whose tool is absent has to refuse the stage, and a refactor turning that back into a skip would leave every run green with no scanner behind it
    when:
      always: true
    severity: block
    requires: [./plugins/productizer/skills/spec/scripts/check-missing-tool.sh]
    version_command: [./plugins/productizer/skills/spec/scripts/check-missing-tool.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/check-missing-tool.sh]
    timeout_seconds: 120
    exit_codes:
      pass: [0]
      fail: [1]        # an absent tool is no longer reported the way R13 requires
      refused: [2]     # no fixture, no runner, or the fixture's tool turned out to be installed
    coverage:
      # The three files it opened: the runner under test and the two fixture
      # files. A run that printed fewer opened fewer, and did not run the case.
      from: stdout_paths
      pattern: '^(\S+)$'
      must_cover: none
      min_covered: 3

  # --- a requirement nobody said how to prove ---------------------------------
  #
  # R8 says the lifecycle shall allocate the next unused id AND RECORD IT IN THE
  # ACCEPTANCE CRITERIA TABLE. `validate-spec.py` owns the id half. Nothing owned
  # the other clause, and its failure is silent: a requirement lands, gets cited
  # by a plan, a branch and a PR title, and never acquires a row saying what
  # would prove it.
  #
  # A ROW IS NOT DEMANDED OF SUPERSEDED, WITHDRAWN OR INFERRED REQUIREMENTS. The
  # first two are frozen records. The third is references/import.md:70, which
  # says an inferred requirement gets no row precisely because this comparison is
  # what answers "do the tests assert the criteria". Demanding one is not a
  # stricter check, it is a wrong one that goes permanently red against a correct
  # spec.
  #
  # `always`, because the failure does not arrive in a diff: a row goes missing
  # when a requirement is added elsewhere in the file, not when the acceptance
  # table is edited. The table is the thing that did NOT change.
  #
  # MEASURED 2026-08-30: 25 active, 25 rows, 0 missing - so it lands blocking
  # rather than advisory. The count prints on every run, so if it ever has to
  # drop to `advise`, the day to promote it back is not a judgement call.
    limitations:
      - It exercises batch mode and the PATH-lookup branch. The executable-path branch and per_file mode are untested.

  - id: acceptance-rows
    why: a requirement with no acceptance row is one nobody can tell "verified" from "never looked at" for, and every plan and PR citing its id inherits that
    when:
      always: true
    severity: block
    requires: [./plugins/productizer/skills/spec/scripts/check-acceptance-rows.sh]
    version_command: [./plugins/productizer/skills/spec/scripts/check-acceptance-rows.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/check-acceptance-rows.sh]
    timeout_seconds: 60
    exit_codes:
      pass: [0]
      fail: [1]        # an active requirement with no row, named by id and line
      refused: [2]     # a spec that could not be read or could not be parsed
    coverage:
      # Every requirement PARSED, not the subset that produced findings.
      # "0 missing rows" is only a claim about a spec somebody actually parsed.
      from: stdout_count
      pattern: 'requirements read:\s*([0-9]+)'
      min_covered: 1

  # --- an import that reads as agreed -----------------------------------------
  #
  # R10. `build-view.sh` RENDERS the inferred status and nothing asserted it was
  # ever applied - the view's own comment calls an unmarked import "the precise
  # failure the inferred status exists to prevent". Unmarked, the audit trail
  # records a decision nobody made, and the Stage 2 halt starts defending an
  # imported accident with the authority of a ratification.
  #
  # THERE IS NO RELIABLE SIGNAL THAT AN IMPORT HAPPENED, AND THE CHECK SAYS SO ON
  # EVERY RUN. Stage 0c writes no artifact and sets no config key. The obvious
  # signal - the word "import" in a commit message - was built and MEASURED
  # FIRST, and attributed six requirements to an import in a fixture where four
  # were agreed one at a time. On THIS repo that is not hypothetical: it is a
  # lifecycle tool WITH an import stage, so a requirement about importing carries
  # the word while having nothing to do with a Stage 0c run. A check that fails
  # on a correct spec gets switched off.
  #
  # So detection is structural: a spec holding an inferred requirement is a spec
  # an import touched. From each MARKED requirement it reaches the batch - the
  # change-log row naming it, and the commit that INTRODUCED it, oldest first so
  # a later reflow is not read as the import - and demands the marking of every
  # sibling. `Stage 0c` is the one piece of prose trusted, being a stage
  # identifier rather than an English word.
  #
  # THE HOLE, STATED: an import that marked NOTHING and named no stage is
  # invisible here, because both structural cohorts start from a marker. The run
  # prints all three cohort tallies and says in words that no import was FOUND,
  # which is not the same fact as an import having been marked correctly.
  # Closing it needs an artifact Stage 0c does not write.
  #
  # GIT IS PART OF THE INPUT. A history that cannot be walked is exit 2 with that
  # cohort printed as an em dash - never as 0 commits.
    limitations:
      - It asserts a row EXISTS, never that the row is true. A row saying nothing asserts this satisfies it exactly as well as a real verifier.

  - id: import-marking
    why: a drafted requirement that lost its inferred marker reads as agreed, so the contradiction halt starts defending an imported accident with the authority of a decision nobody made
    when:
      always: true
    severity: block
    requires: [./plugins/productizer/skills/spec/scripts/check-import-marking.sh]
    version_command: [./plugins/productizer/skills/spec/scripts/check-import-marking.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/check-import-marking.sh]
    timeout_seconds: 120
    exit_codes:
      pass: [0]
      fail: [1]        # a requirement attributed to an import with no marking
      refused: [2]     # an unparseable spec, or a git history that could not be walked
    coverage:
      # Every requirement PARSED. Deliberately NOT the attribution count, which
      # is legitimately 0 on a repo that was never imported and would make every
      # honest run read as hollow.
      from: stdout_count
      pattern: 'requirements read:\s*([0-9]+)'
      min_covered: 1

  # --- a classification nobody can check ------------------------------------
  #
  # R6 says an intent is classified against the WHOLE living spec. A graded eval
  # scored 16/16 on OUTCOMES, which is equally consistent with a classifier that
  # read all 25 active requirements and one that read the first eight and got
  # lucky on a small spec. Outcomes cannot separate those, and the gap widens
  # with every requirement added. What separates them is the list of ids that
  # were actually in front of it.
  #
  # R19 says an unreachable spec home is a stop, not a classification against a
  # remembered copy. Written as a rule it is enforced by whoever remembers it.
  # Written as a hash it is enforced by arithmetic: no readable spec home means
  # no hash, the writer refuses to emit a record without one and creates nothing,
  # and this check refuses a record that has none. Classifying from a remembered
  # copy stops being forbidden and becomes impossible to RECORD.
  #
  # THE ONE PLACE AN EM DASH IS REFUSED. Everywhere else in this lifecycle an
  # unmeasured value is an em dash. Here the correct answer to an unreachable
  # spec is NO RECORD, so a record that honestly writes the gap in is a
  # classification that should never have happened wearing the paperwork of one
  # that did.
  #
  # A RECORD MADE AGAINST AN OLDER SPEC IS NOT A FINDING. The comparison is
  # anchored to the commit the record cites, not to the spec today. The normal
  # intake flow is classify, then merge the delta - so anchoring to today would
  # take this red on every historical record the first time a requirement was
  # added, and a check that is always red gets deleted.
  #
  # `always`, because the failure does not arrive in a diff: an intent is
  # classified against half a spec and nothing in the repo changes.
    limitations:
      - An import that marked nothing at all and named no stage is invisible: both structural cohorts start from a marker. The run says no import was FOUND, which is not the same fact as an import having been marked correctly. Closing this needs an artifact Stage 0c does not write.

  - id: classification-provenance
    why: a graded eval scored 16/16 on classification OUTCOMES, which is equally consistent with a classifier that saw half the spec and got lucky; only the ids that were in scope tell those apart
    when:
      always: true
    severity: block
    requires: [./plugins/productizer/skills/spec/scripts/check-classification-provenance.sh]
    version_command: [./plugins/productizer/skills/spec/scripts/check-classification-provenance.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/check-classification-provenance.sh]
    timeout_seconds: 60
    exit_codes:
      pass: [0]        # every record stands up, or there are none and it says so
      fail: [1]        # a truncated scope list, a hash that does not match, a missing or placeholder hash, two records for one intent, or a fifth classification value
      refused: [2]     # no work tree, no spec, an unreadable store or record, or a recorded commit this clone cannot resolve
    coverage:
      # Files actually opened, one per line. The spec is always one of them, so
      # a run that opened nothing is a bug rather than a repo with no records.
      # `must_cover` omitted deliberately: an `always` check taking no {files},
      # the same shape as ruling-requested.
      from: stdout_paths
      pattern: '^(\S+)$'
      min_covered: 1

  # --- a replaced requirement rewritten years later --------------------------
  #
  # R3's marking half is readable in the file in front of you. Its TEXT half is
  # not readable there at all: the spec always says whatever it currently says,
  # and a superseded requirement whose sentence was quietly rewritten looks
  # exactly like one nobody touched. The original survives only in git.
  #
  # This is the first check here to take GIT HISTORY as an input, and it reads
  # what a commit USED TO SAY rather than what a commit changed. A diff-only
  # gate sees an edit at the moment it is proposed and never again - which is
  # how both of this repo's real leaks survived: one in a blob, one in a commit
  # message, neither visible to any diff after the commit that made it.
  #
  # The baseline is chosen PER REQUIREMENT: the newest commit at which that
  # requirement was still active. One ref cannot be that commit for every id,
  # which is why validate-spec.py --baseline cannot answer R3.
  #
  # `always`. The edit that matters was merged some commits ago and is, to
  # every diff since, simply the agreed text.
  #
  # min_covered: 2 is deliberate. One covered path means the spec was read and
  # NO history was - precisely the run that answers nothing while exiting 0.
    limitations:
      - A classification that left no record at all is invisible. Zero recorded is not detectable as an intake that classified in conversation and wrote nothing.
      - It proves the scope list matches the spec it names. That the named commit is the RIGHT one is established by the writer, not by this.

  - id: superseded-text
    why: a superseded requirement's sentence can be rewritten long after the fact and nothing in the file shows it; only the commit before the supersede holds what was agreed
    when:
      always: true
    severity: block
    requires:
      - ./plugins/productizer/skills/spec/scripts/check-superseded-text.sh
      - ./plugins/productizer/skills/spec/scripts/spec-requirements.sh
      - git
    version_command: [./plugins/productizer/skills/spec/scripts/check-superseded-text.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/check-superseded-text.sh]
    timeout_seconds: 120
    exit_codes:
      pass: [0]
      fail: [1]        # text altered, marker removed, or a pointer to nothing
      refused: [2]     # a shallow clone, an untracked spec, a spec with no requirements
    coverage:
      from: stdout_paths
      pattern: '^(\S+)$'
      min_covered: 2

  # --- a spec change merged under a live contradiction ------------------------
  #
  # R12. The load-bearing word is DEPENDS. references/rulings.md: "A pending
  # ruling blocks its own delta and nothing else. Unrelated intents keep
  # flowing." A check refusing every spec change while any ruling is pending
  # would enforce the opposite of R12 while passing for it - and would fail
  # slowly, by teaching people to stop routing work through intake at all.
  #
  # Scope is derived from the ruling itself: the requirement quoted in its
  # `## The conflict` section, plus the ids in the concern row citing it.
  # Everything else is REPORTED as allocated and let through, on its own line,
  # so the decision not to block is visible rather than silent.
  #
  # `always`, because the window a pending ruling holds open starts at the
  # commit that raised it - older than whatever is under review now - and a
  # ruling raised in a different PR governs this one.
  #
  # UNREADABLE IS NOT ABSENT. No rulings directory is clean and says so: R12
  # governs a state this repo has never entered. A rulings directory that
  # exists and cannot be listed is exit 2 - that is where an unruled
  # contradiction hides.
    limitations:
      - A requirement that ENTERS the repo already superseded and already rewritten cannot be caught: its first commit is the only baseline there is.
      - A shallow clone is refused rather than passed, which means CI must fetch full history for this to measure anything.

  - id: pending-ruling-scope
    why: a pending ruling that blocks nothing is a stop nobody obeys, and one that blocks everything is a stop everybody routes around
    when:
      always: true
    severity: block
    requires:
      - ./plugins/productizer/skills/spec/scripts/check-pending-ruling-scope.sh
      - ./plugins/productizer/skills/spec/scripts/spec-requirements.sh
      - git
    version_command: [./plugins/productizer/skills/spec/scripts/check-pending-ruling-scope.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/check-pending-ruling-scope.sh]
    timeout_seconds: 120
    exit_codes:
      pass: [0]
      fail: [1]        # a spec change depending on an unruled contradiction
      refused: [2]     # a ruling that cannot be scoped, or a window out of reach
    coverage:
      from: stdout_paths
      pattern: '^(\S+)$'
      min_covered: 1
    limitations:
      - The incoming behaviour merged under a sentence with a different EARS trigger than the contested requirement is not recognised. Closing it needs a similarity threshold, which starts refusing unrelated intents - the failure rulings.md names.
