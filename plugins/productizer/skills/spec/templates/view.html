      +'<span class="st '+(CH[f[2]]||"")+'">'+esc(f[2])+'</span>'
      +'<button class="cp" data-copy="'+esc(cp.t)+'">'+cp.l+'</button></div>';
  }).join("");
  document.getElementById("dacts").innerHTML=md.acts.map(function(a){
    return '<div class="act"><span class="al">'+esc(a[0])+'</span><span class="ap">'+esc(a[1])+'</span>'
      +'<div><button class="cp" data-copy="'+esc(a[1])+'">copy prompt</button></div></div>';
  }).join("");
}
var CUR=CUR0, CURM=0;
nodes(); pick(CUR0,0); hubHuman();
// The hub opens as the person and returns to them on click. pick() overwrites
// it with the selected stage, so this runs AFTER pick on load - order matters,
// and getting it wrong shows a stage where the person should be.
(function(){ var h=document.getElementById("hub");
  if(h){ h.style.cursor="pointer"; h.title="what is waiting on a person";
         h.addEventListener("click", function(){ hubHuman(); humanList(); }); } })();
document.getElementById("dmod").addEventListener("change",function(e){
  CURM=+e.target.value; paintMod(S[CUR].mods[CURM]);
});
// Factored out of the tab click because an in-page link whose target sits in a
// hidden panel has to open that panel first - a fragment that resolves to a
// display:none element scrolls nowhere, which is a dead end wearing a link's
// clothes. A second copy of this toggle is how the two drift apart, so there
// is one.
function showTab(pid){
  document.querySelectorAll(".tab").forEach(function(x){x.classList.toggle("on",x.dataset.p===pid);});
  document.querySelectorAll(".panel").forEach(function(p){p.classList.toggle("on",p.id==="p-"+pid);});
}
document.getElementById("tabs").addEventListener("click",function(e){
  var t=e.target.closest(".tab"); if(!t) return;
  showTab(t.dataset.p);
});
// Open whatever panel the target lives in, then let the browser do its own
// jump - so the URL still carries the fragment and the back button still
// works. getElementById rather than querySelector: the ids are minted from
// arbitrary text and a selector would need escaping that a fragment does not.
// A stage anchor also selects that stage in the ring, through the same pick()
// the ring nodes use.
function openAnchor(hash){
  if(!hash||hash.charAt(0)!=="#") return;
  var el=document.getElementById(hash.slice(1)); if(!el) return;
  var panel=el.closest(".panel");
  if(panel) showTab(panel.id.replace(/^p-/,""));
  if(el.classList.contains("rnode")) pick(+el.dataset.i,0);
}
document.addEventListener("click",function(e){
  var a=e.target.closest('a[href^="#"]'); if(a) openAnchor(a.getAttribute("href"));
},true);
window.addEventListener("hashchange",function(){openAnchor(location.hash);});
document.addEventListener("click",function(e){
  var n=e.target.closest(".rnode"); if(n){pick(+n.dataset.i,0); return;}
  var b=e.target.closest(".cp, .bk-act"); if(!b) return;
  var txt=b.dataset.copy||"";
  var done=function(){var w=b.textContent;b.textContent="copied";b.classList.add("done");
    setTimeout(function(){b.textContent=w;b.classList.remove("done");},1300);};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done,function(){fb(txt,done);});
  } else fb(txt,done);
});

(function(){
  var list=document.getElementById("bklist"); if(!list) return;
  var note=document.getElementById("bksortnote"), copy=document.getElementById("bkcopy");
  var mode="rank", dragged=null;

  function draggableNow(){ return mode==="rank"; }
  list.addEventListener("dragstart",function(e){
    if(!draggableNow()){e.preventDefault();return;}
    var li=e.target.closest(".bk"); if(!li) return;
    dragged=li; li.classList.add("drag"); e.dataTransfer.effectAllowed="move";});
  list.addEventListener("dragend",function(){
    if(dragged)dragged.classList.remove("drag");
    list.querySelectorAll(".over").forEach(function(x){x.classList.remove("over");});
    dragged=null; renumber(); sync();});
  list.addEventListener("dragover",function(e){
    if(!draggableNow()||!dragged) return;
    e.preventDefault();
    var li=e.target.closest(".bk"); if(!li||li===dragged) return;
    list.querySelectorAll(".over").forEach(function(x){x.classList.remove("over");});
    li.classList.add("over");
    var r=li.getBoundingClientRect();
    list.insertBefore(dragged,(e.clientY-r.top)/r.height>0.5?li.nextSibling:li);});

  function renumber(){ [].forEach.call(list.querySelectorAll(".bk"),function(li,i){li.dataset.rank=i;}); }

  // Sorting by status is a way of LOOKING, not a reordering. The file's order is
  // the priority, so while status-sorted the list cannot be dragged and cannot be
  // copied back - the visible order is not the ranking any more.
  function apply(){
    var items=[].slice.call(list.querySelectorAll(".bk"));
    items.sort(mode==="rank"
      ? function(a,b){return a.dataset.rank-b.dataset.rank;}
      : function(a,b){return (a.dataset.st-b.dataset.st)||(a.dataset.rank-b.dataset.rank);});
    items.forEach(function(li){list.appendChild(li);
      li.setAttribute("draggable", mode==="rank"?"true":"false");});
    list.classList.toggle("bystatus", mode!=="rank");
    if(mode==="rank"){
      note.textContent="order is the priority — drag to change it";
      copy.style.display=""; sync();
    } else {
      note.textContent="grouped for reading. The file's order is still the priority, so this view cannot be dragged or copied back.";
      copy.style.display="none";
    }
  }
  document.addEventListener("click",function(e){
    var b=e.target.closest(".sb"); if(!b||!b.dataset.s) return;
    document.querySelectorAll(".sb").forEach(function(x){x.classList.toggle("on",x===b);});
    mode=b.dataset.s; apply();});

  function sync(){
    var out=["| Id | What is wanted | Status | Jira | Notes |","|---|---|---|---|---|"];
    list.querySelectorAll(".bk").forEach(function(li){
      var g=function(c){var n=li.querySelector(c);return n?n.textContent.trim():"";};
      out.push("| "+g(".bk-id")+" | "+g(".bk-what")+" | `"+g(".bk-st").replace("· jira","").trim()
        +"` | "+g(".bk-j")+" | "+g(".bk-note")+" |");});
    copy.dataset.copy="Replace the Items table in .claude/productizer/backlog.md with this order. Nothing else changes:\n\n"+out.join("\n");
  }
  renumber(); sync();
})();

document.addEventListener("keydown",function(e){
  if(!document.getElementById("p-stages").classList.contains("on")) return;
  if(e.key!=="ArrowLeft"&&e.key!=="ArrowRight") return;
  var cur=0; document.querySelectorAll(".rnode").forEach(function(n,k){if(n.classList.contains("on"))cur=k;});

// ---------- the visualizer's rail ------------------------------------------
// Builds the left-hand nav for the Visualizer panel out of the sections the
// generator actually wrote, and marks the one you are reading as you scroll.
//
// IT DERIVES, IT DOES NOT RESTATE. There is no list of section ids in this
// block and no list of headings: it walks the panel's own <section> children
// and takes each label from that section's own <h2>. A list kept here would be
// a second source of truth about a tree this page's whole point is to read,
// and it would be wrong the first day a seventh section landed. One section,
// nine sections and none all work, and none of the three needs an edit here.
//
// A SECTION THAT COULD NOT BE MEASURED IS NEVER DROPPED FROM THE RAIL. It is
// listed and marked with the word its own .vz-empty block used - `not run` or
// `unknown`, which are two different answers - so a reader who never scrolls
// that far still learns the thing was not measured. Omitting it would hide the
// one fact the section exists to report. A measured zero is not marked: it was
// measured, and the drawing below it says so.
//
// It reads the page it is already in and changes nothing outside it: no fetch,
// no storage, not even a memory of which section you last had open. Reloading
// gives you the top of the panel, which is where the generator's own ordering
// says to start.
(function(){

  var secs = [].slice.call(vz.children).filter(function(el){
    return el.tagName === "SECTION" && el.id && el.classList.contains("vz-sec");
  });
  if (!secs.length) return;

  // the generator wrote rather than guessed at from emptiness - an empty canvas
  // and a measured zero look identical, which is the whole reason .vz-empty
  // spells the answer out in words in the first place.
  function stateOf(sec){
    var bs = sec.querySelectorAll(".vz-empty > b");
    for (var i = 0; i < bs.length; i++){
      var t = bs[i].textContent.replace(/\s+/g, " ").trim(), u = t.toUpperCase();
      if (u.indexOf("NOT RUN") === 0) return {word: "not run", why: t};
      if (u.indexOf("UNKNOWN") === 0) return {word: "unknown", why: t};

    return null;
  }

  nav.className = "vz-rail";
  nav.setAttribute("aria-label", "Sections of the visualizer");
  var body = document.createElement("div");
  body.className = "vz-body";
  var items = [];

  secs.forEach(function(sec){
    var h = sec.querySelector("h2");
    var a = document.createElement("a");
    a.className = "vz-rl";
    a.setAttribute("href", "#" + sec.id);
    var t = document.createElement("span");
    t.className = "vz-rl-t";
    t.textContent = h ? h.textContent : sec.id;
    a.appendChild(t);
    var st = stateOf(sec);

      var m = document.createElement("span");
      m.className = "vz-rl-m";
      m.textContent = st.word;

    nav.appendChild(a);

  // hand-over, and the later one is the one whose heading has just arrived.
  // Measured, not reasoned about - first-crossing was written first, and at the
  // very bottom of the document, where the page can scroll no further, it left
  // the second-to-last section marked while the reader was looking at the last
  // one. That is the one position a top band cannot reach on its own.

// ---------- architecture: the declared graph, over five states -------------
// Reads VZ_ARCH, which the generator embedded in this file's own bytes, and
// draws it into the mount the generator left. It fetches nothing, stores
// nothing and posts nothing. If the generator wrote no mount, this is a no-op,
// exactly as the history block above is: the section is the generator's to
// create, and this block only paints inside it.
//
// THE ONE RULE THIS BLOCK EXISTS FOR. `not measured` must never look like
// `measured and fine`. So a state is drawn four times over - a glyph, a word
// on the face of the node, a border style, and hue last - and hue is never
// the only place an answer is written. See the .ag block in the stylesheet
// for why, and for which glyph means what.
//
// AND ITS COROLLARY. A graph that could not be BUILT is not a graph with
// nothing wrong in it. `unreadable` and `absent` are drawn as `?` and nothing
// else: no board, no zeros, no counts. A count nobody measured is worse than
// no count, because it looks like one somebody did.

  // legend's text and the inspector's text, from one place, so the legend
  // cannot come to disagree with what a node says about itself.
  var RS = {
    measured:   {g:"✓", w:"MEASURED",   k:"a-meas",
      m:"A check ran here and it PASSED. Genuinely covered."},
    never_ran:  {g:GL_NEVER, w:"NEVER RAN",  k:"a-never",
      m:"Claimed, but nothing triggered the check in this change. THIS IS NOT A PASS — " +
        "it is an absence of evidence, and it is drawn as one."},
    "void":     {g:"✗", w:"VOID",       k:"a-void",
      m:"A check claimed this and FAILED. A failing check voids its own claim, so the " +
        "requirement falls back to Missing. NOT a pass, and not merely “unknown”."},
    guard_shut: {g:"n/a",    w:"GUARD SHUT", k:"a-shut",
      m:"Unreachable here — the obligation’s Where… guard never opens in this " +
        "repository, so there is nothing to meet. Not unmet, and not measured either."},
    missing:    {g:"∅", w:"MISSING",    k:"a-miss",
      m:"Nothing asserts this at all. No check names it."}

    m:"The generator emitted a state this page has no rendering for. It is drawn as " +
      GL_UNK + " rather than as any of the five, because guessing which one it meant is " +
      "how a dashboard starts lying."};

  var KS = {
    pass:          {g:"✓", w:"PASS",          k:"a-meas", m:"ran and found nothing"},
    fail:          {g:"✗", w:"FAIL",          k:"a-void",
      m:"ran and found something. Every claim it makes is voided by that"},
    refused:       {g:"⊘", w:"REFUSED",       k:"a-void",
      m:"declined to answer. A refusal is not a pass"},
    hollow:        {g:"◌", w:"HOLLOW",        k:"a-miss",
      m:"exited zero having examined less than it declared. The exit code is not the measurement"},
    not_triggered: {g:GL_NEVER, w:"NOT TRIGGERED", k:"a-never",
      m:"nothing in this change reached it, so nothing here was measured. Not a pass"},
    unknown:       {g:GL_UNK,  w:"UNKNOWN",        k:"a-unk",  m:"its result could not be read"}

                          "no tool measures nothing"};
  }, null);

  // two disagree exactly where it matters: the deriver's own fixture carries a
  // `never_ran` requirement whose verdict is still `Covered`, and a node
  // reading `NEVER RAN · COVERED` hands the reader back the word this whole

  // `claimed` in front of it, in lower case, where the state word is upper.

    // says one thing twice; `NEVER RAN · claimed Covered` says two things, and
    // the second one is the claim the first one has just taken away.

      "Tab reaches every node in order."));
    insp.appendChild(el("p", "ag-itext",

      "that failed is voided by that failure; a claim from a check nothing triggered " +

  }

           : d.kind === "check" ? kspec(d)
           : (d.present ? {g:"✓", w:"PRESENT", k:"a-meas", m:"the file is on disk"}
                        : {g:"∅", w:"ABSENT", k:"a-miss",
                           m:"named by the configuration and not there"});

    hd.appendChild(el("span", "ag-iid", d.id));

    hd.appendChild(el("span", "vz-chip", d.kind));
    if (d.kind === "requirement" && d.verdict)
      hd.appendChild(el("span", "vz-chip", (d.state === "measured" ? "verdict: "
        : "claimed verdict: ") + d.verdict));
    insp.appendChild(hd);
    insp.appendChild(el("p", "ag-imean", sp.m));

    if (d.kind === "requirement"){
      if (d.text) insp.appendChild(el("p", "ag-itext", String(d.text)));
      insp.appendChild(el("p", "ag-ievh", "Evidence — why this is claimed, and by which check"));
      evList(d.evidence, "No evidence was recorded for this requirement. Nothing here says " +
        "why it reads as " + sp.w + ", which is itself the finding.");
      var cl = claimedBy[d.id] || [], names = [];
      for (i = 0; i < cl.length; i++)
        names.push(cl[i].from + (cl[i].voided ? " (claim voided)" : ""));
      insp.appendChild(el("p", "ag-itext ag-idim", names.length
        ? "Claimed by: " + names.join(", ") + "."
        : "No check claims this requirement."));
    } else if (d.kind === "check"){
      var lines = [];
      lines.push("Tool: " + (d.tool || runsOf[d.id] || GL_UNK) + ".");
      if (d.triggered === false){
        lines.push("Not triggered in this change, so it handed over " + GL_NEVER +
          " files and dropped " + GL_NEVER + " — an em dash, not a zero, because zero " +
          "would claim it looked and found none.");
      } else {
        lines.push("Handed over " + (num(d.files_handed_over) ? d.files_handed_over : GL_UNK) +
          " file(s); dropped " + (num(d.files_dropped) ? d.files_dropped : GL_UNK) + ".");
      }
      insp.appendChild(el("p", "ag-itext", lines.join(" ")));
      var cm = claimsOf[d.id] || [], out = [];
      for (i = 0; i < cm.length; i++)
        out.push(cm[i].to + (cm[i].voided ? " (voided by this check’s own result)" : ""));
      insp.appendChild(el("p", "ag-ievh", "Claims"));
      evList(out, "This check claims no requirement. It runs, and nothing on this page " +
        "depends on how it ends.");
    } else {
      insp.appendChild(el("p", "ag-itext",
        runBy[d.id] ? "Run by " + runBy[d.id] + "." : "No check in this reading runs it."));
    }
  }
  rest();

  /* --- focus fades the unrelated ----------------------------------------- */
  var wireList = wires.querySelectorAll("path");
  var nodeList = canvas.querySelectorAll(".ag-node");
  function hot(id){
    var j;
    if (!id){
      canvas.className = "vz-canvas ag-canvas";
      for (j = 0; j < wireList.length; j++) wireList[j].classList.remove("hot");
      for (j = 0; j < nodeList.length; j++) nodeList[j].classList.remove("hot");
      rest();
      return;
    }
    canvas.className = "vz-canvas ag-canvas ag-on";
    var keep = {};
    keep[id] = 1;
    for (j = 0; j < wireList.length; j++){
      var a = wireList[j].getAttribute("data-a"), b = wireList[j].getAttribute("data-b");
      var on = (a === id || b === id);
      wireList[j].classList.toggle("hot", on);
      if (on){ keep[a] = 1; keep[b] = 1; }
    }
    for (j = 0; j < nodeList.length; j++)
      nodeList[j].classList.toggle("hot", !!keep[nodeList[j].getAttribute("data-ag")]);
    if (byId[id]) show(byId[id]);
  }
  function bind(ev, fn){
    canvas.addEventListener(ev, function(evt){
      var t = evt.target;
      while (t && t !== canvas && !(t.classList && t.classList.contains("ag-node"))) t = t.parentNode;
      fn(t && t.getAttribute ? t.getAttribute("data-ag") : null);
    }, ev === "focusin" || ev === "focusout" ? false : true);
  }
  bind("mouseover", function(id){ if (id) hot(id); });
  bind("focusin", function(id){ if (id) hot(id); });
  canvas.addEventListener("mouseleave", function(){ hot(null); });
  canvas.addEventListener("focusout", function(evt){
    if (!evt.relatedTarget || !canvas.contains(evt.relatedTarget)) hot(null);
  });
})();
</script>
