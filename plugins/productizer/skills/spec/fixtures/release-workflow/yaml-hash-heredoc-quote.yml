# good.yml with ONE change: release-prep installs PyYAML with a heredoc whose body holds a lone single quote, then a quoted `#` before an unhashed install that bash runs (B182).
name: checks
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Self-tests
        run: |
          set -euo pipefail
          python3 plugins/productizer/skills/spec/scripts/check-ci-template.py --selftest

  release-prep:
    needs: checks
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          set -euo pipefail
          printf '%s\n' 'PyYAML==6.0.2 --hash=sha256:80bab7bfc629882493af4aa31a4cfa43a4c57c83813253626916b8c7ada83476 --hash=sha256:1f71ea527786de97d1a0cc0eacd1defc0985dcf6b3f17bb77dcfc8c34bec4dc5' > "$RUNNER_TEMP/pyyaml-requirements.txt"
          cat <<E
          '
          E
          echo ' #'; python3 -m pip install pyyaml==6.0.2
      - name: Title, notes and pinned template, made with a read-only token
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          out_dir="$RUNNER_TEMP/release-prep"
          mkdir -p "$out_dir"
          sha="$(git rev-parse --verify "${TAG}^{commit}")"
          if [ "$sha" != "$GITHUB_SHA" ]; then
            echo "::error::$TAG names commit $sha, but this run checked $GITHUB_SHA"
            exit 1
          fi
          pinned="$out_dir/build-from-spec.yml"
          check_log="$RUNNER_TEMP/check-ci-template.log"
          if ! python3 -I plugins/productizer/skills/spec/scripts/check-ci-template.py "$pinned" > "$check_log"; then
            cat "$check_log"
            exit 1
          fi
          if grep -q '^check-ci-template: note:' "$check_log"; then
            echo "::error::check-ci-template.py passed the pinned copy with a note"
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-prep
          path: ${{ runner.temp }}/release-prep/
          if-no-files-found: error

  release-draft:
    needs: [checks, release-prep]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-prep
          path: ${{ runner.temp }}/release-prep
      - name: Draft the release from the evidence, never publish it
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          in_dir="$RUNNER_TEMP/release-prep"
          title_file="$in_dir/title.txt"
          notes="$in_dir/release-notes.md"
          pinned="$in_dir/build-from-spec.yml"
          if ! grep -q -x -F "  PRODUCTIZER_SHA: \"$GITHUB_SHA\"" "$pinned"; then
            echo "::error::the pinned template does not set PRODUCTIZER_SHA to $GITHUB_SHA"
            exit 1
          fi
          title="$(cat "$title_file")"
          gh release create "$TAG" --draft --verify-tag --title "$title" --notes-file "$notes"
          gh release upload "$TAG" "$pinned"
